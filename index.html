/* ─── 二、变奏驱动器 ────────────────────────────────────────── */
const VariationDriver = {
  list: CORRIDOR_VARIATIONS,
  curIdx: 0,
  cur: null,
  next: null,
  tInVariation: 0,
  totalT: 0,
  switchT: -1,
  switchSwitchName: "",
  switchTint: [255,255,255],

  reset() {
    this.curIdx = 0;
    this.cur = this.list[0];
    this.next = this.list[1] || null;
    this.tInVariation = 0;
    this.totalT = 0;
    this.switchT = -1;
    PlatformForge.applyVariation(this.cur);
  },

  update(dt) {
    if (!this.cur) return;
    this.tInVariation += dt;
    this.totalT += dt;
    if (this.switchT >= 0) {
      this.switchT += dt;
      if (this.switchT > 1.4) this.switchT = -1;
    }
    if (this.tInVariation >= this.cur.duration) this._advance();
  },

  _advance() {
    if (this.curIdx >= this.list.length - 1) {
      CorridorPhase.end();
      return;
    }
    this.curIdx++;
    const oldCur = this.cur;
    this.cur = this.list[this.curIdx];
    this.next = this.list[this.curIdx + 1] || null;
    this.tInVariation = 0;
    this.switchT = 0;
    this.switchSwitchName = this.cur.name;
    this.switchTint = this.cur.tintRGB;

    ScreenFX.addTrauma(0.22);
    ScreenFX.triggerFlash(0.18, this.cur.tint);

    PlatformForge.applyVariation(this.cur);
    PlatformForge.scheduleEntryWave();
    HazardSystem.applyVariation(this.cur);
    StarSystem.applyVariation(this.cur);

    Log.log("[变奏] " + oldCur.id + " → " + this.cur.id +
            "  (总时长 " + this.totalT.toFixed(1) + "s)");
  },

  progress() {
    const totalDur = this.list.reduce((s, v) => s + v.duration, 0);
    return clamp(this.totalT / totalDur, 0, 1);
  },

  drawSwitchEffect(g) {
    if (this.switchT < 0 || !this.switchSwitchName) return;
    const T = this.switchT;
    const tint = this.switchTint;

    if (T < 0.25) {
      const p = T / 0.25;
      g.globalAlpha = p * 0.35;
      g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
      const F = CF.FRAME;
      const w = 20 * p;
      g.fillRect(F.x, F.y, F.w, w);
      g.fillRect(F.x, F.y + F.h - w, F.w, w);
      g.fillRect(F.x, F.y, w, F.h);
      g.fillRect(F.x + F.w - w, F.y, w, F.h);
      g.globalAlpha = 1;
    }

    if (T >= 0.35 && T < 1.2) {
      const p = (T - 0.35) / 0.85;
      const alpha = p < 0.15 ? p / 0.15 : (1 - (p - 0.15) / 0.85);
      const scale = p < 0.15 ? p / 0.15 : 1 + (p - 0.15) * 0.3;

      g.save();
      g.globalAlpha = clamp(alpha, 0, 1);
      g.font = `bold ${Math.round(36 * scale)}px "Courier New", monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const cx = CF.FRAME.x + CF.FRAME.w / 2;
      const cy = CF.FRAME.y + CF.FRAME.h / 2;

      g.fillStyle = "#000000";
      g.fillText(this.switchSwitchName, cx + 2, cy + 2);
      g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
      g.fillText(this.switchSwitchName, cx, cy);

      const w = g.measureText(this.switchSwitchName).width * scale;
      g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
      g.fillRect(cx - w / 2 - 40, cy - 1, 30, 2);
      g.fillRect(cx + w / 2 + 10, cy - 1, 30, 2);
      g.restore();
    }
  }
};

/* ─── 三、平台工厂（含可达性验证 + 变奏规则）────────────── */
const PlatformForge = {
  variation: null,
  lastLayer: 0,
  entryWaveT: -1,
  entryWaveLayer: 0,

  applyVariation(v) {
    this.variation = v;
    this.lastLayer = v.layerRange[0];
    const keep = CorridorPlatformSystem.list.filter(p => p.id < 3);
    CorridorPlatformSystem.list = keep;
  },

  scheduleEntryWave() {
    this.entryWaveT = 0;
    this.entryWaveLayer = this.variation.layerRange[0];
  },

  update(dt) {
    if (this.entryWaveT >= 0) {
      this.entryWaveT += dt;
      if (this.entryWaveT > 1.2) this.entryWaveT = -1;
    }
  },

  nextPlatform() {
    const v = this.variation;
    if (!v) return null;

    const typeIdx = this._weightedPick(v.platformWeights);
    const type = v.platformTypes[typeIdx];

    const [minL, maxL] = v.layerRange;
    let layer = this.lastLayer;

    if (v.layerDrift === "up") layer += Math.random() < 0.6 ? 1 : 0;
    else if (v.layerDrift === "down") layer += Math.random() < 0.6 ? -1 : 0;
    else if (v.layerDrift === "wave") layer += [-1, 0, 1][Math.floor(Math.random() * 3)];
    else layer += Math.random() < 0.3 ? (Math.random() < 0.5 ? -1 : 1) : 0;

    layer = clamp(layer, minL, maxL);

    /* 可达性验证：层差 ≤ 1 + 垂直距离 ≤ 70px */
    const y = CF.Y_LEVELS[layer];
    const soulY = Soul.y;
    if (y < soulY - 70) layer = Math.max(minL, layer - 1);
    const soulVy = Soul.vy || 0;
    if (soulVy > 0 && y > soulY + 100) layer = Math.min(maxL, layer + 1);

    this.lastLayer = layer;
    return { type, layer, y: CF.Y_LEVELS[layer] };
  },

  _weightedPick(weights) {
    const total = weights.reduce((s, w) => s + w, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return weights.length - 1;
  }
};

/* ─── 四、星星系统（支持同步/交替/反向 + gapBias 符号修正）──── */
const StarSystem = {
  variation: null,
  gapBias: 0,
  syncMode: "sync",
  oscillation: 0,
  scrollDir: -1,

  applyVariation(v) {
    this.variation = v;
    this.gapBias = v.starGapBias;
    this.syncMode = v.starSync;
    this.oscillation = v.starOscillation;
    this.scrollDir = (v.starSync === "reverse") ? 1 : -1;
  },

  positions(sx, O) {
    const centerY = CorridorWave.centerY(sx);
    /* 修正：正 bias = 更宽（top 上移 / bot 下移） */
    const topY = centerY - O - this.gapBias / 2;
    const botY = centerY + O + this.gapBias / 2;

    if (this.syncMode === "alternate") {
      return { topY: topY - 12, botY: botY + 12 };
    }
    return { topY, botY };
  }
};

/* ─── 五、障碍系统（4 种新障碍）───────────────────────────── */
const HAZARD_POOL = [];
const HAZARD_POOL_SIZE = 32;
for (let i = 0; i < HAZARD_POOL_SIZE; i++) {
  HAZARD_POOL.push({
    alive: false, type: "",
    x: 0, y: 0, vx: 0, vy: 0,
    age: 0, maxLife: 3,
    damage: 0, r: 6,
    fallSpeed: 260, warnT: 0,
    homingT: 0, homingDur: 1.2, lockVx: 0, lockVy: 0,
    sweepVx: 100, width: 20, warnDuration: 0.6,
    warnElapsed: 0, beamActive: false,
    color: G3, alpha: 1, hitOnce: false
  });
}

const HazardSystem = {
  list: [],
  variation: null,
  spawnTimer: 0,
  windStrength: 0,

  applyVariation(v) {
    this.variation = v;
    for (const h of this.list) h.alive = false;
    this.list = [];
    this.spawnTimer = 0;
    this.windStrength = 0;
    for (const cfg of v.hazards) {
      if (cfg.type === "wind_gust") this.windStrength = cfg.strength || 55;
    }
  },

  update(dt, soul) {
    if (!this.variation) return;

    for (const cfg of this.variation.hazards) {
      if (cfg.type === "wind_gust") continue;
      this.spawnTimer += dt;
      const interval = 1 / cfg.rate;
      if (this.spawnTimer >= interval) {
        this.spawnTimer -= interval;
        this._spawn(cfg);
      }
    }

    for (const h of this.list) {
      if (!h.alive) continue;
      h.age += dt;
      if (h.age > h.maxLife) { h.alive = false; continue; }
      if (h.type === "falling_shard") this._updateShard(h, dt, soul);
      else if (h.type === "homing_bolt") this._updateHoming(h, dt, soul);
      else if (h.type === "beam_sweep") this._updateBeam(h, dt, soul);
    }

    if (this.windStrength > 0 && BattleSM.phase === BattlePhase.CORRIDOR) {
      soul.x -= this.windStrength * dt;
    }
  },

  _spawn(cfg) {
    const h = HAZARD_POOL.find(o => !o.alive);
    if (!h) return;
    h.alive = true;
    h.type = cfg.type;
    h.damage = cfg.damage;
    h.age = 0;
    h.hitOnce = false;
    h.color = this.variation.tint;
    h.alpha = 1;

    if (cfg.type === "falling_shard") {
      const F = CF.FRAME;
      h.x = F.x + 30 + Math.random() * (F.w - 60);
      h.y = F.y - 20;
      h.vy = cfg.fallSpeed || 260;
      h.vx = (Math.random() - 0.5) * 40;
      h.r = 7;
      h.warnT = 0.5;
      h.maxLife = 4;
    } else if (cfg.type === "homing_bolt") {
      const side = Math.random() < 0.5 ? -1 : 1;
      const F = CF.FRAME;
      h.x = side < 0 ? F.x - 20 : F.x + F.w + 20;
      h.y = F.y + 20 + Math.random() * (F.h - 40);
      h.vx = side < 0 ? 80 : -80;
      h.vy = 0;
      h.r = 6;
      h.homingT = 0;
      h.homingDur = 1.2;
      h.lockVx = 0;
      h.lockVy = 0;
      h.maxLife = 5;
    } else if (cfg.type === "beam_sweep") {
      const F = CF.FRAME;
      const side = Math.random() < 0.5 ? -1 : 1;
      h.x = side < 0 ? F.x + 20 : F.x + F.w - 20;
      h.vx = side < 0 ? 90 : -90;
      h.y = F.y;
      h.width = 20 + Math.random() * 10;
      h.warnDuration = 0.6;
      h.warnElapsed = 0;
      h.beamActive = false;
      h.maxLife = 4;
    }

    this.list.push(h);
  },

  _updateShard(h, dt, soul) {
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.vy += 60 * dt;

    if (!h.hitOnce && h.age > h.warnT) {
      const d = Math.hypot(soul.x - h.x, soul.y - h.y);
      if (d < h.r + SOUL_RADIUS) {
        soul.damage(h.damage);
        h.hitOnce = true;
        burstParticles(h.x, h.y, 8, {
          speed: 140, maxLife: 0.4, size: 2,
          color: h.color, gravity: 200, type: "star"
        });
      }
    }

    if (h.y > CF.FRAME.y + CF.FRAME.h) {
      spawnShockwave({
        x: h.x, y: CF.FRAME.y + CF.FRAME.h - 4,
        r0: 3, maxR: 20, maxLife: 0.25,
        color: h.color, width: 1
      });
      h.alive = false;
    }
  },

  _updateHoming(h, dt, soul) {
    if (h.age < h.homingDur) {
      const dx = soul.x - h.x, dy = soul.y - h.y;
      const d = Math.hypot(dx, dy) || 1;
      const spd = Math.hypot(h.vx, h.vy) || 80;
      const targetVx = dx / d * Math.max(80, spd + 60 * dt);
      const targetVy = dy / d * Math.max(80, spd + 60 * dt);
      h.vx = lerp(h.vx, targetVx, 2.5 * dt);
      h.vy = lerp(h.vy, targetVy, 2.5 * dt);
    } else if (h.homingT === 0) {
      h.lockVx = h.vx;
      h.lockVy = h.vy;
      h.homingT = 1;
    } else {
      h.vx = h.lockVx;
      h.vy = h.lockVy;
    }

    h.x += h.vx * dt;
    h.y += h.vy * dt;

    if (Math.random() < 0.7) {
      spawnParticle({
        x: h.x, y: h.y,
        vx: (Math.random() - 0.5) * 30,
        vy: (Math.random() - 0.5) * 30,
        maxLife: 0.28, size: 2,
        color: h.color, type: "dot"
      });
    }

    if (!h.hitOnce) {
      const d = Math.hypot(soul.x - h.x, soul.y - h.y);
      if (d < h.r + SOUL_RADIUS) {
        soul.damage(h.damage);
        h.hitOnce = true;
        spawnShockwave({
          x: h.x, y: h.y, r0: 4, maxR: 32,
          maxLife: 0.22, color: h.color, width: 2
        });
        h.alive = false;
      }
    }

    const F = CF.FRAME;
    if (h.x < F.x - 40 || h.x > F.x + F.w + 40 ||
        h.y < F.y - 40 || h.y > F.y + F.h + 40) {
      h.alive = false;
    }
  },

  _updateBeam(h, dt, soul) {
    const F = CF.FRAME;
    h.warnElapsed += dt;
    if (h.warnElapsed >= h.warnDuration) {
      h.beamActive = true;
      h.x += h.vx * dt;

      if (!h.hitOnce) {
        if (soul.x > h.x - h.width / 2 && soul.x < h.x + h.width / 2) {
          soul.damage(h.damage);
          h.hitOnce = true;
          soul.vy = -180;
          ScreenFX.addTrauma(0.5);
          ScreenFX.triggerChroma(0.2);
          SFX.elderHit && SFX.elderHit();
        }
      }

      if (h.x < F.x - 30 || h.x > F.x + F.w + 30) h.alive = false;
    }

    if (h.beamActive && Math.random() < 0.5) {
      spawnParticle({
        x: h.x + (Math.random() - 0.5) * h.width,
        y: F.y + Math.random() * F.h,
        vx: (Math.random() - 0.5) * 40,
        vy: (Math.random() - 0.5) * 40,
        maxLife: 0.3, size: 2,
        color: h.color, type: "block"
      });
    }
  },

  draw(g) {
    for (const h of this.list) {
      if (!h.alive) continue;

      if (h.type === "falling_shard") {
        if (h.age < h.warnT) {
          g.globalAlpha = 0.15 + 0.15 * Math.sin(h.age * 24);
          g.fillStyle = h.color;
          g.fillRect(h.x - 8, CF.FRAME.y + CF.FRAME.h - 6, 16, 4);
          g.globalAlpha = 1;
        }
        const t = GAME.totalTime;
        const size = h.r;
        g.save();
        g.translate(Math.round(h.x), Math.round(h.y));
        g.rotate(t * 6);
        g.fillStyle = h.color;
        g.beginPath();
        g.moveTo(0, -size);
        g.lineTo(size, 0);
        g.lineTo(0, size);
        g.lineTo(-size, 0);
        g.closePath();
        g.fill();
        g.fillStyle = G0;
        g.beginPath();
        g.moveTo(0, -size * 0.4);
        g.lineTo(size * 0.4, 0);
        g.lineTo(0, size * 0.4);
        g.lineTo(-size * 0.4, 0);
        g.closePath();
        g.fill();
        g.restore();

      } else if (h.type === "homing_bolt") {
        const grd = g.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r * 3);
        grd.addColorStop(0, `rgba(${VariationDriver.cur.tintRGB.join(",")},0.7)`);
        grd.addColorStop(1, `rgba(${VariationDriver.cur.tintRGB.join(",")},0)`);
        g.fillStyle = grd;
        g.fillRect(h.x - h.r * 3, h.y - h.r * 3, h.r * 6, h.r * 6);
        g.fillStyle = G3;
        g.beginPath();
        g.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = G0;
        g.beginPath();
        g.arc(h.x, h.y, h.r * 0.4, 0, Math.PI * 2);
        g.fill();

      } else if (h.type === "beam_sweep") {
        const F = CF.FRAME;
        if (!h.beamActive) {
          const blink = Math.floor(h.warnElapsed * 16) % 2 === 0;
          if (blink) {
            g.globalAlpha = 0.55;
            g.fillStyle = h.color;
            g.fillRect(h.x - h.width / 2, F.y, h.width, F.h);
            g.globalAlpha = 1;
          }
        } else {
          const a = h.age < h.maxLife - 0.3 ? 1 : (h.maxLife - h.age) / 0.3;
          g.globalAlpha = a;
          g.fillStyle = `rgba(${VariationDriver.cur.tintRGB.join(",")},0.35)`;
          g.fillRect(h.x - h.width, F.y, h.width * 2, F.h);
          g.fillStyle = G3;
          g.fillRect(h.x - h.width / 2, F.y, h.width, F.h);
          g.fillStyle = G3;
          g.fillRect(h.x - 3, F.y, 6, F.h);
          g.globalAlpha = 1;
        }
      }
    }
  }
};

/* ─── 六、CorridorPhase 变奏化重写 ────────────────────────── */
CorridorPhase.start = function (onComplete) {
  this.active = true;
  this.elapsed = 0;
  this.onComplete = onComplete || null;
  this.curSegName = "";

  CorridorStarSprite.build();
  CorridorHaloSprite.build();
  CorridorPlatformSystem.reset();
  CorridorWave.reset();
  CorridorInput.reset();
  CorridorFX.reset();

  VariationDriver.reset();
  HazardSystem.applyVariation(VariationDriver.cur);
  StarSystem.applyVariation(VariationDriver.cur);
  PlatformForge.applyVariation(VariationDriver.cur);

  CorridorPlatformSystem._prevLayer = 0;
  for (let i = 0; i < 3; i++) {
    CorridorPlatformSystem.list.push({
      id: CorridorPlatformSystem.nextId++,
      x: CF.FRAME.x + 20 + i * 150,
      y: CF.Y_LEVELS[0], w: 110, h: CF.PLAT.H,
      type: "solid", layer: 0,
      alive: true, enterT: 1,
      crumbleT: 0, crumbling: false,
      baseY: CF.Y_LEVELS[0], moveT: 0,
      bounceCd: 0, oneWayPass: false, pulse: 0
    });
  }

  Soul.setMode("blue");
  Soul.x = CF.FRAME.x + 40;
  Soul.y = CF.Y_LEVELS[0] - SOUL_RADIUS - 40;
  Soul.vx = 0;
  Soul.vy = 0;
  Soul.onGround = false;
  Soul.invuln = 1.5;

  this.totalDuration = CORRIDOR_VARIATIONS.reduce((s, v) => s + v.duration, 0);

  Log.log("[Corridor] 变奏模式启动，总时长 " + this.totalDuration + "s");
};

CorridorPhase.update = function (dt) {
  if (!this.active) return;

  CorridorInput.update();
  CorridorWave.update(dt, this.elapsed);
  VariationDriver.update(dt);
  PlatformForge.update(dt);

  this.elapsed += dt;

  const newName = VariationDriver.cur.name;
  if (newName !== this.curSegName) this.curSegName = newName;

  CorridorPlatformSystem.update(dt);
  HazardSystem.update(dt, Soul);
  Soul.updateCorridor(dt);
  CorridorFX.update(dt);

  if (this.active) {
    if (Soul.invuln <= 0) this.perfectT += dt;
    else this.perfectT = 0;
  } else {
    this.perfectT = 0;
  }
};

/* 平台生成：走 PlatformForge 规则 */
CorridorPlatformSystem.spawn = function () {
  const params = PlatformForge.nextPlatform();
  if (!params) return;

  const seg = this._getSegment();
  const lv = CF.LEVELS[seg ? seg.level : "舒展"];
  const w = lv.width;

  this.list.push({
    id: this.nextId++,
    x: CF.FRAME.x + CF.FRAME.w + 20,
    y: params.y, w, h: CF.PLAT.H,
    type: params.type, layer: params.layer,
    alive: true, enterT: 0,
    crumbleT: 0, crumbling: false,
    baseY: params.y,
    moveT: Math.random() * CF.PLAT.MOVING_PERIOD,
    bounceCd: 0, oneWayPass: false, pulse: 0
  });
};

/* 星星位置：走 StarSystem（含 gapBias 符号修正） */
CorridorWave.topY = function (x, O) { return StarSystem.positions(x, O).topY; };
CorridorWave.bottomY = function (x, O) { return StarSystem.positions(x, O).botY; };

/* 主绘制 */
CorridorPhase.draw = function (g) {
  if (!this.active) return;
  const F = CF.FRAME;
  const t = GAME.totalTime;
  const O = CorridorWave.getO();

  CorridorFX.drawBackground(g);

  g.save();
  g.beginPath();
  g.rect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
  g.clip();

  g.globalAlpha = 0.08;
  g.strokeStyle = G2;
  g.lineWidth = 1;
  g.setLineDash([4, 8]);
  g.beginPath();
  for (let x = F.x; x < F.x + F.w; x += 6) {
    const cy = CorridorWave.centerY(x);
    if (x === F.x) g.moveTo(x, cy);
    else g.lineTo(x, cy);
  }
  g.stroke();
  g.setLineDash([]);
  g.globalAlpha = 1;

  const ang = t / CF.STAR.ROT_PERIOD * 2 * Math.PI;
  const sprite = CorridorStarSprite.get(ang);
  const scrollDir = StarSystem.scrollDir;
  const scroll = (t * CF.STAR.SCROLL * scrollDir) % CF.STAR.SPACING;
  const firstX = F.x - CF.STAR.SPACING + scroll;
  const hr = CorridorHaloSprite.r;
  const dangerRange = CF.STAR.HIT_RADIUS + 42;

  for (let sx = firstX - CF.STAR.SPACING; sx < F.x + F.w + CF.STAR.SIZE;
       sx += CF.STAR.SPACING) {
    if (sx < F.x - CF.STAR.SIZE) continue;
    const topY = CorridorWave.topY(sx, O);
    const botY = CorridorWave.bottomY(sx, O);

    const dTop = Math.hypot(Soul.x - sx, Soul.y - topY);
    const dBot = Math.hypot(Soul.x - sx, Soul.y - botY);
    const dangerTop = dTop < dangerRange ? 1 - dTop / dangerRange : 0;
    const dangerBot = dBot < dangerRange ? 1 - dBot / dangerRange : 0;

    g.drawImage(CorridorHaloSprite.canvas,
      Math.round(sx - hr), Math.round(topY - hr));
    g.drawImage(CorridorHaloSprite.canvas,
      Math.round(sx - hr), Math.round(botY - hr));

    if (dangerTop > 0.05 || dangerBot > 0.05) {
      const tint = VariationDriver.cur.tintRGB;
      g.globalAlpha = Math.max(dangerTop, dangerBot) * 0.5;
      g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
      if (dangerTop > 0.05) {
        g.beginPath();
        g.arc(sx, topY, CF.STAR.RO * 0.9, 0, Math.PI * 2);
        g.fill();
      }
      if (dangerBot > 0.05) {
        g.beginPath();
        g.arc(sx, botY, CF.STAR.RO * 0.9, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    g.drawImage(sprite,
      Math.round(sx - CF.STAR.SIZE / 2),
      Math.round(topY - CF.STAR.SIZE / 2));
    g.drawImage(sprite,
      Math.round(sx - CF.STAR.SIZE / 2),
      Math.round(botY - CF.STAR.SIZE / 2));
  }

  CorridorPlatformSystem.draw(g);
  HazardSystem.draw(g);

  /* 风区视觉（斜线流动） */
  if (HazardSystem.windStrength > 0) {
    const speed = 180;
    const off = (t * speed) % 40;
    g.globalAlpha = 0.15;
    g.strokeStyle = VariationDriver.cur.tint;
    g.lineWidth = 1;
    g.beginPath();
    for (let i = -1; i < F.h / 40 + 2; i++) {
      const y = F.y + i * 40 + off;
      g.moveTo(F.x, y);
      g.lineTo(F.x + F.w, y - F.w * 0.15);
    }
    g.stroke();
    g.globalAlpha = 1;
  }

  CorridorFX.drawSoulTrail(g);
  drawSoul(g, Soul.x, Soul.y, t, {
    invuln: Soul.invuln,
    mode: "blue",
    onGround: Soul.onGround,
    scale: 1
  });

  CorridorFX.drawForeground(g, this.elapsed);

  g.restore();

  const tint = VariationDriver.cur.tintRGB;
  g.strokeStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
  g.lineWidth = 4;
  g.strokeRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
  this._drawFrameDecor(g);
  this._drawPerfectAura(g);

  VariationDriver.drawSwitchEffect(g);

  this.drawProgress(g);
  this.drawSegmentName(g);
  this.drawGapIndicator(g);
  this.drawIntroHints(g);
};

/* 进度条：按变奏分段 */
CorridorPhase.drawProgress = function (g) {
  const F = CF.FRAME;
  const barY = F.y + F.h + 10;
  const barW = F.w;
  const barH = 4;
  const totalDur = this.totalDuration || 44;

  g.fillStyle = G1;
  g.fillRect(F.x, barY, barW, barH);

  let acc = 0;
  for (let i = 0; i < CORRIDOR_VARIATIONS.length; i++) {
    const v = CORRIDOR_VARIATIONS[i];
    const x0 = F.x + barW * (acc / totalDur);
    const x1 = F.x + barW * ((acc + v.duration) / totalDur);
    const w = x1 - x0;
    const passed = VariationDriver.curIdx > i;
    const current = VariationDriver.curIdx === i;
    const tint = v.tintRGB;

    if (current) {
      const p = clamp(VariationDriver.tInVariation / v.duration, 0, 1);
      g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
      g.fillRect(x0, barY, w * p, barH);
    } else if (passed) {
      g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
      g.fillRect(x0, barY, w, barH);
    }

    g.fillStyle = G0;
    g.fillRect(x1 - 1, barY - 2, 2, barH + 4);
    acc += v.duration;
  }

  const progress = clamp(this.elapsed / totalDur, 0, 1);
  const px = F.x + barW * progress;
  const tint = VariationDriver.cur.tintRGB;
  g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
  g.beginPath();
  g.moveTo(px - 4, barY - 4);
  g.lineTo(px + 4, barY - 4);
  g.lineTo(px, barY - 1);
  g.closePath();
  g.fill();
};

/* 段名提示：主题色 + hint */
CorridorPhase.drawSegmentName = function (g) {
  if (!this.curSegName) return;
  const F = CF.FRAME;
  const v = VariationDriver.cur;

  const tIn = VariationDriver.tInVariation;
  const dur = v.duration;
  let alpha = 1;
  if (tIn < 0.4) alpha = tIn / 0.4;
  else if (tIn > dur - 0.4) alpha = (dur - tIn) / 0.4;
  alpha = clamp(alpha, 0, 1);
  if (alpha <= 0.01) return;

  const tint = v.tintRGB;
  g.save();
  g.globalAlpha = alpha * 0.95;
  g.font = "bold 14px 'Courier New', monospace";
  g.textAlign = "left";
  g.textBaseline = "middle";

  const tx = F.x + 8;
  const ty = F.y - 14;

  g.fillStyle = G0;
  g.fillText(this.curSegName, tx + 1, ty + 1);
  g.fillStyle = `rgb(${tint[0]},${tint[1]},${tint[2]})`;
  g.fillText(this.curSegName, tx, ty);

  g.fillStyle = G2;
  g.fillRect(tx, ty + 10, g.measureText(this.curSegName).width + 6, 1);

  if (v.hint && tIn < 2.0) {
    g.globalAlpha = alpha * clamp(1 - (tIn - 1.2) / 0.8, 0, 1);
    g.font = "10px 'Courier New', monospace";
    g.fillStyle = G2;
    g.fillText("· " + v.hint, tx, ty + 22);
  }

  g.restore();
};

/* 虚拟音乐时钟：无渲染时全部时间系统照常走 */
const _devGetTimeRaw = MusicPlayer.getTimeRaw;
MusicPlayer.getTimeRaw = function () {
  if (DevMode.musicOff && this.playing) {
    /* FINAL-86-B2: _devT0 可能在 play() 之前被读到（未 await），
       兜底锚定 + isFinite 保险，保证 tick 链永不为 NaN。 */
    if (this._devT0 == null || !isFinite(this._devT0)) {
      this._devT0 = performance.now();
    }
    const t = Math.max(0, (performance.now() - this._devT0) / 1000);
    return isFinite(t) ? t : 0;
  }
  return _devGetTimeRaw.call(this);
};
const _devPlay = MusicPlayer.play;
MusicPlayer.play = async function () {
  if (DevMode.musicOff) {
    this.playing = true;
    this._devT0 = performance.now();
    Log.log("[DEV] 虚拟音乐时钟启动");
    return;
  }
  await _devPlay.call(this);
};

/* 锁血：拦截一切伤害（含走廊坠落/撞星/光束） */

Soul.damage = function (dmg) {
  if (DevMode.god) {
    this.invuln = Math.max(this.invuln, 0.3);
    return false;
  }
  return _devDamage.call(this, dmg);
};

/* ══════════════════════════════════════════════════════════════
   【FINAL-25 · 圣光走廊 · 极简重制版】
   用户裁定：旧变奏系统"根本没法玩"。本层整体替换走廊核心：
   · 上下两排固定四芒星（贴图缩至 56px，判定半径 22）
   · 中间 4 条灵魂通道（平台层 300/330/360/390，间距 30px）
   · 平台短距：宽 72 / 边缘缝 ~47px / 相邻层差 ≤1 / 80% 实心+20% 单向
   · 撤掉：变奏 / 障碍 / 风区 / 波浪 / 动态间隙（VariationDriver/
     HazardSystem/PlatformForge 全部休眠）
   · 保留：描边星星 / Halo / Coyote+Buffer 手感 / 着陆冲击 /
     拖尾渐变 / 边框铆钉 / 无伤光环 / 真掉落回溯
   ══════════════════════════════════════════════════════════════ */

const SC = {
  topRow: 264,          /* 上星排 y */
  botRow: 424,          /* 下星排 y */
  starDraw: 56,         /* 星贴图缩放尺寸 */
  hitR: 22,             /* 判定半径 */
  scroll: 55,           /* 星滚动 px/s */
  lanes: [300, 330, 360, 390],   /* 4 条灵魂通道 */
  platW: 72,
  platPeriod: 1.7,      /* 平台生成间隔 s（70px/s × 1.7 ≈ 119 中心距，边缝 47） */
  platTypes: [["solid", 0.8], ["once", 0.2]],
  duration: 44,
  fallDamage: 8,
};

/* 星星位置唯一真源：固定双排（碰撞 + 绘制共用） */
StarSystem.positions = function () {
  return { topY: SC.topRow, botY: SC.botRow };
};
StarSystem.scrollDir = -1;
StarSystem.gapBias = 0;
CF.STAR.HIT_RADIUS = SC.hitR;

/* ── 平台系统：极简生成 ── */
CorridorPlatformSystem.spawn = function () {
  const prev = this._prevLayer || 0;
  let lane = prev + [-1, 0, 1][Math.floor(Math.random() * 3)];
  lane = clamp(lane, 0, SC.lanes.length - 1);
  this._prevLayer = lane;

  let type = "solid";
  const r = Math.random();
  let acc = 0;
  for (const [t, w] of SC.platTypes) {
    acc += w;
    if (r <= acc) { type = t; break; }
  }

  const y = SC.lanes[lane];
  this.list.push({
    id: this.nextId++,
    x: CF.FRAME.x + CF.FRAME.w + 20,
    y, w: SC.platW, h: CF.PLAT.H,
    type, layer: lane,
    alive: true, enterT: 0,
    crumbleT: 0, crumbling: false,
    baseY: y, moveT: 0,
    bounceCd: 0, oneWayPass: false, pulse: 0
  });
};

/* 平台更新：固定周期，无段逻辑 */
CorridorPlatformSystem.update = function (dt) {
  this.elapsed += dt;
  this.spawnTimer += dt;
  if (this.spawnTimer >= SC.platPeriod) {
    this.spawnTimer -= SC.platPeriod;
    this.spawn();
  }

  for (const p of this.list) {
    p.x -= CF.PLAT.SPEED * dt;
    p.enterT = Math.min(p.enterT + dt, 1);
    if (p.bounceCd > 0) p.bounceCd -= dt;
    if (p.x + p.w < CF.FRAME.x - 40) p.alive = false;
  }
  this.list = this.list.filter(p => p.alive);
};

/* ── 走廊生命周期 ── */
CorridorPhase.start = function (onComplete) {
  this.active = true;
  this.elapsed = 0;
  this.onComplete = onComplete || null;
  this.curSegName = "";

  CorridorStarSprite.build();
  CorridorHaloSprite.build();
  CorridorPlatformSystem.reset();

CorridorPhase.draw = function (g) {
  if (!this.active) return;
  const F = CF.FRAME;
  const t = GAME.totalTime;

  CorridorFX.drawBackground(g);

  g.save();
  g.beginPath();
  g.rect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
  g.clip();

  /* 通道参考虚线（4 层，极淡） */
  g.globalAlpha = 0.07;
  g.strokeStyle = G2;
  g.lineWidth = 1;
  g.setLineDash([2, 10]);
  for (const ly of SC.lanes) {
    g.beginPath();
    g.moveTo(F.x + 4, ly + 3);
    g.lineTo(F.x + F.w - 4, ly + 3);
    g.stroke();
  }
  g.setLineDash([]);
  g.globalAlpha = 1;

  /* 上下两排星 */
  CorridorHaloSprite.build();
  const ang = t / CF.STAR.ROT_PERIOD * 2 * Math.PI;
  const sprite = CorridorStarSprite.get(ang);
  const scroll = (t * SC.scroll) % CF.STAR.SPACING;
  const firstX = F.x - CF.STAR.SPACING + scroll;
  const hr = CorridorHaloSprite.r;
  const half = SC.starDraw / 2;
  const dangerRange = SC.hitR + 42;

  for (let sx = firstX - CF.STAR.SPACING; sx < F.x + F.w + SC.starDraw;
       sx += CF.STAR.SPACING) {
    if (sx < F.x - SC.starDraw) continue;

    const dTop = Math.hypot(Soul.x - sx, Soul.y - SC.topRow);
    const dBot = Math.hypot(Soul.x - sx, Soul.y - SC.botRow);
    const dangerTop = dTop < dangerRange ? 1 - dTop / dangerRange : 0;
    const dangerBot = dBot < dangerRange ? 1 - dBot / dangerRange : 0;

    g.drawImage(CorridorHaloSprite.canvas,
      Math.round(sx - hr), Math.round(SC.topRow - hr));
    g.drawImage(CorridorHaloSprite.canvas,
      Math.round(sx - hr), Math.round(SC.botRow - hr));

    if (dangerTop > 0.05 || dangerBot > 0.05) {
      const dgr = Math.max(dangerTop, dangerBot);
      g.globalAlpha = dgr * 0.5;
      g.fillStyle = "#ff2a3a";
      if (dangerTop > 0.05) {
        g.beginPath();
        g.arc(sx, SC.topRow, SC.hitR + 4, 0, Math.PI * 2);
        g.fill();
      }
      if (dangerBot > 0.05) {
        g.beginPath();
        g.arc(sx, SC.botRow, SC.hitR + 4, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    g.drawImage(sprite,
      Math.round(sx - half), Math.round(SC.topRow - half),
      SC.starDraw, SC.starDraw);
    g.drawImage(sprite,
      Math.round(sx - half), Math.round(SC.botRow - half),
      SC.starDraw, SC.starDraw);
  }

  /* 平台 / 拖尾 / 灵魂 */
  CorridorPlatformSystem.draw(g);
  CorridorFX.drawSoulTrail(g);
  drawSoul(g, Soul.x, Soul.y, t, {
    invuln: Soul.invuln,
    mode: "blue",
    onGround: Soul.onGround,
    scale: 1
  });

  g.restore();

  /* 边框 + 装饰 + 无伤光环 */
  g.strokeStyle = G3;
  g.lineWidth = 4;
  g.strokeRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
  this._drawFrameDecor(g);
  this._drawPerfectAura(g);

  /* 极简 UI：进度条 + 时间 + 操作提示 */
  const barY = F.y + F.h + 10;
  const p = clamp(this.elapsed / SC.duration, 0, 1);
  g.fillStyle = G1;
  g.fillRect(F.x, barY, F.w, 4);
  g.fillStyle = G3;
  g.fillRect(F.x, barY, F.w * p, 4);
  g.font = "10px 'Courier New', monospace";
  g.textAlign = "right";
  g.textBaseline = "middle";
  g.fillStyle = G2;
  g.fillText((SC.duration - this.elapsed).toFixed(0) + "s", F.x + F.w, barY + 14);

  this.drawIntroHints(g);
};

    if (((yi > sy) !== (yj > sy)) && (sx < (xj - xi) * (sy - yi) / (yj - yi) + xi)) ins = !ins;

    const ax = poly[i][0] + sx, ay = poly[i][1] + sy;

    const dx = bx - ax, dy = by - ay;

    let t = ((sx - ax) * dx + (sy - ay) * dy) / len2;

function queueSwordFrameMask() {
  const B = 4;   /* 与 drawBattleBox borderWidth 完全一致 */
  const x0 = BOX_X, y0 = BOX_Y, x1 = BOX_RIGHT, y1 = BOX_BOTTOM;
  queueSwordPoly([{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y0+B},{x:x0,y:y0+B}], G3, 1);
  queueSwordPoly([{x:x0,y:y1-B},{x:x1,y:y1-B},{x:x1,y:y1},{x:x0,y:y1}], G3, 1);
  queueSwordPoly([{x:x0,y:y0},{x:x0+B,y:y0},{x:x0+B,y:y1},{x:x0,y:y1}], G3, 1);
  queueSwordPoly([{x:x1-B,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x1-B,y:y1}], G3, 1);
}

drawSwordWarning = function (g, b, t) {
  const freeze = b.freezeT != null ? b.freezeT : 0.2;
  const tracking = b.age < SWORD_TRACK_TIME;
  const freezing = !tracking && b.age < SWORD_TRACK_TIME + freeze;

  const seg = swordLineThrough(b.warnX, b.warnY);
  if (seg) {
    const p0 = swordLinePoint(seg, seg.t0);
    const p1 = swordLinePoint(seg, seg.t1);

    /* ── 段 A：前辈核心 → 框边的"瞄准剑光"（严格止于框边，端面藏于白框下） ── */
    if (tracking) {
      const aimA = 0.30 + 0.18 * Math.sin(t * 10);
      queueSwordLine(SWORD_CORE.x, SWORD_CORE.y, p0.x, p0.y, 7,  G1, aimA * 0.55);
      queueSwordLine(SWORD_CORE.x, SWORD_CORE.y, p0.x, p0.y, 3,  G2, aimA * 0.80);
      queueSwordLine(SWORD_CORE.x, SWORD_CORE.y, p0.x, p0.y, 1.2, G3, aimA);

      aMid  = 0.28 + 0.18 * breath;
      aCore = 0.55 + 0.30 * breath;
      wCore = 1.6;
    } else {
      const p = clamp((b.age - SWORD_TRACK_TIME) / freeze, 0, 1);
      const freq = lerp(8, 26, p);
      const on = Math.floor((b.age - SWORD_TRACK_TIME) * freq) % 2 === 0;
      const charge = 0.35 + 0.60 * p;
      const k = on ? 1 : 0.22;
      aGlow = charge * 0.45 * k;
      aMid  = charge * 0.75 * k;
      aCore = Math.min(1, charge + 0.30) * k;
      wCore = 1.6 + 2.4 * p;
    }
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, wCore * 4, G1, aGlow);
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, wCore * 2, G2, aMid);
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, wCore,     G3, aCore);

    /* 能量脉冲沿预告线游走 */
    if (tracking) {
      const span = seg.t1 - seg.t0;
      const flow = seg.t0 + ((t * 1.1) % 1) * span;
      const pf = swordLinePoint(seg, flow);
      drawMiniStar(g, pf.x, pf.y, 4, Math.floor(t * 24) % 3, G3, 0.9);

  /* ── 目标点警示标（冻结期与爆闪同相） ── */
  const wx = clamp(b.warnX, BOX_X + 10, BOX_RIGHT - 10);
  const wy = clamp(b.warnY - 26, BOX_Y + 10, BOX_BOTTOM - 20);
  const blinkFreq = freeze <= 0.06 ? 30 : 15;
  const showMark = tracking || (freezing && Math.floor((b.age - SWORD_TRACK_TIME) * blinkFreq) % 2 === 0);
  if (showMark) {
    const pulse = tracking ? (0.75 + 0.25 * Math.sin(t * 12)) : 1.0;
    g.globalAlpha = pulse;
    g.fillStyle = G3;
    for (let dy = 0; dy < 6; dy++) {
      const w = 1 + dy;
      g.fillRect(wx - w, wy + dy, w * 2, 1);
    }
    g.fillRect(wx, wy + 7, 1, 3);
    g.fillRect(wx, wy + 11, 1, 1);
    /* 冻结期追加四角收拢括号，强化压迫感 */
    if (freezing) {
      g.globalAlpha = 0.9;
      const rr = 16;
      for (let q = 0; q < 4; q++) {
        const sx = (q === 0 || q === 2) ? -1 : 1;
        const sy = q < 2 ? -1 : 1;
        g.fillRect(wx + sx * rr - (sx < 0 ? 0 : 4), wy + sy * rr, 4, 1);
        g.fillRect(wx + sx * rr, wy + sy * rr - (sy < 0 ? 0 : 4), 1, 4);
      }
    }
    g.globalAlpha = 1;
  }

  if (tracking) {
    const rr = 14;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t * 4;
      g.globalAlpha = 0.7;
      g.fillStyle = G3;
      g.fillRect(b.warnX + Math.cos(a) * rr - 1, b.warnY + Math.sin(a) * rr - 1, 2, 2);
    }
    g.globalAlpha = 1;
  }

  /* 最后原样盖回白边框：线端藏于框下，严格无框外占用 */
  queueSwordFrameMask();
};

drawSwordStrike = function (g, b, t) {
  const seg = swordLineThrough(b.warnX, b.warnY);
  if (!seg) { queueSwordFrameMask(); return; }
  /* p0/p1 即线与前、后框边的精确交点 —— 斩击线严格止于框边 */
  const p0 = swordLinePoint(seg, seg.t0);
  const p1 = swordLinePoint(seg, seg.t1);

  const frame = Math.min(5, b.strikeFrame | 0);
  const env = SW_ENVELOPE[frame];

  /* 斩落瞬间全屏闪白（守卫标志，每斩仅触发一次） */
  if (frame <= 1 && !b._swFlashed) {
    b._swFlashed = true;
    ScreenFX.triggerFlash(0.09, G3);
  }

  /* f5 用连续透明度做残影衰减 */
  let a = env[3];
  if (frame === 5) {
    const p = clamp((b.age / b.maxLife - 5 / 6) * 6, 0, 1);
    a = (1 - p) * 0.22;
    if (a <= 0.01) { queueSwordFrameMask(); return; }
  }

  /* 外晕 → 主体 → 亮芯，三线叠加（走叠加层，设备分辨率重放） */
  queueSwordLine(p0.x, p0.y, p1.x, p1.y, env[0], G1, a * 0.35);
  queueSwordLine(p0.x, p0.y, p1.x, p1.y, env[1], G3, a);
  queueSwordLine(p0.x, p0.y, p1.x, p1.y, env[2], G3, Math.min(1, a * 1.15));

  /* f0 追加一层加宽白闪带 */
  if (frame === 0) {
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, Math.min(env[1] * 1.5, 30), G3, 0.55);
  }

  /* 两端冲击四芒星（f0–f2，半压在白框下，如从框底迸发） */
  if (frame <= 2) {
    const ea = [1, 0.7, 0.4][frame];
    const sf = Math.floor(t * 30) % 3;
    drawMiniStar(g, p0.x, p0.y, 8, sf, G3, ea);
    drawMiniStar(g, p1.x, p1.y, 8, sf, G3, ea);
  }

  /* 沿刃火花（f1–f3） */
  if (frame >= 1 && frame <= 3) {
    g.globalAlpha = a;
    g.fillStyle = G3;
    for (let i = 0; i < 8; i++) {
      const tt = seg.t0 + Math.random() * (seg.t1 - seg.t0);
      const p = swordLinePoint(seg, tt);
      g.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    g.globalAlpha = 1;
  }

  /* f5 灰色残影斩痕（同样严格止于框边） */
  if (frame === 5) {
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, 2, G2, a);
  }

  /* 最后原样盖回白边框：斩击端面藏于框下，呈延伸直线 */
  queueSwordFrameMask();
};

function angNorm42(a) {

  if (a < -Math.PI) a += T;

  return a;
}
function distToSegment42(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-6) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;

      if (k === 0) g.moveTo(r, -w / 2); else g.lineTo(r, -w / 2);

      const p = k / N;

function updateChargedBeam42(b, dt) {
  if (!b.phase) {
    b.phase = "orbit";
    b.spin = rand(0, Math.PI * 2);
    b.spinSpeed = 2;
    b.orbitT = 0;
    b.orbitDur = b.approachDur || 2.0;
    b.starSize = b.starSize || 40;
    b.chargeTime = b.chargeTime || 0.8;
    b.beamDur = b.beamDur || 0.45;
    b.width = b.width || 100;
    b.M = b.starSize / 26;
    b.echoes = []; b.echoTimer = 0;
    b.afterglow = 0;
    /* FINAL-42 演出：星体自前辈光环旋入 */
    b.orbitA0 = Math.atan2(HALO_CY - BOX_CY, BOSS_X - BOX_CX);
    b.orbitR0 = Math.hypot(BOSS_X - BOX_CX, HALO_CY - BOX_CY);
    b.orbitR1 = 165;
    b.x = BOX_CX + Math.cos(b.orbitA0) * b.orbitR0;
    b.y = BOX_CY + Math.sin(b.orbitA0) * b.orbitR0;
  }
  if (b.phase === "orbit") {
    b.orbitT += dt;
    const p = clamp(b.orbitT / b.orbitDur, 0, 1);
    const sweep = 11.6 * (0.78 * p + 0.22 * Math.pow(p, 3));
    const ang = b.orbitA0 + sweep;
    const R = lerp(b.orbitR0, b.orbitR1, p);
    b.x = BOX_CX + Math.cos(ang) * R;
    b.y = BOX_CY + Math.sin(ang) * R;
    const burstP = clamp((p - 0.85) / 0.15, 0, 1);
    b.spinSpeed = p < 0.85 ? 2 + 5 * (p / 0.85) : 7 + 11 * burstP * burstP;
    b.spin += b.spinSpeed * dt;
    b.echoTimer += dt;
    if (b.echoTimer >= 0.04) {
      b.echoTimer = 0;
      b.echoes.push({ x: b.x, y: b.y, rot: b.spin, size: b.starSize, life: 0, maxLife: 0.32 });
    }
    if (p > 0.4 && Math.random() < p * 1.2) {
      const a = Math.random() * Math.PI * 2;
      spawnParticle({ x: b.x + Math.cos(a) * b.starSize, y: b.y + Math.sin(a) * b.starSize,
        vx: -Math.cos(a) * 90 * b.M, vy: -Math.sin(a) * 90 * b.M,
        maxLife: 0.4, size: 2 * b.M, color: G3, drag: 2 });
    }
    if (p > 0.75) FX.triggerShake(0.8);
    if (p >= 1) {
      b.phase = "anchor"; b.anchorT = 0;
      const dl = Soul.x - BOX_X, dr = BOX_RIGHT - Soul.x;
      const dtp = Soul.y - BOX_Y, db2 = BOX_BOTTOM - Soul.y;
      const m = Math.max(dl, dr, dtp, db2);
      if (m === dl) { b.ax = BOX_X - 40; b.ay = clamp(Soul.y, BOX_Y + 20, BOX_BOTTOM - 20); }
      else if (m === dr) { b.ax = BOX_RIGHT + 40; b.ay = clamp(Soul.y, BOX_Y + 20, BOX_BOTTOM - 20); }
      else if (m === dtp) { b.ax = clamp(Soul.x, BOX_X + 20, BOX_RIGHT - 20); b.ay = BOX_Y - 40; }
      else { b.ax = clamp(Soul.x, BOX_X + 20, BOX_RIGHT - 20); b.ay = BOX_BOTTOM + 40; }
      b.fromX = b.x; b.fromY = b.y;
    }
  }
  else if (b.phase === "anchor") {
    b.anchorT += dt;
    const p = clamp(b.anchorT / 0.4, 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    b.x = lerp(b.fromX, b.ax, e);
    b.y = lerp(b.fromY, b.ay, e);
    b.spin += b.spinSpeed * dt;
    b.echoTimer += dt;
    if (b.echoTimer >= 0.04) {
      b.echoTimer = 0;
      b.echoes.push({ x: b.x, y: b.y, rot: b.spin, size: b.starSize, life: 0, maxLife: 0.3 });
    }
    if (p >= 1) {
      b.phase = "lock"; b.lockT = 0;
      b.aim = Math.atan2(Soul.y - b.y, Soul.x - b.x);
      FX.triggerShake(4);
      spawnShockwave({ x: b.x, y: b.y, maxR: 45 * b.M, maxLife: 0.4, width: 4 * b.M });
    }
  }
  else if (b.phase === "lock") {
    b.lockT += dt;
    const cp = clamp(b.lockT / b.chargeTime, 0, 1);
    b.spin += Math.max(6, b.spinSpeed * (1 - cp * 0.5)) * dt;
    if (cp < 0.65) {
      const want = Math.atan2(Soul.y - b.y, Soul.x - b.x);
      const turnRate = 7 * (1 - cp * 0.7);
      b.aim = angNorm42(b.aim + clamp(angNorm42(want - b.aim), -turnRate * dt, turnRate * dt));
    }
    if (Math.random() < 0.8 + cp * 1.3) {
      const a = Math.random() * Math.PI * 2;
      const r = (110 + Math.random() * 90) * b.M;
      spawnParticle({ x: b.x + Math.cos(a) * r, y: b.y + Math.sin(a) * r,
        vx: -Math.cos(a) * (110 + cp * 180) * b.M, vy: -Math.sin(a) * (110 + cp * 180) * b.M,
        maxLife: 0.5, size: 2 * b.M, color: G3, drag: 1.2 });
    }
    if (cp > 0.6) FX.triggerShake(1 + cp * 2);
    if (cp >= 1) { b.phase = "critical"; b.criticalT = 0; b.fireHeading = b.aim; }
  }
  else if (b.phase === "critical") {
    b.criticalT += dt;
    b.spin += b.spinSpeed * 0.12 * dt;
    if (b.criticalT >= 0.1) {
      b.phase = "fire"; b.fireT = 0;
      FX.triggerShake(18); FX.triggerFlash(0.25);
      const rdx = Math.cos(b.fireHeading), rdy = Math.sin(b.fireHeading);
      let t0 = -Infinity;
      let t1 = Infinity;
      if (Math.abs(rdx) < 1e-9) { if (b.x < BOX_X || b.x > BOX_RIGHT) t0 = Infinity; }
      else { let ta = (BOX_X - b.x) / rdx, tb = (BOX_RIGHT - b.x) / rdx;
        if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
        t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); }
      if (Math.abs(rdy) < 1e-9) { if (b.y < BOX_Y || b.y > BOX_BOTTOM) t0 = Infinity; }
      else { let ta = (BOX_Y - b.y) / rdy, tb = (BOX_BOTTOM - b.y) / rdy;
        if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
        t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); }
      const entryD = (t0 > 0 && t0 < Infinity) ? t0 : 40;
      const ex = b.x + rdx * entryD;
      const ey = b.y + rdy * entryD;
      spawnShockwave({ x: ex, y: ey, maxR: 110 * b.M, maxLife: 0.6, width: 6 * b.M });
      spawnShockwave({ x: ex, y: ey, maxR: 175 * b.M, maxLife: 0.9, width: 2.5 * b.M });
      for (let i = 0; i < Math.round(46 * b.M); i++) {
        const a = b.fireHeading + rand(-0.75, 0.75);
        const s2 = rand(200, 750) * b.M;
        spawnParticle({ x: b.x, y: b.y, vx: Math.cos(a) * s2, vy: Math.sin(a) * s2,
          maxLife: 0.7, size: 3 * b.M, color: G3, drag: 1.1 });
      }
    }
  }
  else if (b.phase === "fire") {
    b.fireT += dt;
    FX.triggerShake(3.5);
    if (!b.sfxFired) {
      const x2 = b.x + Math.cos(b.fireHeading) * 700;
      const y2 = b.y + Math.sin(b.fireHeading) * 700;
      if (distToSegment42(Soul.x, Soul.y, b.x, b.y, x2, y2) < b.width / 2 + 7) {
        Soul.damage(b.damage);
        burstParticles(Soul.x, Soul.y, 20, { speed: 240, color: G3 });
        b.sfxFired = true;
      }
    }
    if (Math.random() < 0.9) {
      const a = b.fireHeading + rand(-0.12, 0.12);
      const d = rand(16, 480);
      spawnParticle({ x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d,
        vx: Math.cos(a) * 90 * b.M, vy: Math.sin(a) * 90 * b.M,
        maxLife: 0.35, size: 2 * b.M, color: G3, drag: 2 });
    }
    if (b.fireT >= b.beamDur) { b.phase = "fade"; b.fadeT = 0; b.afterglow = 0.6; }
  }
  else if (b.phase === "fade") {
    b.fadeT += dt;
    if (b.fadeT < 0.15 && Math.random() < 0.8) {
      const a = rand(0, Math.PI * 2);
      spawnParticle({ x: b.x + rand(-12, 12) * b.M, y: b.y + rand(-12, 12) * b.M,
        vx: Math.cos(a) * rand(40, 160) * b.M, vy: Math.sin(a) * rand(40, 160) * b.M - 50,
        maxLife: 0.7, size: 2 * b.M, color: G3, type: "star", drag: 1 });
    }
    if (b.afterglow > 0) b.afterglow -= dt;
    if (b.fadeT >= 0.45 && b.afterglow <= 0) b.alive = false;
  }
  for (let i = b.echoes.length - 1; i >= 0; i--) {
    const e = b.echoes[i];
    e.life += dt;
    if (e.life >= e.maxLife) b.echoes.splice(i, 1);
  }
  if (b.age > b.maxLife) b.alive = false;
}

function drawChargedBeam42(g, b, t) {
  for (const e of b.echoes) {
    const k = 1 - e.life / e.maxLife;
    drawJudgeStar42(g, e.x, e.y, e.rot, e.size, { alpha: k * 0.26, glow: 0 });
  }
  const heartbeat = 1 + 0.07 * Math.sin(t * 12) + 0.04 * Math.sin(t * 25);
  if (b.phase === "orbit") {
    const p = clamp(b.orbitT / b.orbitDur, 0, 1);
    drawJudgeStar42(g, b.x, b.y, b.spin, b.starSize, {
      alpha: 1, pulse: heartbeat, glow: 0.7 + p * 0.5, pupil: 0.4 + p * 0.6
    });
  } else if (b.phase === "anchor") {
    drawJudgeStar42(g, b.x, b.y, b.spin, b.starSize, {
      alpha: 1, pulse: heartbeat, glow: 1.2, pupil: 1
    });
  } else if (b.phase === "lock") {
    const cp = clamp(b.lockT / b.chargeTime, 0, 1);
    /* v139m: 预警虚线移除——充能发光与转速即预警 */
    drawJudgeStar42(g, b.x, b.y, b.spin, b.starSize, {
      alpha: 1, pulse: heartbeat * (1 + cp * 0.1), glow: 0.9 + cp * 0.8, pupil: 1 - cp * 0.55
    });
    if (cp > 0.5 && Math.floor(Date.now() / 60) % 2 === 0) {
      g.globalAlpha = 0.35;
      g.fillStyle = G3;
      g.beginPath(); g.arc(b.x, b.y, b.starSize * 0.5, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
    }
  } else if (b.phase === "critical") {
    const p = clamp(b.criticalT / 0.1, 0, 1);
    const shrink = p < 0.5 ? 1 - p * 0.45 : 1.3;
    drawJudgeStar42(g, b.x, b.y, b.spin, b.starSize * shrink, {
      alpha: 1, glow: 1.6, pupil: 0.2, whiteout: Math.max(0, (p - 0.5) * 2)
    });
    if (p > 0.7) FX.triggerFlash(0.04);
  } else if (b.phase === "fire") {
    drawStarStreaks42(g, b.x, b.y, b.fireHeading, b.starSize * 1.15, 0.55, t);
    drawTremorBeam42(g, b.x, b.y, b.fireHeading, 700, b.width, 1, t);
    drawJudgeStar42(g, b.x, b.y, b.fireHeading, b.starSize * 1.15, {
      alpha: 1, glow: 1.5, pupil: 0.15,
      whiteout: b.fireT < 0.07 ? 0.8 : 0
    });
  } else if (b.phase === "fade") {
    if (b.afterglow > 0) {
      const ag = b.afterglow / 0.6;
      drawTremorBeam42(g, b.x, b.y, b.fireHeading, 700, b.width * ag * 0.5, ag * 0.3, t);
    }
    const sa = Math.max(0, 1 - b.fadeT / 0.45);
    if (sa > 0.01) {
      drawStarStreaks42(g, b.x, b.y, b.fireHeading, b.starSize * 1.15, 0.55 * sa, t);
      /* FINAL-95 淡出精灵化：与龙卷同款单层均匀淡化（lighter 加法辉光保留） */
      const ds = b.starSize * 1.15 * (1 + (1 - sa) * 0.6) * 3.5;
      g.save();
      g.globalCompositeOperation = "lighter";
      g.globalAlpha = sa;
      g.drawImage(window.__starSprite42, b.x - ds / 2, b.y - ds / 2, ds, ds);
      g.restore();
    }
  }
}

   两个周期共 16 支矛 + 8 发锤，~200t 收轮。

  const SpearHammerP = {

/* ══════════════════════════════════════════════════════════════
   【FINAL-60 · R7 重力滚星】
   重力阶段五颗四芒星（R56/凹R19 同源参数程序化烘焙，纯代码无
   base64）自框外左侧入场，缓慢自转沿地板滚向右侧——蓝魂必须
   跳起越过。仅 R7 生效（R4 不打扰）。
   ══════════════════════════════════════════════════════════════ */
(function () {

  /* ── 四芒星烘焙：与素材源文件同一组参数 ── */
  let starCanvas60 = null;
  function bakeStar60() {
    const S = 128, C = 64;
    starCanvas60 = document.createElement("canvas");
    starCanvas60.width = S; starCanvas60.height = S;
    const g = starCanvas60.getContext("2d");
    g.fillStyle = G3;
    /* 外四芒 Ro56 / 凹 Ri19 */
    g.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 4;
      const r = (k % 2) ? 19 : 56;
      const px = C + r * Math.cos(a), py = C + r * Math.sin(a);
      if (k) g.lineTo(px, py); else g.moveTo(px, py);
    }
    g.closePath(); g.fill();
    /* 偏心内镂空 R24/凹10，向顶尖偏移 6 */
    g.globalCompositeOperation = "destination-out";
    g.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 4;
      const r = (k % 2) ? 10 : 24;
      const px = C + 6 * Math.cos(-Math.PI / 2) + r * Math.cos(a);
      const py = C + 6 * Math.sin(-Math.PI / 2) + r * Math.sin(a);
      if (k) g.lineTo(px, py); else g.moveTo(px, py);
    }
    g.closePath(); g.fill();
    g.globalCompositeOperation = "source-over";
    /* 中心 4×4 亮核 */
    g.fillRect(C - 2, C - 2, 4, 4);
  }
  bakeStar60();

  /* ── 滚星弹幕 ── */
  function updateRollingStar60(b, dt) {
    b.spawnT = (b.spawnT || 0) + dt;
    b.x += b.vx * dt;
    b.rot += b.rotSpeed * dt;

    /* 入场特效（一次性） */
    if (!b.sfxFired) {
      b.sfxFired = true;
      spawnShockwave({ x: b.x + 8, y: b.y, maxR: 34, maxLife: 0.4, width: 2 });
      burstParticles(b.x, b.y, 10, { speed: 90, color: G3 });
    }
    /* 滚动火花 */
    if (Math.random() < dt * 14) {
      spawnParticle({ x: b.x - b.r * 0.7, y: b.y + b.r * 0.6,
        vx: -30 - Math.random() * 30, vy: -20 - Math.random() * 40,
        maxLife: 0.35, size: 2, color: G3, type: "block", gravity: 200 });
    }

    /* 命中：灵魂须跳起（中心高过星顶则安全） */
    const dx = Soul.x - b.x;
    if (Math.abs(dx) < b.r + 7 && Soul.y > b.y - b.r - 5) {
      Soul.damage(b.damage);
      FX.triggerShake(5);
    }

    if (b.x > BOX_RIGHT + 44) b.alive = false;
    if (b.age > b.maxLife) b.alive = false;
  }

  function drawRollingStar60(g, b, t) {
    /* 地面影 */
    g.globalAlpha = 0.25;
    g.fillStyle = G0;
    g.beginPath();
    g.ellipse(b.x, BOX_BOTTOM - 4, b.r * 0.8, 3.5, 0, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = 1;

    const scaleIn = Math.min(1, (b.spawnT || 0) / 0.35);
    const breathe = 1 + 0.05 * Math.sin(t * 5 + b.rot);
    g.save();
    g.translate(Math.round(b.x), Math.round(b.y));
    g.rotate(b.rot);
    g.scale(scaleIn * breathe, scaleIn * breathe);
    g.drawImage(starCanvas60, -b.r, -b.r, b.r * 2, b.r * 2);
    g.restore();

    /* 自转高光环（入场期） */
    if (scaleIn < 1) {
      g.globalAlpha = (1 - scaleIn) * 0.8;
      g.strokeStyle = G3;
      g.lineWidth = 2;
      g.beginPath();
      g.arc(b.x, b.y, b.r * (1.4 - scaleIn * 0.4), 0, Math.PI * 2);
      g.stroke();
      g.globalAlpha = 1;
    }
  }

  Object.assign(_EXT_DISPATCH, {
    rolling_star: [updateRollingStar60, drawRollingStar60]
  });

  function spawnRollingStar60() {
    const b = spawnBullet({ type: "rolling_star",
      x: BOX_X - 30, y: BOX_BOTTOM - 22,
      vx: 55, rot: rand(0, Math.PI * 2), rotSpeed: rand(0.7, 1.3) * 0.9,
      r: 30, damage: 10, maxLife: 14, alpha: 1 });
    if (b) Log.log("[R7] 滚星入场");
  }

  /* ── R7 闸 + 重力onTick叠加滚星 ── */
  const _br60 = RoundSkillDriver.beginRound.bind(RoundSkillDriver);
  RoundSkillDriver.beginRound = function (round) {
    window.__rollStarRound = (round === 7);
    _br60(round);
  };

  const _gravTick60 = GravityHammerSkill.onTick.bind(GravityHammerSkill);
  GravityHammerSkill.onTick = function (relTick) {
    _gravTick60(relTick);
    if (!window.__rollStarRound) return;
    if (relTick === 52 || relTick === 64 || relTick === 76 ||
        relTick === 88 || relTick === 100 || relTick === 112 ||
        relTick === 124) {
      window.__spawnTrackHammer81();
    }
    if (relTick === 148) window.__sweepLTR82();
    if (relTick === 168) window.__sweepRTL82();
  };

  Log.log("FINAL-60 R7 重力滚星已应用（五颗四芒星，R56/凹19 同源烘焙）");
})();

/* ══════════════════════════════════════════════════════════════
   【FINAL-63 · 重力波浪跑酷】
   上下双排自转四芒星（参考素材同源：Ro/Ri 星形 + 偏心内镂空 +
   中心核，48px 72帧预渲染 1:1 硬边绘制）自左向右推进，
   行波律动 cy=BOX_CY+18·sin(x·k+age·0.9)，走廊净空 64px；
   走廊内设 3 座跳跃平台，灵魂于首平台生成，蓝魂重力 +
   平台落点判定。星星碰撞 10 伤害。
   ══════════════════════════════════════════════════════════════ */
(function () {

  /* ── 星形烘焙 48×48 ×72帧 ── */
  const SZ63 = 64, C63 = 32;
  const starFrames63 = [];
  (function bake63() {
    function pts(Ro, Ri, ang, off) {
      const p = [];
      for (let k = 0; k < 8; k++) {
        const a = ang - Math.PI / 2 + k * Math.PI / 4;
        const r = (k % 2 === 0) ? Ro : Ri;
        const ox = off ? Math.cos(ang - Math.PI / 2) * off : 0;
        const oy = off ? Math.sin(ang - Math.PI / 2) * off : 0;
        p.push([C63 + ox + r * Math.cos(a), C63 + oy + r * Math.sin(a)]);
      }
      return p;
    }
    function pnp(p, x, y) {
      let inside = false;
      for (let i = 0, j = 7; i < 8; j = i++) {
        const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }
    for (let f = 0; f < 72; f++) {
      const ang = f / 72 * Math.PI * 2;
      const cv = document.createElement("canvas");
      cv.width = SZ63; cv.height = SZ63;
      const g = cv.getContext("2d"), img = g.createImageData(SZ63, SZ63);
      const out = pts(30, 10, ang, 0), inn = pts(13, 5, ang, 2.5);
      for (let y = 0; y < SZ63; y++) for (let x = 0; x < SZ63; x++) {
        let v = pnp(out, x + .5, y + .5) ? 255 : 0;
        if (v && pnp(inn, x + .5, y + .5)) v = 0;
        const i = (y * SZ63 + x) * 4;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      g.fillStyle = G3; g.fillRect(C63 - 2, C63 - 2, 4, 4);
      starFrames63.push(cv);
    }
  })();

  /* ── 跑酷常量 ── */
  const PK_CORRIDOR = 140;           /* 走廊净空 ≈8.5×灵魂（近框体极限） */
  const PK_R = 30;                   /* 星形外接半径(64px画布→几何30) */
  const PK_AMP = 18, PK_K = Math.PI * 2 / 190;
  const PK_PLATFORMS = [
    { x: BOX_X + 22, y: 340, w: 60 },   /* 首平台：灵魂生成处 */
    { x: BOX_X + 98, y: 314, w: 60 },
    { x: BOX_X + 74, y: 372, w: 60 }
  ];

  window.__parkourActive = false;

  function corridorCY(x, age) {
    return BOX_CY + PK_AMP * Math.sin((x - BOX_X) * PK_K + age * 0.9);
  }

  function updateParkourStar63(b, dt) {
    b.x += b.vx * dt;
    b.cy = corridorCY(b.x, b.age);
    b.y = b.cy + b.row * (PK_CORRIDOR / 2 + PK_R - 2);   /* -2: 星体大举探入框边被窗框遮盖 */
    const dx = Soul.x - b.x, dy = Soul.y - b.y;
    if (dx * dx + dy * dy < (PK_R + 6) * (PK_R + 6)) {
      Soul.damage(b.damage);
      FX.triggerShake(4);
    }
    if (b.x > BOX_RIGHT + 40) b.alive = false;
  }

  function drawParkourStar63(g, b, t) {
    const rot = b.age * (Math.PI * 2 / 7);              /* 7s/圈 */
    const f = ((Math.floor(rot / (Math.PI * 2) * 72) % 72) + 72) % 72;
    g.save();
    g.beginPath();
    g.rect(BOX_X + 4, BOX_Y + 4, BOX_W - 8, BOX_H - 8);   /* 窗框裁剪：星尖被白框遮盖 */
    g.clip();
    g.drawImage(starFrames63[f], Math.round(b.x - SZ63 / 2), Math.round(b.y - SZ63 / 2));
    g.restore();
  }

  Object.assign(_EXT_DISPATCH, {
    parkour_star: [updateParkourStar63, drawParkourStar63]
  });

  function spawnStarPair63() {
    spawnBullet({ type: "parkour_star", row: -1, x: BOX_X - 36,
      y: BOX_CY, vx: 55, damage: 10, maxLife: 12, alpha: 1 });
    spawnBullet({ type: "parkour_star", row: 1, x: BOX_X - 36,
      y: BOX_CY, vx: 55, damage: 10, maxLife: 12, alpha: 1 });
  }

  /* ── 平台绘制（插在弹幕之后） ── */
  const _db63 = drawBullets;
  drawBullets = function (g, t) {
    _db63(g, t);
    if (!window.__parkourActive) return;
    for (const p of PK_PLATFORMS) {
      g.fillStyle = G3;
      g.fillRect(p.x, p.y, p.w, 4);
      g.fillStyle = G1;
      g.fillRect(p.x + 2, p.y + 4, p.w - 4, 2);
      /* 端部小星饰 */
      drawMiniStar(g, p.x + p.w / 2, p.y - 4, 2, Math.floor(t / 0.12) % 3, G3, 0.8);
    }
  };

  /* ── 平台落点判定（蓝魂重力下） ── */
  const _soulUpd63 = Soul.update.bind(Soul);
  Soul.update = function (dt) {
    _soulUpd63(dt);
    if (!window.__parkourActive || this.mode !== "blue") return;
    if (this.vy < 0) return;                       /* 上升中不判定 */
    for (const p of PK_PLATFORMS) {
      if (this.x > p.x - 8 && this.x < p.x + p.w + 8 &&
          this.y >= p.y - 6 && this.y <= p.y + 16) {
        this.y = p.y;
        this.vy = 0;
        this.onGround = true;
        this.x += (p.vx || 0) * dt;   /* FINAL-76: 站立随台（跑步机携带） */
      }
    }
  };

  /* ── R7 编排：100t 起灵魂生成于首平台，星对持续供给 ── */
  const _gravTick63 = GravityHammerSkill.onTick.bind(GravityHammerSkill);
  GravityHammerSkill.onTick = function (relTick) {
    _gravTick63(relTick);
  };

  /* 导出跑酷 API 供独立测试阶段调用 */
  window.Parkour63 = {
    spawnPair: spawnStarPair63,
    platforms: PK_PLATFORMS,
    begin() { window.__parkourActive = true; },
    end() { window.__parkourActive = false; }
  };

  Log.log("FINAL-63 重力波浪跑酷系统已应用（R11 独立测试阶段专用）");
})();

/* ══════════════════════════════════════════════════════════════

   竖屏自动横屏(ROTATED)下，页面右下角 ≠ 游戏右下角。改为按
   Canvas 矩形实时换算：锚定游戏画面(570,410)右下角区域，
   旋转/缩放/尺寸变化自适应；横屏手机呈"右下跳键"。
   ══════════════════════════════════════════════════════════════ */
(function () {
  const btn = document.getElementById("jumpBtn74");
  if (!btn) { Log.warn("FINAL-75: 未找到 jumpBtn74"); return; }

  function placeBtn75() {
    const el = Canvas.el;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const s = Math.min(rect.width / CANVAS_H, rect.height / CANVAS_W);
    const AX = CANVAS_W - 28, AY = CANVAS_H - 64;      /* 游戏画面右下锚点（贴缘） */
    const rx = rect.width / 2 - (AY - CANVAS_H / 2) * s;
    const ry = rect.height / 2 + (AX - CANVAS_W / 2) * s;
    btn.style.left = Math.round(rect.left + rx - 44) + "px";
    btn.style.top = Math.round(rect.top + ry - 44) + "px";
    btn.style.right = "auto";
    btn.style.bottom = "auto";
    /* 三角形指向游戏的"上"：旋转模式下游戏上=屏幕右 */
    btn.style.transform = (typeof ROTATED !== "undefined" && ROTATED) ? "rotate(90deg)" : "none";
  }

  window.addEventListener("resize", placeBtn75);
  window.addEventListener("orientationchange", () => setTimeout(placeBtn75, 150));
  setInterval(placeBtn75, 400);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", placeBtn75);
  else placeBtn75();

  Log.log("FINAL-75 跳键游戏坐标系定位已应用");
})();

/* ══════════════════════════════════════════════════════════════
   【FINAL-78 · R8 棱角舞谢幕】
   移植实验室 prism_laser（线段光刃框内反弹）；R8 中剑击技能
   谢幕瞬间触发棱角舞 ×2 波（间隔 3s），与光球尾段叠成交响。
   ══════════════════════════════════════════════════════════════ */
(function () {

  function distSeg78(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    if (l2 < 1e-6) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
  }

  function updatePrismLaser78(b, dt) {
    if (!b.trail) b.trail = [];
    if (b.hitCd == null) b.hitCd = 0;
    if (b.bounces == null) b.bounces = 0;
    if (b.hitCd > 0) b.hitCd -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const R = 6;
    let bounced = false;
    if (b.x - R < BOX_X) { b.x = BOX_X + R; b.vx = Math.abs(b.vx); bounced = true; }
    if (b.x + R > BOX_RIGHT) { b.x = BOX_RIGHT - R; b.vx = -Math.abs(b.vx); bounced = true; }
    if (b.y - R < BOX_Y) { b.y = BOX_Y + R; b.vy = Math.abs(b.vy); bounced = true; }
    if (b.y + R > BOX_BOTTOM) { b.y = BOX_BOTTOM - R; b.vy = -Math.abs(b.vy); bounced = true; }
    if (bounced) {
      b.bounces++;
      FX.triggerShake(2);
      spawnParticle({ x: b.x, y: b.y, vx: 0, vy: 0, maxLife: 0.3, size: 3, color: G3, type: "star", drag: 0 });
    }
    b.heading = Math.atan2(b.vy, b.vx);
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 16) b.trail.shift();
    const hl = b.length / 2;
    b.lx1 = b.x - Math.cos(b.heading) * hl; b.ly1 = b.y - Math.sin(b.heading) * hl;
    b.lx2 = b.x + Math.cos(b.heading) * hl; b.ly2 = b.y + Math.sin(b.heading) * hl;
    if ((b.hitCd || 0) <= 0 && distSeg78(Soul.x, Soul.y, b.lx1, b.ly1, b.lx2, b.ly2) < b.width + 7) {
      Soul.damage(b.damage);
      burstParticles(Soul.x, Soul.y, 8, { speed: 110, color: G3 });
      b.hitCd = 0.7;
    }
    if (b.age > b.maxLife) b.alive = false;
  }

  function drawPrismLaser78(g, b, t) {
    if (b.lx1 === undefined) return;
    g.save();
    g.beginPath(); g.rect(BOX_X, BOX_Y, BOX_W, BOX_H); g.clip();
    for (let i = 1; i < b.trail.length; i++) {
      const p = b.trail[i - 1], q = b.trail[i];
      g.globalAlpha = (i / b.trail.length) * 0.30;
      g.strokeStyle = G3; g.lineWidth = 1;
      g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
    }
    g.globalAlpha = 1;
    const cxm = (b.lx1 + b.lx2) / 2, cym = (b.ly1 + b.ly2) / 2;
    g.save();
    g.translate(cxm, cym); g.rotate(b.heading);
    g.globalAlpha = 0.35; g.fillStyle = G2;
    g.fillRect(-b.length / 2, -b.width - 2, b.length, (b.width + 2) * 2);
    g.globalAlpha = 1; g.fillStyle = G3;
    g.fillRect(-b.length / 2, -b.width / 2, b.length, b.width);
    g.fillStyle = G0;
    g.fillRect(-b.length / 2, -1, b.length, 2);
    g.restore();
    drawMiniStar(g, b.lx2, b.ly2, 3, Math.floor(t / 0.08) % 3, G3, 0.9);
    g.restore();
    g.globalAlpha = 1;
  }

  Object.assign(_EXT_DISPATCH, {
    prism_laser: [updatePrismLaser78, drawPrismLaser78]
  });

  function launchPrismDance78() {
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      spawnBullet({ type: "prism_laser", x: BOX_CX, y: BOX_CY,
        vx: Math.cos(a) * 230, vy: Math.sin(a) * 230,
        length: 80, width: 3, r: 6, damage: 7, maxLife: 9 });
    }
    spawnShockwave({ x: BOX_CX, y: BOX_CY, r0: 10, maxR: 60, maxLife: 0.4, width: 2 });
    Log.log("[R8] 棱角舞一波");
  }

  /* 剑谢幕检测（R8 限定） */
  const _swordUpd78 = SwordSkill.update.bind(SwordSkill);
  SwordSkill.update = function (dt) {
    const was = this.active;
    _swordUpd78(dt);
    if (was && !this.active && window.__prismRound === 8) {
      launchPrismDance78();
      Timers.setTimeout(3.0, launchPrismDance78);
    }
  };

  /* R8 轮次标记 */
  const _br78 = RoundSkillDriver.beginRound.bind(RoundSkillDriver);
  RoundSkillDriver.beginRound = function (round) {
    window.__prismRound = round;
    _br78(round);
  };

  Log.log("FINAL-78 R8 棱角舞谢幕已应用");
})();

/* ══════════════════════════════════════════════════════════════
   【FINAL-84 · 圣裁风车（Sans 大风车移植）】
   六门四芒星炮绕框心 R170 环列，Sans 式原地闪光登场；
   相位错开扫射（周期1.35s：预警0.4s 虚线 → 开火0.45s 光束
   贯心），角速度逐圈 +18%，共 5 圈后淡出谢幕。
   躲避法则：与炮阵同速公转，卡在光束夹角里。
   先进 R12 开发者测试场。
   ══════════════════════════════════════════════════════════════ */
(function () {

  const WM_N = 6, WM_R = 170;
  const WM_CYCLE = 1.35, WM_TELE = 0.4, WM_FIRE = 0.45;

  function distSeg84(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    if (l2 < 1e-6) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
  }

  function star4(g, x, y, Ro, Ri, rot) {
    g.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = rot + k * Math.PI / 4 - Math.PI / 2;
      const rr = (k % 2 === 0) ? Ro : Ri;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if (k) g.lineTo(px, py); else g.moveTo(px, py);
    }
    g.closePath();
    g.fill();
  }

  function updateWindmill84(b, dt) {
    b.turns = b.turns || 0;
    b.angle = b.angle || 0;
    const baseW = (Math.PI * 2) / 2.6;
    const w = baseW * (1 + b.turns * 0.18);
    const prev = b.angle;
    b.angle += w * dt;
    if (Math.floor(b.angle / (Math.PI * 2)) > Math.floor(prev / (Math.PI * 2))) b.turns++;

    /* 登场闪光（一次性） */
    if (!b.sfxFired) {
      b.sfxFired = true;
      for (let i = 0; i < WM_N; i++) {
        const a = i * Math.PI / 3;
        const bx = BOX_CX + Math.cos(a) * WM_R, by = BOX_CY + Math.sin(a) * WM_R;
        spawnShockwave({ x: bx, y: by, r0: 4, maxR: 30, maxLife: 0.35, width: 2 });
        burstParticles(bx, by, 6, { speed: 90, color: G3 });
      }
      FX.triggerShake(4);
    }

    b.fireClock = (b.fireClock || 0) + dt;
    for (let i = 0; i < WM_N; i++) {
      const a = b.angle + i * Math.PI / 3;
      const bx = BOX_CX + Math.cos(a) * WM_R;
      const by = BOX_CY + Math.sin(a) * WM_R;
      b["bx" + i] = bx; b["by" + i] = by;
      b["ph" + i] = (b.fireClock + i * WM_CYCLE / WM_N) % WM_CYCLE;

      /* 开火窗口伤害 */
      const ph = b["ph" + i];
      if (ph >= WM_TELE && ph <= WM_TELE + WM_FIRE) {
        if (distSeg84(Soul.x, Soul.y, bx, by, BOX_CX, BOX_CY) < 8) {
          Soul.damage(b.damage);
          FX.triggerShake(3);
        }
      }
      /* 炮体碰撞 */
      if (Math.hypot(Soul.x - bx, Soul.y - by) < 22) Soul.damage(8);
    }

    if (b.turns >= 5) {
      b.fadeOut = (b.fadeOut || 0) + dt;
      if (b.fadeOut > 0.8) b.alive = false;
    }
    if (b.age > b.maxLife) b.alive = false;
  }

  function drawWindmill84(g, b, t) {
    const appear = Math.min(1, b.age / 0.25);
    const fade = b.fadeOut ? Math.max(0, 1 - b.fadeOut / 0.8) : 1;
    const A = appear * fade;
    if (A <= 0.01) return;

    /* 光束层 */
    for (let i = 0; i < WM_N; i++) {
      const bx = b["bx" + i], by = b["by" + i];
      if (bx === undefined) continue;
      const ph = b["ph" + i] || 0;
if (ph < WM_TELE) {
        /* v139l: 预警虚线已移除 */
      } else if (ph <= WM_TELE + WM_FIRE) {
        /* 实光束：白体黑心 */
        g.globalAlpha = 0.9 * A;
        g.strokeStyle = G3;
        g.lineWidth = 12;
        g.lineCap = "round";
        g.beginPath(); g.moveTo(bx, by); g.lineTo(BOX_CX, BOX_CY); g.stroke();
        g.globalAlpha = A;
        g.strokeStyle = G0;
        g.lineWidth = 4;
        g.beginPath(); g.moveTo(bx, by); g.lineTo(BOX_CX, BOX_CY); g.stroke();
        g.globalAlpha = 1;
        g.lineCap = "butt";
      }
    }

    /* 四芒星炮体 */
    for (let i = 0; i < WM_N; i++) {
      const bx = b["bx" + i], by = b["by" + i];
      if (bx === undefined) continue;
      const firing = (b["ph" + i] || 0) >= WM_TELE && (b["ph" + i] || 0) <= WM_TELE + WM_FIRE;
      g.globalAlpha = A;
      g.fillStyle = G3;
      star4(g, bx, by, 18 * appear, 7, t * 1.5 + i);
      g.fillStyle = G0;
      star4(g, bx, by, 8, 3.5, t * 1.5 + i);
      g.fillStyle = G3;
      g.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 4, 4);
      if (firing) {
        g.globalAlpha = 0.5 * A;
        g.fillStyle = G3;
        g.beginPath(); g.arc(bx, by, 24, 0, Math.PI * 2); g.fill();
        g.globalAlpha = A;
      }
    }
    g.globalAlpha = 1;
  }

  Object.assign(_EXT_DISPATCH, {
    windmill: [updateWindmill84, drawWindmill84]
  });

  /* R12 计划技能 */
  const WindmillSkillP = {
    active: false, _rel: -1,
    start() { this.active = true; this._rel = -1; Log.log("[计划] 圣裁风车 开始"); },
    onTick(rel) {
      this._rel = rel;
      if (rel < 0) return;
      if (rel === 0) {
        spawnBullet({ type: "windmill", x: BOX_CX, y: BOX_CY,
          damage: 12, maxLife: 14, alpha: 1 });
      }
      if (rel > 112) { this.active = false; Log.log("[计划] 圣裁风车 结束"); }
    },
    update() {},
    stop() { this.active = false; }
  };

  SKILL_MAP.windmill = () => WindmillSkillP;


  Log.log("FINAL-84 圣裁风车已应用（R12 开发者测试场）");
})();

/* ══════════════════════════════════════════════════════════════
   【FINAL-85 · 圣裁风车 v2（考据重做）】
   依据：Steam 指南"Gaster Blaster Spiral" + CYF 龙骨炮库行为：
   ① 出场：六炮沿径向从屏外 130px 飞入环位（Sans 式 fly-in，
      每炮错拍 60ms，0.4s 减速入位）
   ② 环转：R150 绕框心 5 整圈，ω=2.86rad/s（首圈 2.2s）
   ③ 光束扇叶：激活相位锁死环角（占空 37%），2-3 束同时扫转，
      每炮开火前 0.35s 炮口蓄辉预警
   ④ 躲法：与环同角速度反向公转，卡在扇叶夹角（"不要太快
      不要太慢"）
   ══════════════════════════════════════════════════════════════ */
(function () {

  const WM_N = 6, WM_R = 150;
  const WM_OMEGA = (Math.PI * 2 * 5) / 11;      /* 5圈/11s */

  function distSeg85(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    if (l2 < 1e-6) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
  }

  function star5(g, x, y, Ro, Ri, rot) {
    g.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = rot + k * Math.PI / 4 - Math.PI / 2;
      const rr = (k % 2 === 0) ? Ro : Ri;
      const px2 = x + Math.cos(a) * rr, py2 = y + Math.sin(a) * rr;
      if (k) g.lineTo(px2, py2); else g.moveTo(px2, py2);
    }
    g.closePath(); g.fill();
  }

  function updateWindmill85(b, dt) {
    b.intro = (b.intro || 0) + dt;
    b.angle = (b.angle || 0) + WM_OMEGA * dt;
    b.turns = b.angle / (Math.PI * 2);

    const firingEnabled = b.intro > 0.7;
    let activeCount = 0;

    for (let i = 0; i < WM_N; i++) {
      const a = b.angle + i * Math.PI / 3;
      const sx = BOX_CX + Math.cos(a) * WM_R;
      const sy = BOX_CY + Math.sin(a) * WM_R;
      /* 飞入 */
      const k = clamp((b.intro - i * 0.06) / 0.4, 0, 1);
      const ease = 1 - Math.pow(1 - k, 3);
      const fx = sx + Math.cos(a) * 130 * (1 - ease);
      const fy = sy + Math.sin(a) * 130 * (1 - ease);
      b["bx" + i] = fx; b["by" + i] = fy;

      /* 扇叶相位（锁环角） */
      const phase = ((b.angle / (Math.PI / 3)) + i * 2) % 6;
      let beam = 0;                       /* 0 灭 / 1 蓄辉 / 2 光束 */
      if (firingEnabled) {
        if (phase < 2.2) { beam = 2; activeCount++; }
        else if (phase < 3.4) beam = 1;   /* 开火前 ~0.35s 蓄辉 */
      }
      b["bm" + i] = beam;

      if (beam === 2) {
        if (distSeg85(Soul.x, Soul.y, fx, fy, BOX_CX, BOX_CY) < 9) {
          Soul.damage(b.damage);
          FX.triggerShake(3);
        }
      }
      if (Math.hypot(Soul.x - fx, Soul.y - fy) < 22) Soul.damage(8);
    }
    b.activeCount = activeCount;

    if (b.turns >= 5) {
      b.fadeOut = (b.fadeOut || 0) + dt;
      if (b.fadeOut > 0.8) b.alive = false;
    }
    if (b.age > b.maxLife) b.alive = false;
  }

  function drawWindmill85(g, b, t) {
    const fade = b.fadeOut ? Math.max(0, 1 - b.fadeOut / 0.8) : 1;
    if (fade <= 0.01) return;

    for (let i = 0; i < WM_N; i++) {
      const bx = b["bx" + i], by = b["by" + i];
      if (bx === undefined) continue;
      const bm = b["bm" + i] || 0;
      const aim = Math.atan2(BOX_CY - by, BOX_CX - bx);

      /* 光束 */
      if (bm === 2) {
        g.globalAlpha = 0.9 * fade;
        g.strokeStyle = G3; g.lineWidth = 12; g.lineCap = "round";
        g.beginPath(); g.moveTo(bx, by); g.lineTo(BOX_CX, BOX_CY); g.stroke();
        g.globalAlpha = fade;
        g.strokeStyle = G0; g.lineWidth = 4;
        g.beginPath(); g.moveTo(bx, by); g.lineTo(BOX_CX, BOX_CY); g.stroke();
        g.lineCap = "butt";
      }
      /* 蓄辉 */
      if (bm === 1) {
        const p = 1 - (( ((b.angle / (Math.PI / 3)) + i * 2) % 6) - 2.2) / 1.2;
        g.globalAlpha = (0.3 + 0.5 * p) * fade;
        g.fillStyle = G3;
        g.beginPath(); g.arc(bx, by, 8 + p * 10, 0, Math.PI * 2); g.fill();
      }

      /* 四芒星炮体（尖角指向框心） */
      g.globalAlpha = fade;
      g.fillStyle = G3;
      star5(g, bx, by, 18, 7, aim + Math.PI / 2);
      g.fillStyle = G0;
      star5(g, bx, by, 8, 3.5, aim + Math.PI / 2);
      g.fillStyle = G3;
      g.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 4, 4);
    }
    g.globalAlpha = 1;
  }

  Object.assign(_EXT_DISPATCH, {
    windmill: [updateWindmill85, drawWindmill85]
  });

  Log.log("FINAL-85 圣裁风车 v2（飞入场+环锁扇叶）已覆盖注册");
})();

   ══════════════════════════════════════════════════════════════ */
(function () {

  const _play87 = MusicPlayer.play;
  MusicPlayer.play = async function () {
    /* FINAL-108 修正：musicOff 虚拟时钟模式绝不触发渲染保险丝 */

  function kickAudio87() {

        MusicPlayer.ctx.resume();

      }

    document.removeEventListener("pointerdown", kickAudio87);
    document.removeEventListener("touchstart", kickAudio87);
  }

  document.addEventListener("touchstart", kickAudio87, { passive: true });

  Log.log("FINAL-87 音乐双保险丝已应用");
})();

/* ══════════════════════════════════════════════════════════════

(function () {

  const W3_R = 150, W3_FLY = 90;

  const W3_FLY_T = 0.35, W3_AIM_T = 0.08, W3_FIRE_T = 1.0, W3_FADE_T = 0.3;

  function updateBlaster89(b, dt) {

    /* v139q 出场/离场复刻充能光炮：orbit 残星拖影 + fade 余辉溶解 */

    while (b.echoes.length && b.echoes[0].life >= b.echoes[0].maxLife) b.echoes.shift();

    const ty = BOX_CY + Math.sin(b.ang) * W3_R;

      const ease = 1 - Math.pow(1 - k, 3);

      const wait = W3_AIM_T + (b.fdel || 0);

    } else if (b.st === "hold") {

      if (window.__wmV3End) { b.st = "scatter"; b.tm = 0; b.sdir = b.ang + rand(-0.25, 0.25); }
    } else if (b.st === "scatter") {

      b.y += Math.sin(b.sdir) * 320 * dt;

    }
    if (b.st !== "scatter" && b.st !== "fade" && Math.hypot(Soul.x - b.x, Soul.y - b.y) < 50) Soul.damage(8);
  }

  function drawBlaster89(g, b, t) {
    const aim = Math.atan2(BOX_CY - b.y, BOX_CX - b.x);
    b.st = b.st || "fly";
    const heartbeat = 1 + 0.07 * Math.sin(t * 12) + 0.04 * Math.sin(t * 25);

    } else if (b.st === "scatter") {

     onStartGame 的进度回调被直接丢弃。改为订阅者列表统一转发进度。 */
  const _prep106 = MusicPlayer.prepare;
  MusicPlayer.prepare = async function (cb) {
    if (this.renderedBuffer) {
      if (cb) { try { cb(1); } catch (e) {} }
      return this.renderedBuffer;
    }
    if (MusicPlayer.__prepPromise) {
      /* 渲染进行中：复用 Promise，但把新回调追加为订阅者 */
      MusicPlayer.__prepCbs = MusicPlayer.__prepCbs || [];
      if (cb) MusicPlayer.__prepCbs.push(cb);
      return MusicPlayer.__prepPromise;
    }
    /* 首次启动：渲染一次，进度统一分发给所有订阅者 */
    MusicPlayer.__prepCbs = cb ? [cb] : [];
    MusicPlayer.__prepPromise = _prep106.call(this, (p) => {
      const list = MusicPlayer.__prepCbs || [];
      for (const f of list) { try { f(p); } catch (e) { Log.warn("progress cb error:", e); } }
    }).finally(() => {
      MusicPlayer.__prepPromise = null;
      MusicPlayer.__prepCbs = [];
    });
    return MusicPlayer.__prepPromise;
  };

  let kicked = false;
  function kick106() {
    if (kicked) return; kicked = true;
    document.removeEventListener("pointerdown", kick106);
    document.removeEventListener("touchstart", kick106);
    try {
      if (!MusicPlayer.renderedBuffer) {
        MusicPlayer.init();
        MusicPlayer.prepare(null).then(
          () => Log.log("[预渲染] 音乐就绪，任意模式即刻入场"),
          (e) => Log.warn("[预渲染] 失败（入场时自动重试）:", e)
        );
      }
    } catch (e) { Log.warn("[预渲染] 启动失败:", e); }
  }
  document.addEventListener("pointerdown", kick106);
  document.addEventListener("touchstart", kick106, { passive: true });
  Log.log("FINAL-106 手势点火预渲染已布防");
})();
/* ══════════════════════════════════════════════════════════════
   【FINAL-103 · 光刃龙卷正式转正】
   R11（正常模式终局）= windmillv3 光刃龙卷；开发者 R13 保留测试。
   ══════════════════════════════════════════════════════════════ */
(function () {
  ROUND_PLAN[11] = { primary: "windmillv3", secondary: null, delay: 0, intensity: 1.5 };
  ROUND_NAMES[11] = "终焉 · 光刃龙卷";
  Log.log("FINAL-103 R11=终焉·光刃龙卷（正式终局）");
})();

/* ══════════════════════════════════════════════════════════════
   【FINAL-105 · 对话框自适应 hug 内容】
   原 DIALOG_FIXED 高 80px 固定，短句显得框大空、长句贴边。
   现按实际折行数计算框高（行高22+边距28，下限80），
   台词与框 snug 贴合；绘制端本就以 R.h 垂直居中，无需改动。
   ══════════════════════════════════════════════════════════════ */
(function () {
  const _show105 = NarratorBox.show.bind(NarratorBox);
  NarratorBox.show = function (text, onAdvance) {
    _show105(text, onAdvance);
    try {
      const mctx = document.createElement("canvas").getContext("2d");
      mctx.font = this.font;
      const lines = TextWrap.wrap(mctx, text || " ", DIALOG_FIXED.w - this.padding * 2, this.font);
      const h = Math.max(DIALOG_FIXED.h, lines.length * this.lineHeight + this.padding * 2);
      BM.cur = { x: DIALOG_FIXED.x, y: DIALOG_FIXED.y, w: DIALOG_FIXED.w, h: h };
    } catch (e) { Log.warn("[自适应框] 计算失败，用默认高", e); }
  };
  Log.log("FINAL-105 对话框自适应高已应用");
})();
</script>
