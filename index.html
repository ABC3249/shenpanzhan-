<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   弹幕攻击实验室 · 移植自《圣光的机械》引擎
   逻辑分辨率 640×480 · 战斗框 220,244,200,200 · 全灰阶像素
   ══════════════════════════════════════════════════════════════ */

const CANVAS_W = 640, CANVAS_H = 480;
const CENTER_X = 320, CENTER_Y = 240;
const BOX_X = 220, BOX_Y = 244, BOX_W = 200, BOX_H = 200;
const BOX_CX = BOX_X + BOX_W / 2, BOX_CY = BOX_Y + BOX_H / 2;
const BOX_RIGHT = BOX_X + BOX_W, BOX_BOTTOM = BOX_Y + BOX_H;
const BOSS_X = 320, BOSS_Y = 150;
const SOUL_START_X = BOX_CX, SOUL_START_Y = BOX_CY;
const PLAYER_MAX_HP = 60;
const G0 = "#000000", G1 = "#555555", G2 = "#aaaaaa", G3 = "#ffffff";

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function fract(x) { return x - Math.floor(x); }
function smoothstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function angNorm(a) {
  const T = Math.PI * 2;
  a = a % T;
  if (a < -Math.PI) a += T;
  if (a > Math.PI) a -= T;
  return a;
}
function withAlpha(hex, a) {
  a = clamp(a, 0, 1);
  return `rgba(${parseInt(hex.substr(1,2),16)},${parseInt(hex.substr(3,2),16)},${parseInt(hex.substr(5,2),16)},${a})`;
}
/* 点到线段距离（拓展弹幕通用命中判定） */
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-6) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

/* ── 定时器 ── */
const Timers = {
  timers: [], nextId: 1,
  setTimeout(d, cb) { const id = this.nextId++; this.timers.push({ id, delay: d, elapsed: 0, cb, repeat: false, alive: true }); return id; },
  setInterval(d, cb) { const id = this.nextId++; this.timers.push({ id, delay: d, elapsed: 0, cb, repeat: true, alive: true }); return id; },
  clear(id) { for (const t of this.timers) if (t.id === id) { t.alive = false; break; } },
  clearAll() { this.timers = []; },
  update(dt) {
    for (let i = this.timers.length - 1; i >= 0; i--) {
      const t = this.timers[i];
      if (!t.alive) { this.timers.splice(i, 1); continue; }
      t.elapsed += dt;
      if (t.elapsed >= t.delay) {
        try { t.cb(); } catch (e) { console.error(e); }
        if (t.repeat) t.elapsed -= t.delay; else { t.alive = false; this.timers.splice(i, 1); }
      }
    }
  }
};

/* ══════════════ 屏幕适配（横屏照搬） ══════════════ */
const Screen = {
  el: null, ctx: null,
  buf: null, bctx: null,
  rotated: false, scale: 1,
  init() {
    this.el = document.getElementById("game");
    this.ctx = this.el.getContext("2d", { alpha: false });
    this.buf = document.createElement("canvas");
    this.buf.width = CANVAS_W; this.buf.height = CANVAS_H;
    this.bctx = this.buf.getContext("2d", { alpha: false });
    this.bctx.imageSmoothingEnabled = false;
    /* 上层缓冲：四芒星高清覆层与上层像素层之间使用 */
    this.buf2 = document.createElement("canvas");
    this.buf2.width = CANVAS_W; this.buf2.height = CANVAS_H;
    this.bctx2 = this.buf2.getContext("2d");
    this.bctx2.imageSmoothingEnabled = false;
    window.addEventListener("resize", () => this.resize());
    window.addEventListener("orientationchange", () => setTimeout(() => this.resize(), 120));
    this.resize();
  },
  resize() {
    const st = document.getElementById("stage");
    const W = Math.max(st.clientWidth, 80);
    const H = Math.max(st.clientHeight, 80);
    this.rotated = H > W * 1.05;
    const stage = document.getElementById("stage");
    if (this.rotated) {
      this.scale = Math.min(W / CANVAS_H, H / CANVAS_W);
      this.el.style.width = (CANVAS_W * this.scale) + "px";
      this.el.style.height = (CANVAS_H * this.scale) + "px";
      this.el.style.transform = "rotate(90deg)";
      stage.style.width = (CANVAS_H * this.scale) + "px";
      stage.style.height = (CANVAS_W * this.scale) + "px";
      this.el.width = Math.round(CANVAS_W * this.scale);
      this.el.height = Math.round(CANVAS_H * this.scale);
    } else {
      this.scale = Math.min(W / CANVAS_W, H / CANVAS_H);
      this.el.style.width = (CANVAS_W * this.scale) + "px";
      this.el.style.height = (CANVAS_H * this.scale) + "px";
      this.el.style.transform = "none";
      stage.style.width = (CANVAS_W * this.scale) + "px";
      stage.style.height = (CANVAS_H * this.scale) + "px";
      this.el.width = Math.round(CANVAS_W * this.scale);
      this.el.height = Math.round(CANVAS_H * this.scale);
    }
    this.ctx.imageSmoothingEnabled = false;
  },
  toLocal(clientX, clientY) {
    const r = this.el.getBoundingClientRect();
    const px = clientX - r.left, py = clientY - r.top;
    if (!this.rotated) {
      return { x: px / r.width * CANVAS_W, y: py / r.height * CANVAS_H };
    }
    const cx = r.width / 2, cy = r.height / 2;
    const dx = px - cx, dy = py - cy;
    return {
      x: CANVAS_W / 2 + dy / this.scale,
      y: CANVAS_H / 2 - dx / this.scale
    };
  },
  presentBase() {
    const c = this.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = G0;
    c.fillRect(0, 0, this.el.width, this.el.height);
    c.imageSmoothingEnabled = false;
    c.drawImage(this.buf, 0, 0, this.el.width, this.el.height);
  },
  presentTop() {
    const c = this.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.imageSmoothingEnabled = false;
    c.drawImage(this.buf2, 0, 0, this.el.width, this.el.height);
  },
  /* 四芒星高清覆层变换：逻辑坐标 → 画布物理像素（含震屏偏移） */
  starTransform(shX, shY) {
    const c = this.ctx;
    if (!this.rotated) {
      c.setTransform(this.scale, 0, 0, this.scale, this.scale * shX, this.scale * shY);
    } else {
      const sx = this.el.width / CANVAS_W, sy = this.el.height / CANVAS_H;
      c.setTransform(sx, 0, 0, sy, sx * shX, sy * shY);
    }
  }
};

/* ══════════════ 输入 ══════════════ */
const Keyboard = {
  keys: {},
  init() {
    window.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      this.keys[k] = true;
      if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
    });
    window.addEventListener("keyup", e => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener("blur", () => { this.keys = {}; });
  },
  anyDown(arr) { return arr.some(k => this.keys[k]); }
};

const Joystick = {
  active: false, id: null, cx: 0, cy: 0, kx: 0, ky: 0, mag: 0,
  baseRadius: 64, knobRadius: 20, deadZone: 0.12,
  start(x, y, id) { this.active = true; this.id = id; this.cx = x; this.cy = y; this.kx = 0; this.ky = 0; this.mag = 0; },
  move(x, y) {
    if (!this.active) return;
    let dx = x - this.cx, dy = y - this.cy;
    const d = Math.hypot(dx, dy);
    if (d > this.baseRadius) { dx = dx / d * this.baseRadius; dy = dy / d * this.baseRadius; }
    this.kx = dx; this.ky = dy; this.mag = Math.min(1, d / this.baseRadius);
  },
  end() { this.active = false; this.id = null; this.kx = 0; this.ky = 0; this.mag = 0; },
  getVector() {
    if (!this.active || this.mag < this.deadZone) return null;
    return { x: this.kx / this.baseRadius, y: this.ky / this.baseRadius };
  },
  draw(g) {
    if (!this.active) return;
    const cx = Math.round(this.cx), cy = Math.round(this.cy);
    const bx = Math.round(cx + this.kx), by = Math.round(cy + this.ky);
    g.globalAlpha = 0.22; g.strokeStyle = G3; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, this.baseRadius, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 0.72; g.fillStyle = G3;
    g.beginPath(); g.arc(bx, by, this.knobRadius, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.35; g.strokeStyle = G3; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(bx, by); g.stroke();
    g.globalAlpha = 1;
  }
};

const Pointer = {
  lastClick: { x: BOX_CX, y: BOX_CY },
  dragStart: null, dragging: false, mode: "click",
  sel: null,
  init() {
    const el = Screen.el;
    el.addEventListener("touchstart", e => this.down(e), { passive: false });
    el.addEventListener("touchmove", e => this.move(e), { passive: false });
    el.addEventListener("touchend", e => this.up(e), { passive: false });
    el.addEventListener("mousedown", e => this.mdown(e));
    el.addEventListener("mousemove", e => this.mmove(e));
    el.addEventListener("mouseup", e => this.mup(e));
    el.addEventListener("contextmenu", e => e.preventDefault());
  },
  _pts(e) {
    const out = [];
    if (e.touches !== undefined && e.changedTouches) {
      for (const t of e.changedTouches) out.push({ id: t.identifier, ...Screen.toLocal(t.clientX, t.clientY) });
    } else {
      out.push({ id: "mouse", ...Screen.toLocal(e.clientX, e.clientY) });
    }
    return out;
  },
  down(e) {
    e.preventDefault();
    for (const p of this._pts(e)) {
      if (p.x < CANVAS_W * 0.5 && !Joystick.active) {
        Joystick.start(p.x, p.y, p.id);
      } else {
        this.dragStart = { x: p.x, y: p.y, id: p.id };
        this.dragging = false;
      }
    }
  },
  move(e) {
    e.preventDefault();
    for (const p of this._pts(e)) {
      if (Joystick.active && p.id === Joystick.id) { Joystick.move(p.x, p.y); return; }
      if (this.dragStart && p.id === this.dragStart.id) {
        if (Math.hypot(p.x - this.dragStart.x, p.y - this.dragStart.y) > 8) this.dragging = true;
        this.dragCur = { x: p.x, y: p.y };
      }
    }
  },
  up(e) {
    e.preventDefault();
    for (const p of this._pts(e)) {

  damage(dmg) {

const BOLT_PIX = [
  [6, 0, 3],
  [5, -1, 2], [5, 0, 3], [5, 1, 2],
  [4, -2, 2], [4, -1, 2], [4, 0, 3], [4, 1, 2], [4, 2, 2],
  [3, -2, 1], [3, -1, 2], [3, 0, 3], [3, 1, 2], [3, 2, 1],
  [2, -1, 1], [2, 0, 2], [2, 1, 1],
  [1, 0, 1], [0, 0, 1]

const BOLT_STAR = [[1, -4], [1, 4]];
function drawBoltBody(g, b, t, opts) {
  opts = opts || {};
  const heading = b.heading || 0;
  const cos = Math.cos(heading), sin = Math.sin(heading);
  const scale = opts.scale || 2;
  const dissolve = opts.dissolve || 0;
  const flicker = opts.flicker || false;
  const px = Math.round(b.x), py = Math.round(b.y);
  const shade = [G0, G1, G2, G3];
  for (const [bx, by, tone] of BOLT_PIX) {
    if (dissolve > 0) {
      const h = ((bx * 7 + by * 13) % 17) / 17;
      if (h < dissolve) continue;
    }
    if (flicker && tone === 3 && Math.floor(t * 18) % 3 === 0) continue;
    let tone2 = tone;
    if (dissolve > 0.4 && tone2 > 1) tone2 = Math.max(1, tone2 - 1);
    const rx = bx * cos - by * sin, ry = bx * sin + by * cos;
    g.fillStyle = shade[tone2];
    g.fillRect(px + Math.round(rx * scale / 2) * 1 - (scale >> 1),
               py + Math.round(ry * scale / 2) * 1 - (scale >> 1),
               scale, scale);
  }
  if (dissolve < 0.7) {
    for (const [sx, sy] of BOLT_STAR) {
      const rx = sx * cos - sy * sin, ry = sx * sin + sy * cos;
      drawMiniStar(g, px + rx * scale / 2, py + ry * scale / 2, 2,
        Math.floor(t / 0.09) % 3, G3, dissolve > 0.4 ? 0.5 : 0.95);
    }
  }
}

/* ── 四芒星高清覆层：捕获绘制指令，最终按屏幕分辨率抗锯齿渲染 ── */
const StarOverlay = {
  active: false,
  cmds: [],
  begin() { this.active = true; this.cmds.length = 0; },
  end() { this.active = false; },
  draw(c, shX, shY) {
    if (!this.cmds.length) return;
    Screen.starTransform(shX, shY);
    for (const cmd of this.cmds) {
      /* lighter：星体只增亮不压暗，半透明时背景黑条纹不会透出 */
      if (cmd[4] && cmd[4].lighter) c.globalCompositeOperation = "lighter";
      drawJudgeStar(c, cmd[0], cmd[1], cmd[2], cmd[3], cmd[4]);
      if (cmd[4] && cmd[4].lighter) c.globalCompositeOperation = "source-over";
    }
    c.setTransform(1, 0, 0, 1, 0, 0);
  }
};

/* ── 绘制：纯白四芒圣星（刃面 + 根部渐变 + 反向机械环 + 中心瞳孔，全白无黑） ── */
function drawJudgeStar(g, x, y, rot, size, opts) {
  opts = opts || {};
  if (StarOverlay.active) { StarOverlay.cmds.push([x, y, rot, size, opts]); return; }
  const alpha = opts.alpha != null ? opts.alpha : 1;
  const pulse = opts.pulse != null ? opts.pulse : 1;
  const glow = opts.glow != null ? opts.glow : 1;
  const whiteout = opts.whiteout || 0;
  const pupil = opts.pupil != null ? opts.pupil : 1;
  if (alpha <= 0.01) return;
  const sz = size * pulse;
  g.save();
  g.translate(Math.round(x), Math.round(y));
  if (glow > 0.01) {
    const grd = g.createRadialGradient(0, 0, sz * 0.2, 0, 0, sz * 2.4);
    grd.addColorStop(0, withAlpha(G3, 0.5 * glow * alpha));
    grd.addColorStop(0.4, withAlpha(G3, 0.22 * glow * alpha));
    grd.addColorStop(1, withAlpha(G3, 0));
    g.fillStyle = grd;
    g.fillRect(-sz * 2.4, -sz * 2.4, sz * 4.8, sz * 4.8);
  }
  g.rotate(rot);
  g.globalAlpha = alpha;

  const spike = (k, tone) => {
    g.fillStyle = tone;
    g.beginPath();
    g.moveTo(0, -sz * k);
    g.lineTo(-sz * 0.22 * k, -sz * 0.32 * k);
    g.lineTo(0, -sz * 0.12 * k);
    g.lineTo(sz * 0.22 * k, -sz * 0.32 * k);
    g.closePath();
    g.fill();
  };

  /* ① 主尖刺：黑轮廓底 + 白刃面 + 根部灰阶渐变 */
  for (let i = 0; i < 4; i++) {
    g.save(); g.rotate(i * Math.PI / 2);
    spike(1.0, G3);
    g.fillStyle = G3;
    g.globalAlpha = alpha * 0.9;
    g.beginPath();
    g.moveTo(0, -sz * 0.58);
    g.lineTo(-sz * 0.12, -sz * 0.28);
    g.lineTo(0, -sz * 0.14);
    g.lineTo(sz * 0.12, -sz * 0.28);
    g.closePath(); g.fill();
    g.globalAlpha = alpha;
    g.restore();
  }
  /* ② 副尖刺（45° 半透明小刃） */
  g.globalAlpha = alpha * 0.6;
  for (let i = 0; i < 4; i++) {
    g.save(); g.rotate(i * Math.PI / 2 + Math.PI / 4);
    spike(0.5, G3);
    g.restore();
  }
  g.globalAlpha = alpha;

  /* ③ 机械环：虚线环反向缓转（noRing 可关，R13 防蛛网） */
  if (!opts.noRing) {
    g.save();
    g.rotate(-rot * 1.45);
    g.globalAlpha = alpha * 0.5;
    g.strokeStyle = G3; g.lineWidth = 1.5;
    g.setLineDash([sz * 0.14, sz * 0.11]);
    g.beginPath(); g.arc(0, 0, sz * 1.16, 0, Math.PI * 2); g.stroke();
    g.setLineDash([]);
    g.restore();
    g.globalAlpha = alpha;
  }

  /* ④ 机械瞳孔：环 + 可张合暗瞳 + 高光点 + 随星十字准线 */
  g.fillStyle = G3;
  g.beginPath(); g.arc(0, 0, sz * 0.32, 0, Math.PI * 2); g.fill();
  g.fillStyle = G3;
  g.beginPath(); g.arc(0, 0, sz * 0.26 * pupil + 1, 0, Math.PI * 2); g.fill();
  g.fillStyle = G3;
  g.beginPath(); g.arc(-sz * 0.05, -sz * 0.05, Math.max(0.6, sz * 0.1 * pupil), 0, Math.PI * 2); g.fill();
  g.globalAlpha = alpha * 0.35;
  g.strokeStyle = G3; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-sz * 0.3, 0); g.lineTo(sz * 0.3, 0);
  g.moveTo(0, -sz * 0.3); g.lineTo(0, sz * 0.3);
  g.stroke();
  g.globalAlpha = alpha;

  /* ⑤ 闪白爆发环 */
  if (whiteout > 0) {
    g.globalAlpha = alpha * whiteout * 0.9;
    g.fillStyle = G3;
    g.beginPath(); g.arc(0, 0, sz * (0.8 + (1 - whiteout) * 1.6), 0, Math.PI * 2); g.fill();
  }
  g.restore();
  g.globalAlpha = 1;
}

/* ── 绘制：四角拉长光痕（连续渐变彗尾） ── */
function drawStarStreaks(g, x, y, angle, size, alpha, t) {
  if (alpha <= 0.01) return;
  g.save();
  g.translate(Math.round(x), Math.round(y));
  g.rotate(angle);
  const LEN = 780;
  const r0 = size * 0.04;   /* 星痕直连星中心 */
  const w0 = size * 0.36;
  const N = 16;
  for (let i = 0; i < 4; i++) {
    g.save();
    g.rotate(i * Math.PI / 2);
    const flick = 0.88 + 0.12 * Math.sin(t * 30 + i * 1.7);
    g.beginPath();
    for (let k = 0; k <= N; k++) {
      const p = k / N;
      const r = r0 + (LEN - r0) * p;
      const w = Math.max(0.6, w0 * Math.pow(1 - p, 1.35));
      if (k === 0) g.moveTo(r, -w / 2); else g.lineTo(r, -w / 2);
    }
    for (let k = N; k >= 0; k--) {
      const p = k / N;
      const r = r0 + (LEN - r0) * p;
      const w = Math.max(0.6, w0 * Math.pow(1 - p, 1.35));
      g.lineTo(r, w / 2);
    }
    g.closePath();
    const grd = g.createLinearGradient(r0, 0, LEN, 0);
    grd.addColorStop(0, withAlpha(G3, Math.min(1, alpha * 1.15) * flick));
    grd.addColorStop(0.22, withAlpha(G3, alpha * 0.6 * flick));
    grd.addColorStop(0.55, withAlpha(G3, alpha * 0.22 * flick));
    grd.addColorStop(1, withAlpha(G3, 0));
    g.fillStyle = grd;
    g.fill();
    g.beginPath();
    for (let k = 0; k <= N; k++) {
      const p = k / N * 0.4;
      const r = r0 + (LEN - r0) * p;
      const w = Math.max(0.5, w0 * 0.34 * Math.pow(1 - p / 0.4, 1.2));
      if (k === 0) g.moveTo(r, -w / 2); else g.lineTo(r, -w / 2);
    }
    for (let k = N; k >= 0; k--) {
      const p = k / N * 0.4;
      const r = r0 + (LEN - r0) * p;
      const w = Math.max(0.5, w0 * 0.34 * Math.pow(1 - p / 0.4, 1.2));
      g.lineTo(r, w / 2);
    }
    g.closePath();
    const grd2 = g.createLinearGradient(r0, 0, r0 + (LEN - r0) * 0.4, 0);
    grd2.addColorStop(0, withAlpha(G3, Math.min(1, alpha * 1.6) * flick));
    grd2.addColorStop(1, withAlpha(G3, 0));
    g.fillStyle = grd2;
    g.fill();
    g.restore();
  }
  g.restore();
  g.globalAlpha = 1;
}

/* ── 绘制：颤动能量柱（高频抖动 + 吞咽收缩 + 边缘火花 + 流动光点） ── */
function drawTremorBeam(g, x, y, angle, length, width, alpha, t) {
  if (alpha <= 0.01) return;
  g.save();
  g.translate(x, y);
  g.rotate(angle);

  g.globalAlpha = alpha * 0.20;
  g.fillStyle = G2;
  g.fillRect(0, -hw * 2.2, length, hw * 4.4);
  g.globalAlpha = alpha;
  g.fillStyle = G3;
  g.fillRect(0, -hw, length, hw * 2);
  g.fillStyle = G0;
  g.fillRect(0, -hw * 0.45, length, hw * 0.9);
  g.fillStyle = G3;
  g.fillRect(0, -hw * 0.14, length, hw * 0.28);
  g.globalAlpha = alpha * 0.9;
  g.fillStyle = G3;
  /* v139n: 光柱边缘白色点阵已移除（曾被误认成虚线） */
  g.globalAlpha = alpha * 0.75;
  for (let i = 0; i < 7; i++) {
    const p = (t * 2.2 + i / 7) % 1;
    g.fillStyle = G3;
    g.fillRect(p * length - 4, -hw * 0.3, 8, 2);
    g.fillStyle = G0;
    g.fillRect(p * length - 1, -hw * 0.3, 2, 2);
  }
  g.globalAlpha = alpha;
  const br = hw * (1.1 + 0.25 * Math.sin(t * 40));
  g.fillStyle = G3;
  g.beginPath(); g.arc(0, 0, br, 0, Math.PI * 2); g.fill();
  g.fillStyle = G0;
  g.beginPath(); g.arc(0, 0, br * 0.45, 0, Math.PI * 2); g.fill();
  g.restore();
  g.globalAlpha = 1;
}

/* ── 绘制：光柱轮廓预演 ── */
function drawBeamPreview(g, x, y, angle, length, width, alpha, t) {

/* ── 弹幕逻辑：四芒星·圣裁充能炮 ── */
_EXT.charged_beam = [function (b, dt) {

/* 剑线工具 */
function swordLineThrough(wx, wy) {
  const cx = BOX_CX, cy = BOX_CY;
  const dx = wx - cx, dy = wy - cy;
  const len = Math.hypot(dx, dy);
  if (len < 0.001) return null;
  const ux = dx / len, uy = dy / len;
  const ext = 400;
  return { x1: cx - ux * ext, y1: cy - uy * ext, x2: cx + ux * ext, y2: cy + uy * ext };
}
function swordLineClip(wx, wy) {
  const L = swordLineThrough(wx, wy);
  if (!L) return null;
  let t0 = 0, t1 = 1;
  const dx = L.x2 - L.x1, dy = L.y2 - L.y1;
  const clip = (p, q) => {
    if (Math.abs(p) < 1e-9) return q >= 0;
    const r = q / p;
    if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
    else { if (r < t0) return false; if (r < t1) t1 = r; }
    return true;
  };
  if (clip(-dx, L.x1 - BOX_X) && clip(dx, BOX_RIGHT - L.x1) &&
      clip(-dy, L.y1 - BOX_Y) && clip(dy, BOX_BOTTOM - L.y1)) {
    return { x1: L.x1, y1: L.y1, x2: L.x2, y2: L.y2, t0, t1 };
  }
  return null;
}
function swordLinePoint(seg, t) {
  return { x: seg.x1 + (seg.x2 - seg.x1) * t, y: seg.y1 + (seg.y2 - seg.y1) * t };
}

    hint: "四芒星绕框盘旋逼近（前缓后急）→ 锚定最远框边 → 瞳孔锁定（前65%追踪后35%死锁）→ 定格光痕+颤动光柱横扫全框（默认半框宽）→ 星尘崩解。调 starSize 全炮响应式放大。"
  },
  pendulum: { fields: { damage: [8, 0, 99], armLen: [400, 80, 600], swingSpeed: [1.5, 0.2, 5], amplitude: [0.5, 0.05, 1.4], maxLife: [16, 2, 60] },
    hint: "钟摆光刃：绕出生点摆动，长刃扫过全场；重复命中带 0.9s 冷却。" },
  light_ring: { fields: { damage: [9, 0, 99], expandSpeed: [85, 10, 300], maxR: [140, 40, 300], gapHalf: [0.65, 0.15, 2.5], gapSpin: [1.5, -6, 6], maxLife: [8, 1, 20] },
    hint: "圣光环：扩张圆环，缺口处安全；与缺口中心夹角 > gapHalf 即受伤。gapSpin 让缺口旋转。" },
  piston: { fields: { damage: [10, 0, 99], side: [0, 0, 3], pos: [0.5, 0.05, 0.95], length: [80, 20, 200], width: [28, 8, 80], cycle: [2.2, 0.6, 6], maxLife: [22, 2, 90] },
    hint: "机械活塞：side 0上 / 1右 / 2下 / 3左；pos 为沿边位置 0~1；按 cycle 秒循环伸缩。" },
  boomerang: { fields: { damage: [7, 0, 99], r: [11, 4, 26], speed: [320, 80, 700], maxLife: [16, 2, 40] },
    hint: "回旋圣刃：冲向灵魂 → 折返出生点 → 再次锁定灵魂，往返不休。同一发有 0.6s 命中冷却。" },
  holy_spear: { fields: { damage: [12, 0, 99], warnDuration: [0.75, 0.2, 3], r: [10, 4, 24], maxLife: [6, 1, 20] },
    hint: "天罚光矛：预警光柱 → 高速贯落，触地爆开冲击波并有二次判定。" }
};

const TypeLabels = {
  bouncing_ball: "反弹球", homing_missile: "追踪导弹", splitter: "分裂弹",
  spiral: "螺旋弹", zigzag: "锯齿弹", orbital: "环绕弹", wave_beam: "波浪光束",
  pursuit_knife: "追猎飞刀", explosive_orb: "爆裂球", shock_diamond: "冲击菱形",
  light_saber: "光刃", black_hole: "黑洞", mirror_shard: "镜面碎片",
  holy_chain: "圣链", fallen_petal: "坠落花瓣", rune_mine: "符文雷",
  tidal_wave: "潮汐波", vortex: "漩涡", judgment_line: "裁决线",
  sword_warning: "挥砍(预警)", orb: "光球", ring: "光圈", hammer_warn: "锤击",
  /* ══ 圣械拓展 ══ */
  prism_laser: "棱镜光刃", gear: "圣齿轮", satellite: "浮游圣炮",
  charged_beam: "四芒星·圣裁炮", pendulum: "钟摆光刃", light_ring: "圣光环",
  piston: "机械活塞", boomerang: "回旋圣刃", holy_spear: "天罚光矛"
};

const EDIT_COMMON = ["x", "y", "vx", "vy", "damage", "r", "maxLife", "alpha"];

/* ── 生成表单 ── */
function buildTypeSelect() {
  const sel = document.getElementById("bType");
  sel.innerHTML = "";
  for (const k in TypeLabels) {
    const o = document.createElement("option");
    o.value = k; o.textContent = TypeLabels[k];
    sel.appendChild(o);
  }
  sel.value = "bouncing_ball";
  sel.onchange = () => { buildFields(); };
  buildFields();
}
function buildFields() {
  const type = document.getElementById("bType").value;
  const schema = Schemas[type];
  const box = document.getElementById("fields");
  box.innerHTML = "";
  for (const key in schema.fields) {
    const [def, min, max] = schema.fields[key];
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<label>${key}</label><input type="number" data-k="${key}" value="${def}" min="${min}" max="${max}" step="any">`;
    box.appendChild(row);
  }
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<label>角度°</label><input type="number" id="bAngle" value="" placeholder="留空用vx/vy">
                   <label>速率</label><input type="number" id="bSpd" value="120">`;
  box.appendChild(row);
  document.getElementById("schemaHint").textContent = "💡 " + schema.hint;
}
function collectFormCfg() {
  const type = document.getElementById("bType").value;
  const cfg = { type };
  document.querySelectorAll("#fields input[data-k]").forEach(inp => {
    cfg[inp.dataset.k] = parseFloat(inp.value) || 0;
  });
  const ang = document.getElementById("bAngle").value;
  const spd = parseFloat(document.getElementById("bSpd").value) || 120;
  if (ang !== "") {
    const a = parseFloat(ang) * Math.PI / 180;
    cfg.vx = Math.cos(a) * spd; cfg.vy = Math.sin(a) * spd;
  }
  return cfg;
}
function spawnFromForm(x, y, vx, vy) {
  const cfg = collectFormCfg();
  const origin = document.getElementById("bOrigin").value;
  if (x === undefined) {
    switch (origin) {
      case "center": x = BOX_CX; y = BOX_CY; break;
      case "click": x = Pointer.lastClick.x; y = Pointer.lastClick.y; break;
      case "soul": x = Soul.x; y = Soul.y; break;
      case "boss": x = BOSS_X; y = BOSS_Y + 10; break;
      case "edge": {
        const side = randInt(0, 3);
        if (side === 0) { x = BOX_X + rand(0, BOX_W); y = BOX_Y - 10; }
        else if (side === 1) { x = BOX_X + rand(0, BOX_W); y = BOX_BOTTOM + 10; }
        else if (side === 2) { x = BOX_X - 10; y = BOX_Y + rand(0, BOX_H); }
        else { x = BOX_RIGHT + 10; y = BOX_Y + rand(0, BOX_H); }
        break;
      }
    }
  }
  cfg.x = x; cfg.y = y;
  if (vx !== undefined) { cfg.vx = vx; cfg.vy = vy; }
  const d = Schemas[cfg.type].fields;
  if (cfg.damage === undefined && d.damage) cfg.damage = d.damage[0];
  if (cfg.r === undefined && d.r) cfg.r = d.r[0];
  const b = spawnBullet(cfg);
  if (b) { Pointer.sel = b; refreshEditPanel(); }
  return b;
}

/* ── 编辑面板 ── */
function refreshEditPanel() {
  const b = Pointer.sel;
  const info = document.getElementById("selInfo");
  const box = document.getElementById("editFields");
  if (!b || !b.alive) {
    info.textContent = "点击画布中的弹幕可选中；选中后下方实时改参，立即生效。";
    box.innerHTML = "";
    Pointer.sel = null;
    return;
  }
  const extras = [];
  for (const k in b) {
    if (["alive","type","x","y","vx","vy","damage","r","maxLife","alpha","life","age","sfxFired"].includes(k)) continue;
    if (typeof b[k] === "number") extras.push(k);
  }
  info.textContent = `已选中: ${TypeLabels[b.type] || b.type} (#${bullets.indexOf(b)})\n生命 ${b.age.toFixed(1)} / ${b.maxLife}s`;
  box.innerHTML = "";
  const keys = [...EDIT_COMMON, ...extras];
  for (const k of keys) {
    const row = document.createElement("div");
    row.className = "row";
    const v = typeof b[k] === "number" ? (Math.round(b[k] * 100) / 100) : b[k];
    row.innerHTML = `<label>${k}</label><input type="number" data-ek="${k}" value="${v}" step="any">`;
    box.appendChild(row);
  }
}
function applyEdit() {
  const b = Pointer.sel;
  if (!b || !b.alive) return;
  document.querySelectorAll("#editFields input[data-ek]").forEach(inp => {
    const v = parseFloat(inp.value);
    if (!isNaN(v)) b[inp.dataset.ek] = v;
  });
  refreshEditPanel();
}

/* ── UI 绑定 ── */
function bindUI() {
  const $ = id => document.getElementById(id);
  $("mShow").onclick = () => { Lab.mode = "showcase"; $("mShow").classList.add("on"); $("mCombat").classList.remove("on"); };
  $("mCombat").onclick = () => { Lab.mode = "combat"; $("mCombat").classList.add("on"); $("mShow").classList.remove("on"); if (Soul.hp <= 0) Soul.hp = Soul.maxHp; };
  $("soulRed").onclick = () => { Soul.mode = "red"; $("soulRed").classList.add("on"); $("soulBlue").classList.remove("on"); Soul.vy = 0; };
  $("soulBlue").onclick = () => { Soul.mode = "blue"; $("soulBlue").classList.add("on"); $("soulRed").classList.remove("on"); };
  $("btnGod").onclick = () => { Soul.god = !Soul.god; $("btnGod").textContent = "神威:" + (Soul.god ? "开" : "关"); $("btnGod").classList.toggle("on", Soul.god); };
  $("btnPause").onclick = () => { Lab.paused = !Lab.paused; $("btnPause").textContent = Lab.paused ? "继续" : "暂停"; $("btnPause").classList.toggle("on", Lab.paused); };
  $("btnStep").onclick = () => { if (Lab.paused) stepOnce(); else { Lab.paused = true; $("btnPause").textContent = "继续"; stepOnce(); } };
  $("btnClear").onclick = () => clearAllBullets();
  $("timeScale").oninput = e => { Lab.timeScale = parseFloat(e.target.value); $("tsVal").textContent = Lab.timeScale.toFixed(2) + "x"; };
  $("soulSpd").oninput = e => { Soul.speed = parseFloat(e.target.value); $("spdVal").textContent = Soul.speed; };
  $("btnSpawn").onclick = () => spawnFromForm();
  $("btnBurst").onclick = () => { let n = 0; const iv = setInterval(() => { spawnFromForm(); if (++n >= 5) clearInterval(iv); }, 120); };
  $("tglClick").onclick = () => { Pointer.mode = "click"; $("tglClick").classList.add("on"); $("tglDrag").classList.remove("on"); };
  $("tglDrag").onclick = () => { Pointer.mode = "drag"; $("tglDrag").classList.add("on"); $("tglClick").classList.remove("on"); };
  $("btnApply").onclick = applyEdit;
  $("btnDel").onclick = () => { if (Pointer.sel) { Pointer.sel.alive = false; Pointer.sel = null; refreshEditPanel(); } };
  $("btnDup").onclick = () => {
    const b = Pointer.sel;
    if (!b || !b.alive) return;
    const cfg = {};
    for (const k in b) if (typeof b[k] !== "object" || b[k] === null) cfg[k] = b[k];
    cfg.x += 12; cfg.y += 12; cfg.alive = true;
    const nb = spawnBullet(cfg);
    if (nb) { Pointer.sel = nb; refreshEditPanel(); }
  };
  $("btnExport").onclick = () => {
    const b = Pointer.sel;
    if (!b || !b.alive) return;
    const cfg = { type: b.type };
    for (const k in b) {
      if (["alive","life","age","sfxFired","chain","points","hammerInit","impacted"].includes(k)) continue;
      if (typeof b[k] === "number" || typeof b[k] === "string" || typeof b[k] === "boolean") cfg[k] = b[k];
    }
    const json = JSON.stringify(cfg, null, 2);
    navigator.clipboard && navigator.clipboard.writeText(json);
    alert("已复制到剪贴板：\n\nspawnBullet(" + json + ")");
  };
  /* 预设图案按钮 */
  const grid = $("ptnGrid");
  for (const name in Patterns) {
    const btn = document.createElement("button");
    btn.className = "ptn"; btn.textContent = name;
    btn.onclick = () => Patterns[name]();
    grid.appendChild(btn);
  }
  /* 技能单发 */
  document.querySelectorAll(".skl").forEach(btn => {
    btn.onclick = () => {
      const s = btn.dataset.s;
      if (s === "sword") spawnBullet({ type: BT.SWORD_WARNING, x: Soul.x, y: Soul.y, warnX: Soul.x, warnY: Soul.y, damage: 8, trackTime: 0.4, freezeT: 0.2, maxLife: 5 });
      else if (s === "orb") spawnBullet({ type: BT.ORB, x: BOSS_X, y: BOSS_Y + 10, phase: "flying", r: 4, hoverX: BOX_CX + rand(-50, 50), hoverY: BOX_CY + rand(-50, 50), hoverDur: 0.6, damage: 10, maxLife: 12 });
      else if (s === "ring") spawnBullet({ type: BT.RING, x: Soul.x, y: Soul.y, phase: "tracking", ringRadius: 60, ringAlpha: 0.3, trackDur: 1.2, damage: 18, maxLife: 8 });
      else if (s === "hammer") { const cx = clamp(Pointer.lastClick.x, BOX_X + 30, BOX_RIGHT - 30); spawnBullet({ type: BT.HAMMER_WARN, x: cx, y: BOX_Y, warnX: cx, damage: 12, maxLife: 2.4 }); }
      else if (s === "prism") spawnBullet({ type: BT.PRISM_LASER, x: BOX_CX, y: BOX_CY, vx: 210, vy: 95, length: 80, width: 3, r: 6, damage: 7, maxLife: 12 });
      else if (s === "gear") spawnBullet({ type: BT.GEAR, x: BOX_CX, y: BOX_CY, vx: 95, vy: -70, r: 14, rotSpeed: 4, fireRate: 1.7, shots: 5, damage: 6, maxLife: 11 });
      else if (s === "sat") spawnBullet({ type: BT.SATELLITE, x: BOSS_X, y: BOSS_Y + 10, r: 10, fireRate: 0.85, bulletSpeed: 200, damage: 4, maxLife: 8 });
      else if (s === "beam") { const ba = rand(0, Math.PI * 2); spawnBullet({ type: BT.CHARGED_BEAM, x: BOX_CX + Math.cos(ba) * 300, y: BOX_CY + Math.sin(ba) * 300, damage: 14, chargeTime: 0.8, approachDur: 2.0, beamDur: 0.45, width: 100, starSize: 40, maxLife: 9 }); }
      else if (s === "halo") spawnBullet({ type: BT.LIGHT_RING, x: BOX_CX, y: BOX_CY, expandSpeed: 85, maxR: 150, gapHalf: 0.65, gapSpin: 1.2, gapAngle: 0, damage: 9, maxLife: 8 });
      else if (s === "pend") spawnBullet({ type: BT.PENDULUM, x: BOX_CX, y: BOX_Y - 20, armLen: 400, swingSpeed: 1.5, amplitude: 0.55, damage: 8, maxLife: 18 });
      else if (s === "spear") { const cx = clamp(Pointer.lastClick.x, BOX_X + 20, BOX_RIGHT - 20); spawnBullet({ type: BT.HOLY_SPEAR, x: cx, y: BOX_Y - 36, r: 10, damage: 12, warnDuration: 0.75, maxLife: 6 }); }
      else if (s === "boomer") spawnBullet({ type: BT.BOOMERANG, x: BOX_CX, y: BOX_CY, r: 11, speed: 320, damage: 7, maxLife: 18 });
    };
  });
}

/* ══════════════ 主循环 ══════════════ */
let lastT = 0, fps = 60, fpsAcc = 0, fpsN = 0;
function stepOnce() { tick(1 / 60, true); }

function tick(ts, force) {
  const rawDt = force ? 1 / 60 : Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  rawDtGlobal = rawDt;
  const dt = rawDt * Lab.timeScale;
  if (!Lab.paused || force) {
    Timers.update(dt);
    Soul.update(dt);
    updateBullets(dt);
    updateParticles(dt);
    updateShockwaves(dt);
    updateLightnings(dt);
    DamageNumber.update(dt);
    FX.update(rawDt);
    if (Lab.hitFlash > 0) Lab.hitFlash -= rawDt * 3;
  }
  render(ts / 1000);
  requestAnimationFrame(tick);
}

function render(t) {
  const g = Screen.bctx;
  const g2 = Screen.bctx2;

  /* 震屏偏移每帧只取一次，三层共用，保证四芒星与像素层对齐 */
  let shX = 0, shY = 0;
  if (FX.shake > 0.2) {
    shX = (Math.random() - 0.5) * FX.shake;
    shY = (Math.random() - 0.5) * FX.shake;
  }

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = G0;
  g.fillRect(0, 0, CANVAS_W, CANVAS_H);
  g.save();
  g.translate(shX, shY);

  g.globalAlpha = 0.05; g.fillStyle = G2;
  for (let x = 0; x < CANVAS_W; x += 40) g.fillRect(x, 0, 1, CANVAS_H);
  for (let y = 0; y < CANVAS_H; y += 40) g.fillRect(0, y, CANVAS_W, 1);
  g.globalAlpha = 1;

  drawMiniStar(g, BOSS_X, 60, 10, Math.floor(t / 0.12) % 3, G2, 0.5);
  g.globalAlpha = 0.35; g.strokeStyle = G2; g.lineWidth = 2;
  g.beginPath(); g.arc(BOSS_X, 60, 26, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = 1;
  g.font = "10px 'Courier New',monospace"; g.textAlign = "center";
  g.fillStyle = G1; g.fillText("BOSS 出生参考", BOSS_X, 96);

  drawBattleBox(g);

  drawShockwaves(g);
  drawLightnings(g);
  StarOverlay.begin();
  drawBullets(g, t);
  StarOverlay.end();
  g.restore();

  Screen.presentBase();
  /* ★ 四芒星在此以屏幕物理分辨率绘制 → 平滑无锯齿 */
  StarOverlay.draw(Screen.ctx, shX, shY);

  g2.setTransform(1, 0, 0, 1, 0, 0);
  g2.clearRect(0, 0, CANVAS_W, CANVAS_H);
  g2.save();
  g2.translate(shX, shY);

  drawParticles(g2);

  const sel = Pointer.sel;
  if (sel && sel.alive) {
    g2.strokeStyle = "#00ff88"; g2.lineWidth = 1;
    g2.strokeRect(Math.round(sel.x - sel.r - 4) + 0.5, Math.round(sel.y - sel.r - 4) + 0.5,
      (sel.r + 4) * 2, (sel.r + 4) * 2);
    g2.globalAlpha = 0.6;
    g2.beginPath(); g2.moveTo(sel.x, sel.y);
    g2.lineTo(sel.x + sel.vx * 0.4, sel.y + sel.vy * 0.4); g2.stroke();
    g2.globalAlpha = 1;
  }

  if (Pointer.dragging && Pointer.mode === "drag" && Pointer.dragStart && Pointer.dragCur) {
    g2.globalAlpha = 0.6; g2.strokeStyle = G3; g2.setLineDash([4, 4]);
    g2.beginPath(); g2.moveTo(Pointer.dragStart.x, Pointer.dragStart.y);
    g2.lineTo(Pointer.dragCur.x, Pointer.dragCur.y); g2.stroke();
    g2.setLineDash([]); g2.globalAlpha = 1;
  }

  Soul.draw(g2, t);
  Joystick.draw(g2);

  if (Soul.mode === "blue") {
    if (!window.__parkourActive) {
      g2.globalAlpha = 0.4; g2.fillStyle = G2;
      g2.fillRect(BOX_X + 4, BOX_BOTTOM - 10, BOX_W - 8, 1);
    }
    g2.globalAlpha = 1;
  }

  g2.restore();

  if (Lab.hitFlash > 0 && Lab.mode === "showcase") {
    g2.globalAlpha = Lab.hitFlash * 0.6;
    g2.strokeStyle = "#ff2a3a"; g2.lineWidth = 3;
    g2.beginPath(); g2.arc(Soul.x, Soul.y, 16 + (1 - Lab.hitFlash) * 14, 0, Math.PI * 2); g2.stroke();
    g2.globalAlpha = 1;
  }

  drawHPBar(g2);
  DamageNumber.draw(g2);
  FX.drawOver(g2);

  g2.font = "bold 11px 'Courier New',monospace";
  g2.textAlign = "left"; g2.textBaseline = "top";
  g2.fillStyle = Lab.mode === "showcase" ? G2 : "#ff2a3a";
  g2.fillText(Lab.mode === "showcase" ? "[展示模式 · 无敌]" : "[实战模式]", 8, 8);
  if (Soul.god) { g2.fillStyle = G3; g2.fillText("[神威]", 8, 22); }

  Screen.presentTop();

  let alive = 0;
  for (const b of bullets) if (b.alive) alive++;
  fpsAcc += 1 / Math.max(rawDtGlobal, 1e-4); fpsN++;
  document.getElementById("stats").textContent =
    `FPS ${Math.round(fpsAcc / fpsN)}  弹幕 ${alive}/${BULLET_POOL_SIZE}
灵魂 (${Math.round(Soul.x)}, ${Math.round(Soul.y)})  ${Soul.mode === "red" ? "红" : "蓝"}魂`;
  if (fpsN > 20) { fpsAcc = 0; fpsN = 0; }
}

let rawDtGlobal = 1 / 60;

/* ══════════════ 启动 ══════════════ */
Screen.init();
Keyboard.init();
Pointer.init();
bindUI();
buildTypeSelect();
Screen.resize();
requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(tick); });
</script>
