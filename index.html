};

/* ── 挥砍 · 警告阶段更新 ── */
var updateSwordWarning = function(b, dt, soul) {
  const freeze = b.freezeT != null ? b.freezeT : 0.2;
  if (b.age < SWORD_TRACK_TIME) {
    b.warnX = soul.x;
    b.warnY = soul.y;
  } else if (b.age < SWORD_TRACK_TIME + freeze) {
    /* 冻结（三斩 0.2s / 五连斩 0.06s） */
  } else {
    b.type = BulletType.SWORD_STRIKE;
    b.age = 0;
    b.maxLife = 0.4;
    b.strikeFrame = 0;
    FX.explosion(b.warnX, b.warnY, 20, G3);
    FX.triggerShake(6);
  }
}

/* ── 挥砍 · 斩击阶段更新 ── */
function updateSwordStrike(b, dt, soul) {
  // 更新帧号
  const p = b.age / b.maxLife;
  b.strikeFrame = Math.min(5, Math.floor(p * 6));

  // 在斩击第 2 帧判定伤害
  if (b.strikeFrame === 2 && !b.sfxFired) {
    b.sfxFired = true;
    // 命中判定
    const d = Math.hypot(soul.x - b.warnX, soul.y - b.warnY);
    if (d < 20) {
      // 命中
      soul.damage(b.damage);
      FX.triggerShake(8);
      FX.triggerFlash(0.08);
    }
  }
}

/* ── 挥砍 · 警告绘制 ── */
var drawSwordWarning = function(g, b, t) {
  const freeze = b.freezeT != null ? b.freezeT : 0.2;
  const tracking = b.age < SWORD_TRACK_TIME;
  const freezing = !tracking && b.age < SWORD_TRACK_TIME + freeze;

  const seg = swordLineClip(b.warnX, b.warnY);
  if (seg) {
    const p0 = swordLinePoint(seg, seg.t0);
    const p1 = swordLinePoint(seg, seg.t1);

    g.globalAlpha = 0.6;
    g.strokeStyle = G3;
    g.lineWidth = 1 + Math.sin(t * 30) * 0.5;
    g.beginPath();
    g.moveTo(p0.x, p0.y);
    g.lineTo(p1.x, p1.y);
    g.stroke();

    const span = seg.t1 - seg.t0;
    const flow = seg.t0 + ((t * 300) % span);
    const pf = swordLinePoint(seg, flow);
    drawMiniStar(g, pf.x, pf.y, 3, Math.floor(t * 20) % 3, G3, 0.9);
  }
  g.globalAlpha = 1;

  const wx = clamp(b.warnX, BOX_X + 10, BOX_RIGHT - 10);
  const wy = clamp(b.warnY - 26, BOX_Y + 10, BOX_BOTTOM - 20);
  /* 冻结期快闪（频率随冻结时长自适应） */
  const blinkFreq = freeze <= 0.06 ? 30 : 15;
  const showMark = tracking || (freezing && Math.floor((b.age - SWORD_TRACK_TIME) * blinkFreq) % 2 === 0);
  if (showMark) {
    const pulse = tracking ? (0.7 + 0.3 * Math.sin(t * 12)) : 0.95;
    g.globalAlpha = pulse;
    g.fillStyle = G3;
    for (let dy = 0; dy < 6; dy++) {
      const w = 1 + dy;
      g.fillRect(wx - w, wy + dy, w * 2, 1);
    }
    g.fillRect(wx, wy + 7, 1, 3);
    g.fillRect(wx, wy + 11, 1, 1);
    g.globalAlpha = 1;
  }

  if (tracking) {
    const rr = 14;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t * 4;
      const px = b.warnX + Math.cos(a) * rr;
      const py = b.warnY + Math.sin(a) * rr;
      g.globalAlpha = 0.7;
      g.fillStyle = G3;
      g.fillRect(px - 1, py - 1, 2, 2);
    }
    g.globalAlpha = 1;
  }
}

/* ── 挥砍 · 斩击绘制 ── */
var drawSwordStrike = function(g, b, t) {
  const frame = b.strikeFrame;
  const seg = swordLineThrough(b.warnX, b.warnY);
  if (!seg) return;

  const p0 = swordLinePoint(seg, seg.t0);
  const p1 = swordLinePoint(seg, seg.t1);

  g.save();
  g.beginPath();
  g.rect(BOX_X, BOX_Y, BOX_W, BOX_H);
  g.clip();

  const widthMap = [2, 4, 8, 12, 16, 6];
  const alphaMap = [0.7, 0.85, 0.9, 0.85, 0.5, 0.3];
  const colorMap = [G3, G3, G3, G3, G2, G3];

  const w = widthMap[frame] || 4;
  let a = alphaMap[frame] || 0.5;
  if (frame === 5) {
    const p = (b.age / b.maxLife - 5 / 6) * 6;
    a = (1 - p) * 0.3;
  }

  if (frame === 2) {
    g.globalAlpha = 0.5;
    g.strokeStyle = G2;
    g.lineWidth = w * 2;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(p0.x, p0.y);
    g.lineTo(p1.x, p1.y);
    g.stroke();
  }

  g.globalAlpha = a;
  g.strokeStyle = colorMap[frame] || G3;
  g.lineWidth = w;
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(p0.x, p0.y);
  g.lineTo(p1.x, p1.y);
  g.stroke();

  if (frame === 3) {
    g.globalAlpha = 0.85;
    g.fillStyle = G3;
    for (let i = 0; i < 8; i++) {
      const tt = seg.t0 + Math.random() * (seg.t1 - seg.t0);
      const p = swordLinePoint(seg, tt);
      g.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
  }

  g.restore();
  g.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   第 46 章 · 技能二 · 光球
   ══════════════════════════════════════════════════════════════
   8 颗光球，分两批（每批 4 颗）。
   每颗：从核心弹出 → 内旋弧线飞行 → 膨胀 → 悬停抖动 → 爆炸
   爆炸时分裂 3 颗小四芒星。
   ══════════════════════════════════════════════════════════════ */

const OrbSkill = {
  orbs: [],
  active: false,
  batchIndex: 0,

  start() {
    this.active = true;
    this.orbs = [];
    this.batchIndex = 0;
    this.orbIndex = 0;
    this._cov = [];
    Log.log("技能二·光球 开始");
  },

  

launchOrb: function(index) {
  Log.log("光球 #" + (index + 1));

  const coreX = BOSS_X;
  const coreY = BOSS_Y + 10;

  /* FINAL-79 覆盖感知采样：每颗落在离既有落点最远的位置，防站桩 */
  if (!this._cov) this._cov = [];
  const margin = 26;
  let best = null, bestScore = -1;
  for (let k = 0; k < 14; k++) {
    const cx = BOX_X + margin + Math.random() * (BOX_W - margin * 2);
    const cy = BOX_Y + margin + Math.random() * (BOX_H - margin * 2);
    let dmin = 1e9;
    for (const p of this._cov) {
      const d = (p.x - cx) * (p.x - cx) + (p.y - cy) * (p.y - cy);
      if (d < dmin) dmin = d;
    }
    if (this._cov.length === 0) dmin = Math.random() * 1e9;
    if (dmin > bestScore) { bestScore = dmin; best = { x: cx, y: cy }; }
  }
  this._cov.push(best);
  if (this._cov.length > 5) this._cov.shift();

  const targetX = best.x;
  const targetY = best.y;

  const b = spawnBullet({
    type: BulletType.ORB,
    x: coreX,
    y: coreY,
    vx: 0, vy: 0,
    orbPhase: "spawning",
    orbRadius: 4,
    orbRot: 0,
    orbHoverT: 0,
    orbHoverBX: targetX,
    orbHoverBY: targetY,
    damage: 10,
    maxLife: 15,         /* ← 原为 8，远程内旋飞行可能超时 */
    alpha: 1
  });

  if (b) this.orbs.push(b);
},

  update(dt) {
    if (!this.active) return;
    let any = false;
    for (const b of this.orbs) if (b.alive) any = true;
    if (!any && this.orbIndex >= 8) {
      this.active = false;
      Log.log("技能二·光球 结束");
    }
  },

  stop() {
    this.active = false;
    for (const b of this.orbs) if (b.alive) b.alive = false;
    this.orbs = [];
  }
};

/* ── 光球 · 更新 ── */
var updateOrb = function(b, dt, soul) {
  if (b.orbPhase === "spawning") {
    b.orbRadius = lerp(b.orbRadius, 8, 8 * dt);
    const d = Math.hypot(b.orbHoverBX - b.x, b.orbHoverBY - b.y);
    if (d < 6 || b.age > 0.25) {
      b.orbPhase = "flying";
    } else {
      const ang = Math.atan2(b.orbHoverBY - b.y, b.orbHoverBX - b.x);
      b.vx = Math.cos(ang) * 150;
      b.vy = Math.sin(ang) * 150;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
  } else if (b.orbPhase === "flying") {
    const d = Math.hypot(b.orbHoverBX - b.x, b.orbHoverBY - b.y);
    if (d < 5) {
      b.orbPhase = "hovering";
      b.orbHoverT = 0;
      b.vx = 0;
      b.vy = 0;
    } else {
      const ang = Math.atan2(b.orbHoverBY - b.y, b.orbHoverBX - b.x);
      const spin = 0.8;
      const nx = Math.cos(ang + spin * dt);
      const ny = Math.sin(ang + spin * dt);
      const speed = 140 * Math.max(0.35, 1 - b.age * 0.15);
      b.vx = nx * speed;
      b.vy = ny * speed;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.orbRadius = lerp(b.orbRadius, 20, 3 * dt);
    }
  } else if (b.orbPhase === "hovering") {
    b.orbHoverT += dt;
    const shake = Math.sin(b.orbHoverT * 40) * 1.5;
    b.x = b.orbHoverBX + shake;
    b.y = b.orbHoverBY + Math.cos(b.orbHoverT * 45) * 1.5;
    b.orbRadius = 20 + Math.sin(b.orbHoverT * 20) * 2;

    if (b.orbHoverT > 0.5) {
      b.orbPhase = "exploding";
      b.age = 0;
      b.maxLife = 0.3;

      /* ── 新增：爆炸范围伤害 ── */
      const dExp = Math.hypot(soul.x - b.x, soul.y - b.y);
      if (dExp < ORB_EXPLODE_RADIUS && !b.sfxFired) {
        soul.damage(ORB_EXPLODE_DAMAGE);
        b.sfxFired = true;
      }

      FX.explosion(b.x, b.y, 30, G3);
      FX.triggerShake(8);
      FX.triggerFlash(0.1);
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + Math.random() * 0.5;
        const spd = 120;
        spawnBullet({
          type: BulletType.MINI_STAR,
          x: b.x, y: b.y,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          r: 5,
          damage: 5,
          maxLife: 1.5,
          alpha: 1,
          color: G3
        });
      }
    }
  } else if (b.orbPhase === "exploding") {
    /* 不判定 */
  }
}

/* ── 光球 · 绘制 ── */
function drawOrb(g, b, t) {
  if (b.orbPhase === "exploding") return;

  const cx = b.x;
  const cy = b.y;
  const r = b.orbRadius;
  const pulse = 0.7 + 0.3 * Math.sin(t * 8 + b.x * 0.1);

  // 外层：淡金圆环
  g.globalAlpha = 0.35 * pulse;
  g.strokeStyle = G2;
  g.lineWidth = 2;
  g.beginPath();
  g.arc(cx, cy, r + 3, 0, Math.PI * 2);
  g.stroke();

  // 中层：渐变圆
  g.globalAlpha = 0.6;
  const grd = g.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
  grd.addColorStop(0, G3);
  grd.addColorStop(0.7, withAlpha(G2, 0.6));
  grd.addColorStop(1, withAlpha(G2, 0));
  g.fillStyle = grd;
  g.beginPath();
  g.arc(cx, cy, r, 0, Math.PI * 2);
  g.fill();

  // 内层：白色核心
  g.globalAlpha = 0.9;
  g.fillStyle = G3;
  g.beginPath();
  g.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
  g.fill();

  // 中央四芒星
  g.globalAlpha = 1;
  const rot = t * 2 + b.x * 0.01;
  drawMiniStar(g, cx, cy, r * 0.7, Math.floor(t / 0.12) % 3, G0, 1);

  // 抖动时加火花
  if (b.orbPhase === "hovering") {
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = r * (0.8 + Math.random() * 0.5);
      spawnParticle({
        x: cx + Math.cos(a) * rr,
        y: cy + Math.sin(a) * rr,
        vx: Math.cos(a) * 20,
        vy: Math.sin(a) * 20,
        maxLife: 0.3,
        size: 1.5,
        color: G3,
        type: "block"
      });
    }
  }
}

/* ── 小四芒星 · 更新 ── */
function updateMiniStar(b, dt, soul) {
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 减速
  b.vx *= Math.max(0, 1 - 1.5 * dt);
  b.vy *= Math.max(0, 1 - 1.5 * dt);

  // 淡出
  const t = b.age / b.maxLife;
  b.alpha = 1 - Math.pow(t, 2);

  // 判定
  if (!b.sfxFired && t < 0.7) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < 8) {
      soul.damage(b.damage);
      b.sfxFired = true;
      FX.explosion(b.x, b.y, 12, G3);
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   第 47 章 · 技能三 · 光圈
   ══════════════════════════════════════════════════════════════
   5 次光圈。每次：
   1. 追踪阶段：光圈跟随灵魂
   2. 收缩阶段：停止追踪，逐渐缩小
   3. 落成阶段：缩小到 8px，闪烁 3 次
   4. 展开阶段：十字 + 中心圆，伤害 18
   ══════════════════════════════════════════════════════════════ */

const RingSkill = {
  rings: [],
  active: false,
  ringIndex: 0,

  start() {
    this.active = true;
    this.rings = [];
    this.ringIndex = 0;
    Log.log("技能三·光圈 开始");
  },



launchRing: function(index) {
  Log.log("光圈 #" + (index + 1));

  const points = [
    { x: BOX_X + 40, y: BOX_Y + 40 },
    { x: BOX_RIGHT - 40, y: BOX_Y + 40 },
    { x: BOX_CX, y: BOX_CY },
    { x: BOX_X + 40, y: BOX_BOTTOM - 40 },
    { x: BOX_RIGHT - 40, y: BOX_BOTTOM - 40 }
  ];
  const target = points[index % 5];

  const b = spawnBullet({
    type: BulletType.RING,
    x: Soul.x,
    y: Soul.y,
    ringRadius: 60,
    ringPhase: "tracking",
    ringAlpha: 0.3,
    damage: 18,
    maxLife: 6,          /* ← 原为 3，不足以播完 5.7s 全周期 */
    alpha: 1,
    warnX: target.x,
    warnY: target.y
  });

  if (b) this.rings.push(b);
},

  update(dt) {
    if (!this.active) return;
    let any = false;
    for (const b of this.rings) if (b.alive) any = true;
    if (!any && this.ringIndex >= 5) {
      this.active = false;
      Log.log("技能三·光圈 结束");
    }
  },

  stop() {
    this.active = false;
    for (const b of this.rings) if (b.alive) b.alive = false;
    this.rings = [];
  }
};

/* ── 光圈 · 更新 ── */
var updateRing = function(b, dt, soul) {
  if (b.ringPhase === "tracking") {
    b.x = lerp(b.x, soul.x, 6 * dt);
    b.y = lerp(b.y, soul.y, 6 * dt);

    if (b.age > RING_TRACK_V15) {
      b.ringPhase = "shrinking";
      b.ringRadius = 60;
    }
  } else if (b.ringPhase === "shrinking") {
    b.ringRadius -= RING_SHRINK_SPEED_V15 * dt;
    b.ringAlpha = lerp(0.3, 1, 1 - b.ringRadius / 60);

    if (b.ringRadius <= 8) {
      b.ringPhase = "flashing";
      b.ringFlashT = 0;
      b.ringRadius = 8;
    }
  } else if (b.ringPhase === "flashing") {
    b.ringFlashT += dt;
    if (b.ringFlashT > 0.3) {
      b.ringPhase = "expanding";
      b.ringFlashT = 0;
      spawnCross(b.x, b.y);
      FX.explosion(b.x, b.y, 40, G3);
      FX.triggerShake(12);
      FX.triggerFlash(0.15);
      const d = Math.hypot(soul.x - b.x, soul.y - b.y);
      if (d < 20) {
        soul.damage(b.damage);
      }
    }
  } else if (b.ringPhase === "expanding") {
    b.ringFlashT += dt;
    if (b.ringFlashT > 0.4) {
      b.alive = false;
    }
  }
}

/* ── 光圈 · 绘制 ── */
function drawRing(g, b, t) {
  if (b.ringPhase === "tracking" || b.ringPhase === "shrinking") {
    // 主线
    g.globalAlpha = b.ringAlpha;
    g.strokeStyle = G3;
    g.lineWidth = 1 + (1 - b.ringRadius / 60) * 2;
    g.beginPath();
    g.arc(b.x, b.y, b.ringRadius, 0, Math.PI * 2);
    g.stroke();

    // 副线（偏移）
    g.globalAlpha = b.ringAlpha * 0.5;
    g.strokeStyle = G2;
    g.lineWidth = 1;
    g.beginPath();
    g.arc(b.x + 1, b.y + 1, b.ringRadius, 0, Math.PI * 2);
    g.stroke();

    // 4 个旋转的四芒星
    const rot = t * 3;
    for (let i = 0; i < 4; i++) {
      const a = rot + (i / 4) * Math.PI * 2;
      const px = b.x + Math.cos(a) * b.ringRadius;
      const py = b.y + Math.sin(a) * b.ringRadius;
      drawMiniStar(g, px, py, 3, Math.floor(t / 0.12) % 3, G3, b.ringAlpha);
    }
  } else if (b.ringPhase === "flashing") {
    // 闪烁 3 次
    const flash = Math.floor(b.ringFlashT * 20) % 2;
    if (flash) {
      g.globalAlpha = 0.9;
      g.strokeStyle = G3;
      g.lineWidth = 3;
      g.beginPath();
      g.arc(b.x, b.y, b.ringRadius, 0, Math.PI * 2);
      g.stroke();
    }
  }
}

/* ── 十字展开 ── */
function spawnCross(x, y) {
  spawnBullet({
    type: BulletType.CROSS,
    x, y,
    crossPhase: "expanding",
    crossT: 0,
    damage: 18,
    maxLife: 0.5,
    alpha: 1
  });
}

function updateCross(b, dt, soul) {
  b.crossT += dt;
  // 0.3s 内命中判定
  if (b.crossT < 0.3 && !b.sfxFired) {
    // 判断玩家是否在十字上
    const dx = Math.abs(soul.x - b.x);
    const dy = Math.abs(soul.y - b.y);
    // 十字：水平或垂直方向上距离近
    if (dx < 8 || dy < 8) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }
}

var drawCross = function(g, b, t) {
  const p = clamp(b.crossT / 0.3, 0, 1);

  /* 线宽包络： 前 45% 由 2 展开到 24 */
  const wProf = Ease.quadOut(clamp(p / 0.45, 0, 1));
  const W = 2 + wProf * 22;
  /* 透明度： 后 45% 渐逝 */
  let a = 1 - Ease.quadIn(clamp((p - 0.55) / 0.45, 0, 1));
  const flick = 0.78 + 0.22 * Math.sin(t * 57);
  const blackout = Math.floor(b.crossT * 26) % 6 !== 5;
  a *= flick * (blackout ? 1 : 0.12);
  if (a <= 0.012) return;

  g.save();
  g.beginPath();
  g.rect(BOX_X, BOX_Y, BOX_W, BOX_H);
  g.clip();

  const cx = b.x, cy = b.y;

  /* 外圈淡光（G2，宽×2，仿斩击外晕） */
  g.globalAlpha = a * 0.5;
  g.strokeStyle = G2;
  g.lineWidth = W * 2;
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(BOX_X, cy); g.lineTo(BOX_RIGHT, cy);
  g.moveTo(cx, BOX_Y); g.lineTo(cx, BOX_BOTTOM);
  g.stroke();

  /* 主带（G3） */
  g.globalAlpha = a;
  g.strokeStyle = G3;
  g.lineWidth = W;
  g.beginPath();
  g.moveTo(BOX_X, cy); g.lineTo(BOX_RIGHT, cy);
  g.moveTo(cx, BOX_Y); g.lineTo(cx, BOX_BOTTOM);
  g.stroke();

  /* 核心亮线 */
  g.globalAlpha = a * 0.9;
  g.lineWidth = Math.max(2, W * 0.25);
  g.beginPath();
  g.moveTo(BOX_X, cy); g.lineTo(BOX_RIGHT, cy);
  g.moveTo(cx, BOX_Y); g.lineTo(cx, BOX_BOTTOM);
  g.stroke();

  /* 四端光斑 */
  g.globalAlpha = a;
  g.fillStyle = G3;
  const tips = [[BOX_X + 2, cy], [BOX_RIGHT - 2, cy], [cx, BOX_Y + 2], [cx, BOX_BOTTOM - 2]];
  for (const [px, py] of tips) {
    g.fillRect(px - 2, py - 2, 4, 4);
  }

  g.restore();
  g.globalAlpha = 1;

  /* 沿臂火花 */
  if (p < 0.85) {
    g.globalAlpha = a * 0.9;
    g.fillStyle = G3;
    for (let i = 0; i < 6; i++) {
      const horiz = i % 2 === 0;
      const rr = Math.random();
      const px = horiz ? BOX_X + rr * BOX_W : cx + (Math.random() - 0.5) * W;
      const py = horiz ? cy + (Math.random() - 0.5) * W : BOX_Y + rr * BOX_H;
      g.fillRect(px - 1, py - 1, 2, 2);
    }
    g.globalAlpha = 1;
  }
}

/* ══════════════════════════════════════════════════════════════
   第 48 章 · 技能四 · 锤击
   ══════════════════════════════════════════════════════════════
   4 次锤击。
   每次：预警 0.6s + 落下 0.1s
   落点：左 → 右 → 左 → 中
   伤害 12
   ══════════════════════════════════════════════════════════════ */

const HammerSkill = {
  active: false,
  hammerIndex: 0,

  start() {
    this.active = true;
    this.hammerIndex = 0;
    Log.log("技能四·锤击 开始");
  },



launchHammer: function(index) {
  Log.log("锤击 #" + (index + 1));
  const frac = [0.25, 0.75, 0.25, 0.5][index];
  const cx = BOX_X + BOX_W * frac;
  const b = spawnBullet({
    type: BulletType.HAMMER_WARN,
    x: cx, y: BOX_Y,
    warnX: cx,
    damage: 12,
    maxLife: 2.4,
    alpha: 1
  });
  if (b) { b.hammerInit = false; b.warnDur = [0.55, 0.55, 0.4, 0.3][index] || 0.3; }
},

  update(dt) {
    if (!this.active) return;
    // 4 次完成时不再触发
    if (this.hammerIndex >= 4) {
      // 检查是否有残留弹幕
      let any = false;
      for (const b of bullets) {
        if (b.alive && (b.type === BulletType.HAMMER_WARN || b.type === BulletType.HAMMER_STRIKE)) {
          any = true;
          break;
        }
      }
      if (!any) {
        this.active = false;
        Log.log("技能四·锤击 结束");
      }
    }
  },

  stop() {
    this.active = false;
  }
};

/* ── 锤击 · 预警更新 ── */
var updateHammerWarn = function(b, dt, soul) {
  if (!b.hammerInit) {
    b.hammerInit = true;
    b.maxLife = 2.4;
    b.impacted = false;
  }
  const t = b.age;
  if (t >= (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0) && !b.impacted) {
    b.impacted = true;
    FX.triggerShake(8);
    FX.triggerFlash(0.08);
    b.boltUntil = t + 0.36;
    burstParticles(b.warnX, H4_GROUND - 4, 14, {
      speed: 160, maxLife: 0.4, size: 2, color: G3, gravity: 380, type: "block"
    });
    const half = H4_HW / 2;
    if (Math.abs(soul.x - b.warnX) < half && soul.y > BOX_Y) {
      soul.damage(b.damage);
    }
  }
}

/* ── 锤击 · 落下更新 ── */
var updateHammerStrike = function(b, dt, soul) { }

/* ── 锤击 · 预警绘制 ── */
var drawHammerWarn = function(g, b, t) {
  const tt = Math.min(b.age, 3.0);
  const fT = (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0) + Math.sqrt(2 * (H4_IMPACT_Y - H4_START_Y) / HAMMER_GRAV);
  const seed = mulberry32((b.warnX | 0) + 7);

  g.save();
  g.beginPath();
  g.rect(BOX_X + 2, BOX_Y + 2, BOX_W - 4, BOX_H - 4);
  g.clip();

  /* ① 警示框： 黄↔红 12Hz, 宽度=锤宽, 底部压框底 */
  if (tt < (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0)) {
    const blink = Math.floor(tt * 12) % 2 === 0;
    const c = blink ? "#ffff00" : "#ff0000";
    const bx = b.warnX - H4_HW / 2, by = H4_GROUND - 26;
    g.globalAlpha = 0.9;
    g.fillStyle = c;
    g.fillRect(bx - 3, by - 3, H4_HW + 6, 28);
    g.globalAlpha = 0.6;
    g.fillStyle = G0;
    g.fillRect(bx, by, H4_HW, 22);
    g.globalAlpha = 0.9;
    g.fillStyle = c;
    g.font = "bold 16px 'Courier New', monospace";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("!", b.warnX, by + 11);
    g.globalAlpha = 0.95;
    g.fillRect(bx, H4_GROUND - 2, H4_HW, 2);
    g.globalAlpha = 1;
  }

  /* ② 锤体: ½gt², 锤头落进框底边框 */
  const hy = tt < (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0)
    ? H4_START_Y
    : Math.min(H4_START_Y + 0.5 * HAMMER_GRAV * Math.pow(tt - (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0), 2), H4_IMPACT_Y);
  const hx = b.warnX - H4_HW / 2;
  let hA = 1;
  if (tt > fT + 0.8) hA = Math.max(0, 1 - (tt - fT - 0.8) / 0.3);
  if (hA > 0) {
    g.globalAlpha = hA;
    if (tt >= (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0) && tt < fT) {
      const v = HAMMER_GRAV * (tt - (b.warnDur != null ? b.warnDur : HAMMER_FALL_T0));
      const nl = Math.min(4, 1 + Math.floor(v / 500));
      g.fillStyle = G3;
      for (let i = 0; i < nl; i++) {
        g.fillRect(b.warnX - 14 + i * 9, Math.max(BOX_Y - 30, hy - 20 - i * 13), 2, 16);
      }
    }
    drawHammerPix4(g, hx, hy);
    if (tt < fT) drawHammerPix4(g, hx, Math.max(H4_START_Y, hy - 8));
    g.globalAlpha = 1;
  }

  /* ③ 撞击白闪走廊（锤宽） + 环 + 径向 */
  if (tt >= fT && tt < fT + 0.1) {
    const p = 1 - (tt - fT) / 0.1;
    g.globalAlpha = 0.9 * p;
    g.fillStyle = G3;
    g.fillRect(b.warnX - H4_HW / 2, BOX_Y + 2, H4_HW, H4_GROUND - BOX_Y);
    g.globalAlpha = p;
    g.strokeStyle = G3;
    g.lineWidth = 2;
    g.beginPath();
    g.arc(b.warnX, H4_GROUND - 6, 8 + (1 - p) * 40, 0, Math.PI * 2);
    g.stroke();
    for (let i = 0; i < 8; i++) {
      const a = i * 0.785;
      g.beginPath();
      g.moveTo(b.warnX, H4_GROUND - 6);
      g.lineTo(b.warnX + Math.cos(a) * (14 + (1 - p) * 34), H4_GROUND - 6 + Math.sin(a) * (14 + (1 - p) * 34));
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  /* ④ 包络雷击 ×2 + 框闪 */
  if (tt >= fT) {
    const lt = tt - fT;
    for (let i = 0; i < 2; i++) {
      const ba = lt - i * 0.18;
      if (ba > 0 && ba < 0.07) {
        g.globalAlpha = 0.85 * (1 - ba / 0.07);
        g.fillStyle = G3;
        g.fillRect(BOX_X + 2, BOX_Y + 2, BOX_W - 4, BOX_H - 4);
        g.globalAlpha = 1;
      }
      if (ba > 0 && ba < 0.3) {
        drawHammerBolt(g, genHammerBolt(b.warnX + (Math.random() - 0.5) * 10, BOX_Y - 4, b.warnX, H4_GROUND - 2));
      }
    }
  }

  /* ⑤ 地裂 + 烟 */
  if (tt >= fT) {
    const ct = tt - fT;
    if (ct < 1.2) {
      g.globalAlpha = Math.max(0, 1 - ct / 1.2);
      g.strokeStyle = G3;
      g.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        let cx2 = b.warnX, cy2 = H4_GROUND + 2;
        let a = (i - 1) * 0.9 + (seed() - 0.5) * 0.4;
        g.beginPath();
        g.moveTo(cx2, cy2);
        for (let s = 0; s < 5; s++) {
          cx2 += Math.cos(a) * (6 + seed() * 6);
          cy2 += Math.abs(Math.sin(a)) * (2 + seed() * 3);
          a += (seed() - 0.5) * 0.8;
          g.lineTo(cx2, cy2);
        }
        g.stroke();
      }
      g.globalAlpha = 1;
    }
    if (ct < 0.9) {
      for (let i = 0; i < 5; i++) {
        const p = ct / 0.9;
        const sx = b.warnX + (seed() - 0.5) * 36;
        const sy = H4_GROUND - 4 - ct * (14 + seed() * 16);
        const pat = Math.floor(ct * 12 + i) % 2;
        g.globalAlpha = (1 - p) * 0.8;
        g.fillStyle = G2;
        for (let dy = 0; dy < 3; dy++) {
          for (let dx = 0; dx < 3; dx++) {
            if ((dx + dy + pat) % 2 === 0) g.fillRect(sx + dx * 3 - 4, sy + dy * 3 - 4, 3, 3);
          }
        }
      }
      g.globalAlpha = 1;
    }
  }

  g.restore();
}

/* ── 锤击 · 落下绘制 ── */
var drawHammerStrike = function(g, b, t) { }

/* ══════════════════════════════════════════════════════════════
   第 50 章 · 技能调度器

   根据音乐 tick 自动触发对应技能。

/* ══════════════════════════════════════════════════════════════
   第 3A 章 · 新增弹幕类型定义
   ══════════════════════════════════════════════════════════════ */

const BulletTypeExt = {
  // 弹幕类型扩展
  HOMING_MISSILE: "homing_missile",   // 追踪导弹
  BOUNCING_BALL:  "bouncing_ball",    // 反弹球
  SPLITTER:       "splitter",         // 分裂弹
  SPIRAL:         "spiral",           // 螺旋弹
  RING_ARRAY:     "ring_array",       // 环形阵列
  ZIGZAG:         "zigzag",           // 锯齿弹
  ORBITAL:        "orbital",          // 环绕弹
  WAVE_BEAM:      "wave_beam",        // 波浪光束
  PURSUIT_KNIFE:  "pursuit_knife",    // 追猎飞刀
  EXPLOSIVE_ORB:  "explosive_orb",    // 爆裂球
  SHOCK_DIAMOND:  "shock_diamond",    // 冲击菱形
  LIGHT_SABER:    "light_saber",      // 光刃
  BLACK_HOLE:     "black_hole",       // 黑洞
  MIRROR_SHARD:   "mirror_shard",     // 镜面碎片
  HOLY_CHAIN:     "holy_chain",       // 圣链
  FALLEN_PETAL:   "fallen_petal",     // 坠落花瓣
  RUNE_MINE:      "rune_mine",        // 符文雷
  TIDAL_WAVE:     "tidal_wave",       // 潮汐波
  VORTEX:         "vortex",           // 漩涡
  JUDGMENT_LINE:  "judgment_line"     // 裁决线

/* ══════════════════════════════════════════════════════════════
   第 3B 章 · 追踪导弹
   ══════════════════════════════════════════════════════════════ */

function updateHomingMissile(b, dt, soul) {
  // 前 0.5s 自由飞行，之后开始追踪
  if (b.age > 0.5) {
    const dx = soul.x - b.x;
    const dy = soul.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    const turnRate = b.turnRate || 3.5;
    const targetVx = dx / d * b.speed;
    const targetVy = dy / d * b.speed;
    b.vx = lerp(b.vx, targetVx, turnRate * dt);
    b.vy = lerp(b.vy, targetVy, turnRate * dt);
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 拖尾
  if (Math.random() < dt * 30) {
    spawnParticle({
      x: b.x, y: b.y,
      vx: rand(-8, 8), vy: rand(-8, 8),
      maxLife: 0.35, size: 2,
      color: G2, type: "block"
    });
  }

  // 碰撞
  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
      FX.explosion(b.x, b.y, 20, G3);
      b.alive = false;
    }
  }

  // 出界
  if (b.x < -50 || b.x > CANVAS_W + 50 || b.y < -50 || b.y > CANVAS_H + 50) {
    b.alive = false;
  }
}

function drawHomingMissile(g, b, t) {
  const ang = Math.atan2(b.vy, b.vx);
  g.save();
  g.translate(b.x, b.y);
  g.rotate(ang);

  // 弹体
  g.fillStyle = G3;
  g.fillRect(-8, -3, 12, 6);
  g.fillStyle = G1;
  g.fillRect(-8, -1, 12, 2);

  // 尾翼
  g.fillStyle = G2;
  g.fillRect(-10, -5, 4, 2);
  g.fillRect(-10, 3, 4, 2);

  // 头
  g.fillStyle = G3;
  g.fillRect(4, -2, 3, 4);

  // 引擎火
  if (Math.random() < 0.7) {
    const flicker = 0.7 + Math.random() * 0.6;
    g.globalAlpha = flicker;
    g.fillStyle = G3;
    g.fillRect(-13, -2, 3, 4);
  }

  g.restore();
  g.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   第 3C 章 · 反弹球
   ══════════════════════════════════════════════════════════════ */

function updateBouncingBall(b, dt, soul) {
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  const r = b.r;
  // 战斗框边界反弹
  if (b.x - r < BOX_X) {
    b.x = BOX_X + r;
    b.vx = Math.abs(b.vx);
    FX.triggerShake(2);
  }
  if (b.x + r > BOX_RIGHT) {
    b.x = BOX_RIGHT - r;
    b.vx = -Math.abs(b.vx);
    FX.triggerShake(2);
  }
  if (b.y - r < BOX_Y) {
    b.y = BOX_Y + r;
    b.vy = Math.abs(b.vy);
    FX.triggerShake(2);
  }
  if (b.y + r > BOX_BOTTOM) {
    b.y = BOX_BOTTOM - r;
    b.vy = -Math.abs(b.vy);
    FX.triggerShake(2);
  }

  // 碰撞
  if (!b.sfxFired && b.age > 0.3) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }
}

function drawBouncingBall(g, b, t) {
  const pulse = 0.7 + 0.3 * Math.sin(t * 10 + b.x * 0.1);

  // 外光晕
  const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2);
  grd.addColorStop(0, withAlpha(G3, 0.4 * pulse));
  grd.addColorStop(1, withAlpha(G3, 0));
  g.fillStyle = grd;
  g.fillRect(b.x - b.r * 2, b.y - b.r * 2, b.r * 4, b.r * 4);

  // 主体
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  g.fill();

  // 内部
  g.fillStyle = G1;
  g.beginPath();
  g.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2);
  g.fill();

  // 中心
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r * 0.2, 0, Math.PI * 2);
  g.fill();
}

/* ══════════════════════════════════════════════════════════════
   第 3D 章 · 分裂弹
   ══════════════════════════════════════════════════════════════ */

function updateSplitter(b, dt, soul) {
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 到达分裂时间后分裂
  if (b.age > b.splitAt && !b.hasSplit) {
    b.hasSplit = true;
    const count = b.splitCount || 4;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + b.angle;
      const spd = 100;
      spawnBullet({
        type: BulletTypeExt.BOUNCING_BALL,
        x: b.x, y: b.y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        r: 6,
        damage: Math.ceil(b.damage / 2),
        maxLife: 3,
        color: G3,
        alpha: 1
      });
    }
    FX.explosion(b.x, b.y, 25, G3);
    b.alive = false;
  }

  // 碰撞
  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }
}

function drawSplitter(g, b, t) {
  const wobble = Math.sin(t * 8 + b.x * 0.1) * 1.5;
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r + wobble, 0, Math.PI * 2);
  g.fill();

  // 内圈表示将要分裂
  g.fillStyle = G1;
  const pulse = 0.5 + 0.5 * Math.sin(t * 12);
  g.beginPath();
  g.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
  g.fill();

  // 分裂倒计时指示
  const remaining = 1 - b.age / b.splitAt;
  g.strokeStyle = G3;
  g.lineWidth = 1.5;
  g.beginPath();
  g.arc(b.x, b.y, b.r + 3, -Math.PI / 2, -Math.PI / 2 + remaining * Math.PI * 2);
  g.stroke();
}

/* ══════════════════════════════════════════════════════════════
   第 3E 章 · 螺旋弹
   ══════════════════════════════════════════════════════════════ */

function updateSpiral(b, dt, soul) {
  // 螺旋运动：绕起始点旋转 + 向外扩散
  b.angle += (b.angularSpeed || 2) * dt;
  b.radius += (b.radialSpeed || 40) * dt;

  b.x = b.originX + Math.cos(b.angle) * b.radius;
  b.y = b.originY + Math.sin(b.angle) * b.radius;

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  // 出界
  if (b.x < -60 || b.x > CANVAS_W + 60 || b.y < -60 || b.y > CANVAS_H + 60) {
    b.alive = false;
  }
}

function drawSpiral(g, b, t) {
  // 拖尾
  const trailLen = 8;
  for (let i = 0; i < trailLen; i++) {
    const k = i / trailLen;
    const px = b.x - Math.cos(b.angle - k * 0.5) * 8 * k;
    const py = b.y - Math.sin(b.angle - k * 0.5) * 8 * k;
    g.globalAlpha = (1 - k) * 0.5;
    g.fillStyle = G3;
    g.fillRect(px - 2, py - 2, 4, 4);
  }
  g.globalAlpha = 1;

  // 主体
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  g.fill();

  // 四芒星标记
  drawMiniStar(g, b.x, b.y, 3, Math.floor(t / 0.12) % 3, G0, 1);
}

/* ══════════════════════════════════════════════════════════════
   第 3F 章 · 环形阵列弹
   ══════════════════════════════════════════════════════════════ */

function spawnRingArray(cx, cy, count, radius, speed, cfg) {
  cfg = cfg || {};
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + (cfg.angleOffset || 0);
    spawnBullet({
      type: BulletTypeExt.BOUNCING_BALL,
      x: cx + Math.cos(a) * radius,
      y: cy + Math.sin(a) * radius,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      r: cfg.size || 6,
      damage: cfg.damage || 5,
      maxLife: 4,
      color: cfg.color || G3,
      alpha: 1
    });
  }
  // 生成冲击波
  spawnShockwave({
    x: cx, y: cy,
    r0: radius * 0.5, maxR: radius * 1.3,
    maxLife: 0.4, color: G3, width: 2
  });
}

/* ══════════════════════════════════════════════════════════════
   第 3G 章 · 锯齿弹
   ══════════════════════════════════════════════════════════════ */

var updateZigzag = function(b, dt, soul) {
  b.zigT = (b.zigT || 0) + dt;
  const zig = Math.sin(b.zigT * (b.freq || 8)) * (b.amp || 30);
  const speed = Math.hypot(b.vx, b.vy) || 1;
  const nx = -b.vy / speed;
  const ny = b.vx / speed;

  /* 帧率无关：横向速度 ≈ zig/3 px/s（与原版 60fps 下的行为等效） */
  b.x += (b.vx + nx * zig / 3) * dt;
  b.y += (b.vy + ny * zig / 3) * dt;

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (b.x < -60 || b.x > CANVAS_W + 60 || b.y < -60 || b.y > CANVAS_H + 60) {
    b.alive = false;
  }
}

function drawZigzag(g, b, t) {
  // 拖尾
  const trailPts = 5;
  for (let i = 1; i <= trailPts; i++) {
    const k = i / trailPts;
    g.globalAlpha = (1 - k) * 0.6;
    g.fillStyle = G3;
    g.fillRect(b.x - k * 8 - 2, b.y - k * 4 - 2, 4, 4);
  }
  g.globalAlpha = 1;

  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = G0;
  g.beginPath();
  g.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2);
  g.fill();
}

/* ══════════════════════════════════════════════════════════════
   第 3H 章 · 环绕弹
   ══════════════════════════════════════════════════════════════ */

function updateOrbital(b, dt, soul) {
  b.angle += (b.angularSpeed || 2) * dt;

  // 环绕锚点跟随灵魂（可选）
  if (b.followSoul) {
    b.originX = lerp(b.originX, soul.x, 4 * dt);
    b.originY = lerp(b.originY, soul.y, 4 * dt);
  }

  b.x = b.originX + Math.cos(b.angle) * b.orbitRadius;
  b.y = b.originY + Math.sin(b.angle) * b.orbitRadius;

  // 环绕半径逐渐缩小
  if (b.shrinking) {
    b.orbitRadius = Math.max(8, b.orbitRadius - 30 * dt);
  }

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  // 生命周期结束
  if (b.age > b.maxLife) {
    b.alive = false;
  }
}

function drawOrbital(g, b, t) {
  // 圆心到弹的连线（虚线）
  g.globalAlpha = 0.25;
  g.strokeStyle = G3;
  g.lineWidth = 1;
  g.setLineDash([3, 3]);
  g.beginPath();
  g.moveTo(b.originX, b.originY);
  g.lineTo(b.x, b.y);
  g.stroke();
  g.setLineDash([]);
  g.globalAlpha = 1;

  // 轨道圆
  g.globalAlpha = 0.15;
  g.strokeStyle = G3;
  g.beginPath();
  g.arc(b.originX, b.originY, b.orbitRadius, 0, Math.PI * 2);
  g.stroke();
  g.globalAlpha = 1;

  // 弹体
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  g.fill();

  // 旋转的内圈
  g.fillStyle = G0;
  const innerR = b.r * (0.4 + 0.2 * Math.sin(t * 8));
  g.beginPath();
  g.arc(b.x, b.y, innerR, 0, Math.PI * 2);
  g.fill();
}

/* ══════════════════════════════════════════════════════════════
   第 3I 章 · 波浪光束
   ══════════════════════════════════════════════════════════════ */

function updateWaveBeam(b, dt, soul) {
  // 从起点到终点扫过，带波浪偏移
  b.beamT += dt;
  const p = b.beamT / b.beamDur;
  if (p >= 1) {
    b.alive = false;
    return;
  }

  // 当前光束头部位置
  const hx = lerp(b.beamX1, b.beamX2, p);
  const hy = lerp(b.beamY1, b.beamY2, p);

  b.x = hx;
  b.y = hy;

  // 判断玩家是否在光束上
  const dx = soul.x - hx;
  const dy = soul.y - hy;
  const perpX = -(b.beamY2 - b.beamY1);
  const perpY = (b.beamX2 - b.beamX1);
  const perpLen = Math.hypot(perpX, perpY);
  const dist = Math.abs(dx * perpX + dy * perpY) / perpLen;
  const along = (dx * (b.beamX2 - b.beamX1) + dy * (b.beamY2 - b.beamY1)) /
    ((b.beamX2 - b.beamX1) ** 2 + (b.beamY2 - b.beamY1) ** 2) || 0;

  if (dist < 10 && along >= 0 && along <= p && !b.sfxFired) {
    soul.damage(b.damage);
    b.sfxFired = true;
  }
}

function drawWaveBeam(g, b, t) {
  const p = b.beamT / b.beamDur;
  const hx = lerp(b.beamX1, b.beamX2, p);
  const hy = lerp(b.beamY1, b.beamY2, p);

  // 光束拖尾
  g.globalAlpha = 0.6;
  g.strokeStyle = G3;
  g.lineWidth = 6;
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(b.beamX1, b.beamY1);
  g.lineTo(hx, hy);
  g.stroke();

  // 内芯
  g.globalAlpha = 1;
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(b.beamX1, b.beamY1);
  g.lineTo(hx, hy);
  g.stroke();

  // 头部发光点
  const grd = g.createRadialGradient(hx, hy, 0, hx, hy, 16);
  grd.addColorStop(0, withAlpha(G3, 0.9));
  grd.addColorStop(1, withAlpha(G3, 0));
  g.fillStyle = grd;
  g.fillRect(hx - 16, hy - 16, 32, 32);
  g.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   第 3J 章 · 追猎飞刀
   ══════════════════════════════════════════════════════════════ */

function updatePursuitKnife(b, dt, soul) {
  // 前 0.3s 追踪
  if (b.age < 0.3) {
    const dx = soul.x - b.x;
    const dy = soul.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    b.vx = dx / d * b.speed;
    b.vy = dy / d * b.speed;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.rot += 12 * dt;

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (b.x < -60 || b.x > CANVAS_W + 60 || b.y < -60 || b.y > CANVAS_H + 60) {
    b.alive = false;
  }
}

function drawPursuitKnife(g, b, t) {
  g.save();
  g.translate(b.x, b.y);
  g.rotate(b.rot);

  // 刀身
  g.fillStyle = G3;
  g.fillRect(-12, -2, 20, 4);
  g.fillStyle = G2;
  g.fillRect(-12, 0, 20, 2);

  // 刀尖
  g.fillStyle = G3;
  g.beginPath();
  g.moveTo(8, -2);
  g.lineTo(14, 0);
  g.lineTo(8, 2);
  g.fill();

  // 护手
  g.fillStyle = G0;
  g.fillRect(-14, -3, 3, 6);

  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   第 3K 章 · 爆裂球
   ══════════════════════════════════════════════════════════════ */

function updateExplosiveOrb(b, dt, soul) {
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 摩擦
  b.vx *= Math.max(0, 1 - 1.5 * dt);
  b.vy *= Math.max(0, 1 - 1.5 * dt);

  // 到达爆炸时间或速度过慢
  const speed = Math.hypot(b.vx, b.vy);
  if (b.age > b.explodeAt || speed < 10) {
    // 爆炸
    const R = b.explodeRadius || 60;
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < R && !b.sfxFired) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }

    // 生成爆裂碎片
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      spawnBullet({
        type: BulletTypeExt.BOUNCING_BALL,
        x: b.x, y: b.y,
        vx: Math.cos(a) * 160,
        vy: Math.sin(a) * 160,
        r: 4,
        damage: 3,
        maxLife: 2,
        color: G3,
        alpha: 1
      });
    }

    FX.explosion(b.x, b.y, R, G3);
    b.alive = false;
  }
}

function drawExplosiveOrb(g, b, t) {
  const pulse = 0.8 + 0.3 * Math.sin(t * 12);

  // 外圈脉动
  g.globalAlpha = 0.4;
  g.strokeStyle = G3;
  g.lineWidth = 2;
  g.beginPath();
  g.arc(b.x, b.y, b.r + 5 * pulse, 0, Math.PI * 2);
  g.stroke();
  g.globalAlpha = 1;

  // 主体
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  g.fill();

  // 内核
  g.fillStyle = G0;
  g.beginPath();
  g.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
  g.fill();

  // 中心标记
  drawMiniStar(g, b.x, b.y, 2, Math.floor(t / 0.08) % 3, G3, 1);
}

/* ══════════════════════════════════════════════════════════════
   第 3L 章 · 冲击菱形
   ══════════════════════════════════════════════════════════════ */

function updateShockDiamond(b, dt, soul) {
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.rot += 3 * dt;

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
      FX.explosion(b.x, b.y, 20, G3);
    }
  }

  if (b.x < -60 || b.x > CANVAS_W + 60 || b.y < -60 || b.y > CANVAS_H + 60) {
    b.alive = false;
  }
}

function drawShockDiamond(g, b, t) {
  g.save();
  g.translate(b.x, b.y);
  g.rotate(b.rot);

  const s = b.r;
  g.fillStyle = G3;
  g.beginPath();
  g.moveTo(0, -s);
  g.lineTo(s, 0);
  g.lineTo(0, s);
  g.lineTo(-s, 0);
  g.closePath();
  g.fill();

  g.fillStyle = G0;
  g.beginPath();
  g.moveTo(0, -s * 0.5);
  g.lineTo(s * 0.5, 0);
  g.lineTo(0, s * 0.5);
  g.lineTo(-s * 0.5, 0);
  g.closePath();
  g.fill();

  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   第 3M 章 · 光刃
   ══════════════════════════════════════════════════════════════ */

function updateLightSaber(b, dt, soul) {
  // 沿固定方向快速飞行的长条
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 命中判定使用线段
  const halfLen = b.length / 2;
  const ang = Math.atan2(b.vy, b.vx);
  const x1 = b.x - Math.cos(ang) * halfLen;
  const y1 = b.y - Math.sin(ang) * halfLen;
  const x2 = b.x + Math.cos(ang) * halfLen;
  const y2 = b.y + Math.sin(ang) * halfLen;

  if (!b.sfxFired) {
    // 点到线段距离
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = ((soul.x - x1) * dx + (soul.y - y1) * dy) / len2;
    t = clamp(t, 0, 1);
    const px = x1 + dx * t;
    const py = y1 + dy * t;
    const d = Math.hypot(soul.x - px, soul.y - py);
    if (d < 8 + b.r) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (b.x < -100 || b.x > CANVAS_W + 100 || b.y < -100 || b.y > CANVAS_H + 100) {
    b.alive = false;
  }
}

function drawLightSaber(g, b, t) {
  const ang = Math.atan2(b.vy, b.vx);
  g.save();
  g.translate(b.x, b.y);
  g.rotate(ang);

  const halfLen = b.length / 2;

  // 外发光
  g.globalAlpha = 0.4;
  g.fillStyle = G3;
  g.fillRect(-halfLen, -b.r - 4, b.length, (b.r + 4) * 2);

  // 主体
  g.globalAlpha = 1;
  g.fillStyle = G3;
  g.fillRect(-halfLen, -b.r, b.length, b.r * 2);

  // 内芯
  g.fillStyle = G0;
  g.fillRect(-halfLen, -1, b.length, 2);

  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   第 3N 章 · 黑洞
   ══════════════════════════════════════════════════════════════ */

function updateBlackHole(b, dt, soul) {
  // 吸引玩家
  const dx = b.x - soul.x;
  const dy = b.y - soul.y;
  const d = Math.hypot(dx, dy);
  if (d < b.pullRadius) {
    const force = (1 - d / b.pullRadius) * b.pullStrength;
    const nd = d || 1;
    soul.x += (dx / nd) * force * dt;
    soul.y += (dy / nd) * force * dt;
  }

  // 吸引附近弹幕
  for (const other of bullets) {
    if (!other.alive || other === b) continue;
    if (other.type === BulletTypeExt.BLACK_HOLE) continue;
    const odx = b.x - other.x;
    const ody = b.y - other.y;
    const od = Math.hypot(odx, ody);
    if (od < b.pullRadius && od > 1) {
      other.vx += (odx / od) * 200 * dt;
      other.vy += (ody / od) * 200 * dt;
    }
  }

  // 命中判定
  if (!b.sfxFired) {
    const dd = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (dd < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  // 生命周期
  if (b.age > b.maxLife) {
    // 爆炸
    FX.explosion(b.x, b.y, 80, G3);
    FX.triggerShake(15);
    b.alive = false;
  }
}

function drawBlackHole(g, b, t) {
  const pulse = 0.9 + 0.15 * Math.sin(t * 4);

  // 外光晕（吸引圈）
  const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.pullRadius);
  grd.addColorStop(0, withAlpha(G0, 0.8));
  grd.addColorStop(0.4, withAlpha(G1, 0.3));
  grd.addColorStop(1, withAlpha(G0, 0));
  g.fillStyle = grd;
  g.fillRect(b.x - b.pullRadius, b.y - b.pullRadius, b.pullRadius * 2, b.pullRadius * 2);

  // 中心黑洞
  g.fillStyle = G0;
  g.beginPath();
  g.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
  g.fill();

  // 边缘光环
  g.strokeStyle = G3;
  g.lineWidth = 2;
  g.beginPath();
  g.arc(b.x, b.y, b.r * pulse + 3, 0, Math.PI * 2);
  g.stroke();

  // 旋转的粒子
  for (let i = 0; i < 6; i++) {
    const a = t * 3 + (i / 6) * Math.PI * 2;
    const r = b.r + 8 + Math.sin(t * 5 + i) * 3;
    g.fillStyle = G3;
    g.fillRect(b.x + Math.cos(a) * r - 1, b.y + Math.sin(a) * r - 1, 3, 3);
  }
}

/* ══════════════════════════════════════════════════════════════
   第 3O 章 · 镜面碎片
   ══════════════════════════════════════════════════════════════ */

function updateMirrorShard(b, dt, soul) {
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.rot += b.rotSpeed * dt;

  // 从战斗框边界反弹
  if (b.x - b.r < BOX_X) { b.x = BOX_X + b.r; b.vx = Math.abs(b.vx) * 0.9; }
  if (b.x + b.r > BOX_RIGHT) { b.x = BOX_RIGHT - b.r; b.vx = -Math.abs(b.vx) * 0.9; }
  if (b.y - b.r < BOX_Y) { b.y = BOX_Y + b.r; b.vy = Math.abs(b.vy) * 0.9; }
  if (b.y + b.r > BOX_BOTTOM) { b.y = BOX_BOTTOM - b.r; b.vy = -Math.abs(b.vy) * 0.9; }

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (b.age > b.maxLife) b.alive = false;
}

function drawMirrorShard(g, b, t) {
  g.save();
  g.translate(b.x, b.y);
  g.rotate(b.rot);

  const s = b.r;
  // 不规则多边形
  g.fillStyle = G3;
  g.beginPath();
  g.moveTo(-s, -s * 0.5);
  g.lineTo(s * 0.3, -s);
  g.lineTo(s, -s * 0.2);
  g.lineTo(s * 0.5, s);
  g.lineTo(-s * 0.5, s * 0.8);
  g.closePath();
  g.fill();

  // 内部反光
  g.fillStyle = G2;
  g.beginPath();
  g.moveTo(-s * 0.5, -s * 0.3);
  g.lineTo(s * 0.2, -s * 0.6);
  g.lineTo(s * 0.4, -s * 0.1);
  g.lineTo(-s * 0.3, s * 0.2);
  g.closePath();
  g.fill();

  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   第 3P 章 · 圣链
   ══════════════════════════════════════════════════════════════ */

function updateHolyChain(b, dt, soul) {
  // 链头追踪玩家
  if (b.age < b.chaseTime) {
    const dx = soul.x - b.x;
    const dy = soul.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    b.vx = lerp(b.vx, dx / d * b.speed, 4 * dt);
    b.vy = lerp(b.vy, dy / d * b.speed, 4 * dt);
  }

  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 链条节点跟随
  b.chain = b.chain || [];
  b.chain.unshift({ x: b.x, y: b.y });
  while (b.chain.length > b.maxChainLen) b.chain.pop();

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
      // 束缚效果（可选）
      if (soul.bindT == null) soul.bindT = 0;
      soul.bindT = Math.max(soul.bindT, 0.8);
    }
  }

  if (b.x < -60 || b.x > CANVAS_W + 60 || b.y < -60 || b.y > CANVAS_H + 60) {
    b.alive = false;
  }
}

function drawHolyChain(g, b, t) {
  if (!b.chain || b.chain.length === 0) return;

  // 链体
  for (let i = 0; i < b.chain.length; i++) {
    const p = b.chain[i];
    const alpha = 1 - i / b.chain.length;
    g.globalAlpha = alpha * 0.9;
    g.fillStyle = G3;
    // 链节交替
    if (i % 2 === 0) {
      g.fillRect(p.x - 2, p.y - 2, 4, 4);
    } else {
      g.fillRect(p.x - 3, p.y - 1, 6, 2);
    }
  }
  g.globalAlpha = 1;

  // 链头
  const head = b.chain[0];
  g.fillStyle = G3;
  g.beginPath();
  g.arc(head.x, head.y, b.r, 0, Math.PI * 2);
  g.fill();

  // 链头四芒星
  drawMiniStar(g, head.x, head.y, 3, Math.floor(t / 0.1) % 3, G0, 1);
}

/* ══════════════════════════════════════════════════════════════
   第 3Q 章 · 坠落花瓣
   ══════════════════════════════════════════════════════════════ */

function updateFallenPetal(b, dt, soul) {
  // 重力 + 横向摆动
  b.vy += 200 * dt;
  b.swayT = (b.swayT || 0) + dt;

  b.x += (b.vx + Math.sin(b.swayT * 3) * 20) * dt;
  b.y += b.vy * dt;
  b.rot += 2 * dt;

  if (!b.sfxFired) {
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < b.r + 7) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (b.y > CANVAS_H + 40) b.alive = false;
}

function drawFallenPetal(g, b, t) {
  g.save();
  g.translate(b.x, b.y);
  g.rotate(b.rot);

  const s = b.r;
  g.fillStyle = G3;
  g.beginPath();
  g.ellipse(0, 0, s, s * 0.5, 0, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = G0;
  g.beginPath();
  g.ellipse(0, 0, s * 0.7, s * 0.25, 0, 0, Math.PI * 2);
  g.fill();

  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   第 3R 章 · 符文雷
   ══════════════════════════════════════════════════════════════ */

function updateRuneMine(b, dt, soul) {
  // 静止在地面，脉动 1s 后爆炸
  b.pulseT = (b.pulseT || 0) + dt;
  const p = b.pulseT / b.fuse;

  if (p >= 1) {
    // 爆炸
    const R = b.explodeRadius;
    const d = Math.hypot(soul.x - b.x, soul.y - b.y);
    if (d < R && !b.sfxFired) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
    FX.explosion(b.x, b.y, R, G3);
    b.alive = false;
  }
}

function drawRuneMine(g, b, t) {
  const p = b.pulseT / b.fuse;
  const pulse = 0.5 + 0.5 * Math.sin(b.pulseT * 20);

  // 警戒圈
  g.globalAlpha = 0.3 + p * 0.5;
  g.strokeStyle = G3;
  g.lineWidth = 2;
  g.beginPath();
  g.arc(b.x, b.y, b.explodeRadius * (0.5 + p * 0.5), 0, Math.PI * 2);
  g.stroke();

  // 内核
  g.globalAlpha = 1;
  g.fillStyle = G3;
  const size = b.r + pulse * 2;
  g.fillRect(b.x - size, b.y - size, size * 2, size * 2);

  // 符文标记
  g.fillStyle = G0;
  drawMiniStar(g, b.x, b.y, size * 0.7, Math.floor(t / 0.08) % 3, G0, 1);
}

/* ══════════════════════════════════════════════════════════════
   第 3S 章 · 潮汐波
   ══════════════════════════════════════════════════════════════ */

function updateTidalWave(b, dt, soul) {
  // 从一侧向另一侧推进
  b.x += b.vx * dt;

  // 波浪形状判定：用当前 x 位置的垂直带
  if (!b.sfxFired) {
    if (Math.abs(soul.x - b.x) < 12) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (b.x < BOX_X - 40 || b.x > BOX_RIGHT + 40) b.alive = false;
}

function drawTidalWave(g, b, t) {
  const baseX = b.x;

  // 用多个波形柱模拟潮水
  for (let i = 0; i < 20; i++) {
    const y = BOX_Y + i * (BOX_H / 20);
    const offset = Math.sin(t * 5 + i * 0.4) * 4;
    const w = 10 + Math.sin(t * 4 + i * 0.3) * 3;

    g.globalAlpha = 0.7 - i * 0.02;
    g.fillStyle = G3;
    g.fillRect(baseX + offset - w / 2, y, w, BOX_H / 20 + 2);
  }
  g.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   第 3T 章 · 漩涡
   ══════════════════════════════════════════════════════════════ */

function updateVortex(b, dt, soul) {
  b.angle += b.angularSpeed * dt;
  b.radius += b.radialSpeed * dt;

  // 多个点构成漩涡
  b.points = b.points || [];
  if (b.points.length === 0) {
    const COUNT = 6;
    for (let i = 0; i < COUNT; i++) {
      b.points.push({
        angle: (i / COUNT) * Math.PI * 2,
        radius: 20 + i * 6
      });
    }
  }

  // 更新每个点
  for (const p of b.points) {
    p.angle += b.angularSpeed * dt;
    p.radius += b.radialSpeed * dt;
  }

  // 命中判定：所有点
  if (!b.sfxFired) {
    for (const p of b.points) {
      const px = b.x + Math.cos(p.angle) * p.radius;
      const py = b.y + Math.sin(p.angle) * p.radius;
      const d = Math.hypot(soul.x - px, soul.y - py);
      if (d < 6 + 7) {
        soul.damage(b.damage);
        b.sfxFired = true;
        break;
      }
    }
  }

  if (b.age > b.maxLife) b.alive = false;
}

function drawVortex(g, b, t) {
  if (!b.points) return;

  // 中心
  g.fillStyle = G3;
  g.beginPath();
  g.arc(b.x, b.y, 4, 0, Math.PI * 2);
  g.fill();

  // 每个点
  for (let i = 0; i < b.points.length; i++) {
    const p = b.points[i];
    const px = b.x + Math.cos(p.angle) * p.radius;
    const py = b.y + Math.sin(p.angle) * p.radius;

    // 连线到中心
    g.globalAlpha = 0.3;
    g.strokeStyle = G3;
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(b.x, b.y);
    g.lineTo(px, py);
    g.stroke();

    // 点
    g.globalAlpha = 1;
    g.fillStyle = G3;
    g.beginPath();
    g.arc(px, py, 5, 0, Math.PI * 2);
    g.fill();
  }

  g.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   第 3U 章 · 裁决线
   ══════════════════════════════════════════════════════════════ */

function updateJudgmentLine(b, dt, soul) {
  b.warnT += dt;

  // 预警阶段：闪烁
  if (b.warnT < b.warnDuration) {
    return;
  }

  // 攻击阶段：光带推进
  b.attackT += dt;
  const p = b.attackT / b.attackDur;

  if (!b.sfxFired) {
    // 判断玩家是否在光带范围内
    const dx = Math.abs(soul.x - b.x);
    if (dx < b.width / 2 && p > 0) {
      soul.damage(b.damage);
      b.sfxFired = true;
    }
  }

  if (p >= 1) b.alive = false;
}

function drawJudgmentLine(g, b, t) {
  if (b.warnT < b.warnDuration) {
    // 预警
    const blink = Math.floor(b.warnT * 20) % 2;
    if (blink) {
      g.globalAlpha = 0.5;
      g.fillStyle = G3;
      g.fillRect(b.x - b.width / 2, BOX_Y, b.width, BOX_H);
      g.globalAlpha = 1;
    }
  } else {
    // 攻击：全屏闪烁
    const p = b.attackT / b.attackDur;
    const alpha = 1 - p * 0.5;
    g.globalAlpha = alpha;
    g.fillStyle = G3;
    g.fillRect(b.x - b.width / 2, BOX_Y, b.width, BOX_H);
    g.globalAlpha = 1;

    // 边缘火花
    for (let i = 0; i < 4; i++) {
      const fx = b.x - b.width / 2 + Math.random() * b.width;
      const fy = BOX_Y + Math.random() * BOX_H;
      spawnParticle({
        x: fx, y: fy,
        vx: (Math.random() - 0.5) * 100,
        vy: -50 - Math.random() * 100,
        maxLife: 0.4,
        size: 2,
        color: G3,
        type: "block"
      });
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   第 3V 章 · 弹幕模式库（预置图案）
   ══════════════════════════════════════════════════════════════
   20+ 种预置弹幕图案，直接调用即可。
   ══════════════════════════════════════════════════════════════ */

const PatternLibrary = {
  /**
   * 从左向右横排弹幕
   */
  wallFromLeft(y, count, spacing, speed, cfg) {
    cfg = cfg || {};
    for (let i = 0; i < count; i++) {
      spawnBullet({
        type: BulletTypeExt.BOUNCING_BALL,
        x: BOX_X - 20,
        y: y + i * spacing,
        vx: speed, vy: 0,
        r: cfg.size || 5,
        damage: cfg.damage || 4,
        maxLife: 4,
        color: cfg.color || G3,
        alpha: 1
      });
    }
  },

  /**
   * 从上向下竖排弹幕
   */
  wallFromTop(x, count, spacing, speed, cfg) {
    cfg = cfg || {};
    for (let i = 0; i < count; i++) {
      spawnBullet({
        type: BulletTypeExt.BOUNCING_BALL,
        x: x + i * spacing,
        y: BOX_Y - 20,
        vx: 0, vy: speed,
        r: cfg.size || 5,
        damage: cfg.damage || 4,
        maxLife: 4,
        color: cfg.color || G3,
        alpha: 1
      });
    }
  },

  /**
   * 环形阵列
   */
  ringArray(cx, cy, count, radius, speed, cfg) {
    spawnRingArray(cx, cy, count, radius, speed, cfg);
  },

  /**
   * 螺旋扩散
   */
  spiralOut(cx, cy, count, speed, cfg) {
    cfg = cfg || {};
    for (let i = 0; i < count; i++) {

/* ══════════════════════════════════════════════════════════════
   第 3W 章 · 时间轴编排器
   ══════════════════════════════════════════════════════════════
   可视化编排弹幕。
   - 每个 Track 是一条时间线
   - 每个 Action 是某个时间点触发的事件
   ══════════════════════════════════════════════════════════════ */

class Timeline {
  constructor() {
    this.tracks = new Map();
    this.cursor = 0;
    this.playing = false;
    this.duration = 0;
    this.loop = false;
  }

  /**
   * 添加轨道
   */
  addTrack(name) {
    if (!this.tracks.has(name)) {
      this.tracks.set(name, []);
    }
    return name;
  }

  /**
   * 添加动作到轨道
   */
  add(trackName, time, action, data) {
    if (!this.tracks.has(trackName)) {
      this.addTrack(trackName);
    }
    const actionObj = {
      time,
      action,
      data: data || {},
      fired: false
    };
    this.tracks.get(trackName).push(actionObj);
    // 按时间排序
    this.tracks.get(trackName).sort((a, b) => a.time - b.time);
    if (time > this.duration) this.duration = time;
    return actionObj;
  }

  /**
   * 播放
   */
  play() {
    this.playing = true;
    this.cursor = 0;
    this._resetFired();
  }

  /**
   * 暂停
   */
  pause() {
    this.playing = false;
  }

  /**
   * 停止
   */
  stop() {
    this.playing = false;
    this.cursor = 0;
    this._resetFired();
  }

  /**
   * 更新
   */
  update(dt) {
    if (!this.playing) return;
    this.cursor += dt;

    for (const [trackName, actions] of this.tracks) {
      for (const a of actions) {
        if (!a.fired && this.cursor >= a.time) {
          a.fired = true;
          try {
            a.action(a.data);
          } catch (e) {
            Log.error("Timeline action error:", e);
          }
        }
      }
    }

    if (this.cursor >= this.duration) {
      if (this.loop) {
        this.cursor = 0;
        this._resetFired();
      } else {
        this.playing = false;
      }
    }
  }

  /**
   * 重置所有动作
   */
  _resetFired() {
    for (const actions of this.tracks.values()) {
      for (const a of actions) a.fired = false;
    }
  }

  /**
   * 清空
   */
  clear() {
    this.tracks.clear();
    this.cursor = 0;
    this.duration = 0;
    this.playing = false;
  }
}

/* ══════════════════════════════════════════════════════════════
   第 3X 章 · 弹幕预览工具
   ══════════════════════════════════════════════════════════════
   用于调试：可视化弹幕路径、判定范围、时间曲线。
   ══════════════════════════════════════════════════════════════ */

const BulletPreview = {
  enabled: false,
  drawHitboxes: false,
  drawPaths: false,
  drawVelocities: false,

  toggle() {
    this.enabled = !this.enabled;
  },

  /**
   * 绘制调试信息
   */
  draw(g) {
    if (!this.enabled) return;

    for (const b of bullets) {
      if (!b.alive) continue;

      // 判定范围
      if (this.drawHitboxes) {
        g.strokeStyle = "#00ff00";
        g.lineWidth = 1;
        g.beginPath();
        g.arc(b.x, b.y, b.r + 7, 0, Math.PI * 2);
        g.stroke();
      }

      // 速度向量
      if (this.drawVelocities && (b.vx || b.vy)) {
        g.strokeStyle = "#ff00ff";
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(b.x, b.y);
        g.lineTo(b.x + b.vx * 0.3, b.y + b.vy * 0.3);
        g.stroke();
      }

      // 显示类型和伤害
      g.fillStyle = "#ffffff";
      g.font = "8px monospace";
      g.fillText(b.type.substring(0, 4), b.x + 8, b.y - 8);
      g.fillText(String(b.damage), b.x + 8, b.y + 4);
    }
  }
};

const BulletStats = {
  totalSpawned: 0,
  totalAlive: 0,
  byType: {},

  reset() {
    this.totalSpawned = 0;
    this.totalAlive = 0;
    this.byType = {};
  },

  record(type) {
    this.totalSpawned++;
    this.byType[type] = (this.byType[type] || 0) + 1;
  },

    this.totalAlive = 0;
    for (const b of bullets) {
      if (b.alive) this.totalAlive++;
    }
  },

    lines.push("总生成: " + this.totalSpawned);

    lines.push("--- 按类型 ---");

/* ══════════════════════════════════════════════════════════════
   第 3Z 章 · 弹幕行为脚本 DSL
   ══════════════════════════════════════════════════════════════
   用简洁的脚本语法描述弹幕行为。
   ══════════════════════════════════════════════════════════════ */

class BulletScript {
  constructor() {
    this.actions = [];
    this.cursor = 0;
    this.totalT = 0;
    this.elapsed = 0;
  }

  /**
   * 等待
   */
  wait(duration) {
    this.actions.push({ type: "wait", duration });
    this.totalT += duration;
    return this;
  }

  /**
   * 执行
   */
  exec(fn) {
    this.actions.push({ type: "exec", fn });
    return this;
  }

  /**
   * 生成
   */
  spawn(cfg) {
    this.actions.push({ type: "spawn", cfg });
    return this;
  }

  /**
   * 重复
   */
  repeat(times, fn) {
    for (let i = 0; i < times; i++) fn(this, i);
    return this;
  }

  /**
   * 播放
   */
  play() {
    this.cursor = 0;
    this.elapsed = 0;
    this._runNext();
  }

  _runNext() {
    if (this.cursor >= this.actions.length) return;
    const a = this.actions[this.cursor];

    if (a.type === "wait") {
      Timers.setTimeout(a.duration, () => {
        this.cursor++;
        this._runNext();
      });
    } else if (a.type === "exec") {
      try {
        a.fn();
      } catch (e) {
        Log.error(e);
      }
      this.cursor++;
      this._runNext();
    } else if (a.type === "spawn") {
      spawnBullet(a.cfg);
      this.cursor++;
      this._runNext();
    } else {
      this.cursor++;
      this._runNext();
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   第 53 章 · 打字机系统
   ══════════════════════════════════════════════════════════════
   逐字符显示文本。
   - 支持速度控制
   - 支持自动换行
   - 支持跳过（立即显示全部）
   - 支持完成回调
   ══════════════════════════════════════════════════════════════ */

class Typewriter {
  constructor() {
    this.fullText = "";
    this.displayedText = "";
    this.charsShown = 0;
    this.speed = 42;            // 每秒显示字符数
    this.delayTimer = 0;
    this.typing = false;
    this.completed = false;
    this.onComplete = null;
    this.onChar = null;
    // 特殊标记
    this.pauseMarks = [];        // { index, duration }
    this.curPause = 0;
    this.curPauseRemain = 0;
  }

  /**
   * 启动打字
   */
  start(text, speed) {
    this.fullText = text || "";
    this.displayedText = "";
    this.charsShown = 0;
    this.speed = speed || 42;
    this.typing = true;
    this.completed = false;
    this.curPause = 0;
    this.curPauseRemain = 0;
    this.delayTimer = 0;

    // 解析特殊标记：{p:N} 表示在此处停顿 N 秒
    this.pauseMarks = [];
    const regex = /\{p:([\d.]+)\}/g;
    let match;
    while ((match = regex.exec(text)) !== null) {
      this.pauseMarks.push({
        index: match.index,
        duration: parseFloat(match[1])
      });
    }
    // 移除标记
    this.fullText = text.replace(regex, "");
  }

  /**
   * 立即完成
   */
  skip() {
    if (!this.typing) return;
    this.charsShown = this.fullText.length;
    this.displayedText = this.fullText;
    this.typing = false;
    this.completed = true;
    if (this.onComplete) this.onComplete();
  }

  /**
   * 更新
   */
  update(dt) {
    if (!this.typing) return;

    // 处理停顿
    if (this.curPauseRemain > 0) {
      this.curPauseRemain -= dt;
      return;
    }

    this.delayTimer += dt;
    const perChar = 1 / this.speed;
    while (this.delayTimer >= perChar && this.charsShown < this.fullText.length) {
      this.delayTimer -= perChar;
      this.charsShown++;

      // 检查是否到达停顿标记
      const nextPause = this.pauseMarks.find(p => p.index === this.charsShown);
      if (nextPause) {
        this.curPauseRemain = nextPause.duration;
        this.delayTimer = 0;
      }

      if (this.onChar) {
        this.onChar(this.fullText[this.charsShown - 1], this.charsShown);
      }
    }

    this.displayedText = this.fullText.substring(0, this.charsShown);

    if (this.charsShown >= this.fullText.length && this.curPauseRemain <= 0) {
      this.typing = false;
      this.completed = true;
      if (this.onComplete) this.onComplete();
    }
  }

  /**
   * 获取显示文本
   */
  getDisplay() {
    return this.displayedText;
  }

  /**
   * 是否正在打字
   */
  isTyping() {
    return this.typing;
  }

  /**
   * 是否已完成
   */
  isComplete() {
    return this.completed;
  }
}

/* ══════════════════════════════════════════════════════════════
   第 54 章 · 文本换行工具
   ══════════════════════════════════════════════════════════════
   按照像素宽度把文字拆成多行。
   支持中英文混排。
   ══════════════════════════════════════════════════════════════ */

const TextWrap = {
  /**
   * 按像素宽度换行
   * @param {CanvasRenderingContext2D} g
   * @param {string} text
   * @param {number} maxWidth
   * @param {string} font
   * @returns {string[]} 行数组
   */
  wrap(g, text, maxWidth, font) {
    if (font) g.font = font;

    const paragraphs = text.split("\n");
    const result = [];

    for (const para of paragraphs) {
      if (para.length === 0) {
        result.push("");
        continue;
      }

      let currentLine = "";
      for (let i = 0; i < para.length; i++) {
        const ch = para[i];
        const testLine = currentLine + ch;
        const w = g.measureText(testLine).width;

        if (w > maxWidth && currentLine.length > 0) {
          result.push(currentLine);
          currentLine = ch;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine.length > 0) {
        result.push(currentLine);
      }
    }

    return result;
  },

  /**
   * 按字符数换行
   */
  wrapChars(text, charsPerLine) {
    const result = [];
    const paragraphs = text.split("\n");
    for (const para of paragraphs) {
      if (para.length === 0) {
        result.push("");
        continue;
      }
      for (let i = 0; i < para.length; i += charsPerLine) {
        result.push(para.substring(i, i + charsPerLine));
      }
    }
    return result;
  },

  /**
   * 测量文本宽度
   */
  measure(g, text, font) {
    if (font) g.font = font;
    return g.measureText(text).width;
  }
};

/* ══════════════════════════════════════════════════════════════
   第 55 章 · 旁白系统
   ══════════════════════════════════════════════════════════════
   在战斗框内显示以 * 开头的旁白文字。
   风格参考 Undertale。
   ══════════════════════════════════════════════════════════════ */

const NarratorBox = {
  /* 位置参数 */
  x: BOX_X,
  y: BOX_Y,
  w: BOX_W,
  h: BOX_H,
  padding: 14,

  /* 字体 */
  font: "16px 'Courier New', monospace",
  lineHeight: 22,
  fontSize: 14,

  /* 状态 */
  visible: false,
  text: "",
  lines: [],
  typewriter: null,
  onComplete: null,

  /* 淡入淡出 */
  fadeIn: 0,
  fadeOut: 0,
  alpha: 0,

  init() {
    this.typewriter = new Typewriter();
    this.typewriter.speed = 42;
  },

  /**
   * 显示旁白
   */
show: function(text, onAdvance) {
  this.text = text; this.visible = true;
  this.onAdvance = onAdvance || null;
  this.autoT = null; this.alpha = 1; this.__gen++;
  BM.cur = { x: DIALOG_FIXED.x, y: DIALOG_FIXED.y, w: DIALOG_FIXED.w, h: DIALOG_FIXED.h };
  BM.mode = "dialog";
  this.typewriter.start(text, 42);
},

  /**
   * 隐藏
   */
  hide() {
    this.visible = false;
    this.fadeOut = 1;
    this.fadeIn = 0;
  },

  /**
   * 立即完成打字
   */
  skip() {
    if (this.typewriter && this.typewriter.isTyping()) {
      this.typewriter.skip();
    }
  },

  /**
   * 是否正在打字
   */
  isTyping() {
    return this.typewriter && this.typewriter.isTyping();
  },

  /**
   * 是否已完成
   */
  isComplete() {
    return this.typewriter && this.typewriter.isComplete();
  },

  /**
   * 更新
   */
update: function(dt) {
  if (!this.visible) {
    if (this.alpha > 0) this.alpha = Math.max(0, this.alpha - dt * 4);
    if (this.typewriter) this.typewriter.update(dt);
    return;
  }
  this.typewriter.update(dt);
  if (this.onAdvance && !this.typewriter.isTyping() && this.typewriter.isComplete()) {
    if (this.autoT === null) this.autoT = 1.2;
    this.autoT -= dt;
    if (this.autoT <= 0) this.__advance();
  }
},

  /**
   * 绘制
   */
draw: function(g) {
  if (!this.visible && this.alpha <= 0) return;

  const R = BoxMorpher.cur;
  g.save();
  g.globalAlpha = this.alpha;

  g.font = this.font;
  g.textAlign = "left";
  g.textBaseline = "top";

  const maxW = R.w - this.padding * 2;
  const lines = TextWrap.wrap(g, this.typewriter.getDisplay(), maxW, this.font);
  const totalH = lines.length * this.lineHeight;
  let ty = R.y + Math.max(this.padding, (R.h - totalH) / 2);

  for (const line of lines) {
    g.fillStyle = G0;
    for (const [ox, oy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      g.fillText(line, R.x + this.padding + ox, ty + oy);
    }
    g.fillStyle = G3;
    g.fillText(line, R.x + this.padding, ty);
    ty += this.lineHeight;
  }

  g.restore();
},

  /**
   * 重置
   */
  reset() {
    this.visible = false;
    this.alpha = 0;
    this.fadeIn = 0;
    this.fadeOut = 0;
    this.text = "";
    this.lines = [];
    if (this.typewriter) {
      this.typewriter.start("", 42);
    }
  }
};

/* ══════════════════════════════════════════════════════════════
   第 56 章 · 选择栏系统
   ══════════════════════════════════════════════════════════════
   显示 FIGHT / ACT / ITEM / MERCY 四个选项。
   支持触摸 / 键盘选择。
   ══════════════════════════════════════════════════════════════ */

const ChoiceBar = {
  /* 位置 */
  x: BOX_X,
  y: BOX_Y + BOX_H + 10,
  w: BOX_W,
  h: 32,

  /* 选项 */
  options: ["FIGHT", "ACT", "ITEM", "MERCY"],
  optionWidth: 0,

  /* 状态 */
  visible: false,
  selected: 0,
  hovered: -1,
  alpha: 0,
  fadeIn: 0,
  fadeOut: 0,

  /* 回调 */
  onSelect: null,

  /* 计时 */
  selectT: 0,
  blinkT: 0,

  init() {
    this.optionWidth = this.w / this.options.length;
  },

  /**
   * 显示
   */
  show(onSelect) {
    this.visible = true;
    this.selected = 0;
    this.hovered = -1;
    this.alpha = 0;
    this.fadeIn = 1;
    this.fadeOut = 0;
    this.onSelect = onSelect || null;
    this.selectT = 0;
  },

  /**
   * 隐藏
   */
  hide() {
    this.visible = false;
    this.fadeOut = 1;
    this.fadeIn = 0;
  },

  /**
   * 选中
   */
  confirm() {
    if (!this.visible) return;
    const value = this.options[this.selected];
    this.hide();
    if (this.onSelect) {
      this.onSelect(value, this.selected);
    }
  },

  /**
   * 左移
   */
moveLeft: function() { this.selected = 0; this.blinkT = 0.15; },

  /**
   * 右移
   */
moveRight: function() { this.selected = 1; this.blinkT = 0.15; },

  /**
   * 更新
   */
  update(dt) {
    if (!this.visible) {
      if (this.alpha > 0) {
        this.alpha = Math.max(0, this.alpha - dt * 4);
      }
      return;
    }

    if (this.fadeIn > 0) {
      this.fadeIn -= dt * 4;
      this.alpha = Math.min(1, this.alpha + dt * 4);
    }

    this.selectT += dt;
    if (this.blinkT > 0) this.blinkT -= dt;
  },

  /**
   * 处理点击
   */
handleClick: function(cx, cy) {
  if (!this.visible) return false;
  const hit = (r) => cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
  if (hit(CHOICE_L)) {
    if (this.selected === 0) this.confirm();
    else { this.selected = 0; this.blinkT = 0.15; }
    return true;
  }
  if (hit(CHOICE_R)) {
    if (this.selected === 1) this.confirm();
    else { this.selected = 1; this.blinkT = 0.15; }
    return true;
  }
  return false;
},

  /**
   * 处理悬停
   */
handleHover: function(cx, cy) {
  if (!this.visible) { this.hovered = -1; return; }
  const hit = (r) => cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
  this.hovered = hit(CHOICE_L) ? 0 : hit(CHOICE_R) ? 1 : -1;
},

  /**
   * 绘制
   */
draw: function(g) {
  if (!this.visible && this.alpha <= 0) return;
  g.save();
  g.globalAlpha = Math.max(this.alpha, this.visible ? 1 : 0);
  g.font = "bold 15px 'Courier New', monospace";
  g.textAlign = "center";
  g.textBaseline = "middle";
  const rects = [CHOICE_L, CHOICE_R];
  for (let i = 0; i < 2; i++) {
    const r = rects[i];
    const active = (i === this.selected);
    if (active) {
      g.fillStyle = G3;
      g.fillRect(r.x, r.y, r.w, r.h);
      g.fillStyle = G0;
    } else {
      g.strokeStyle = G3;
      g.lineWidth = 2;
      g.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      g.fillStyle = G3;
    }
    g.fillText(this.options[i], r.x + r.w / 2, r.y + r.h / 2 + 1);
  }
  g.restore();
},

  /**
   * 重置
   */
  reset() {
    this.visible = false;
    this.alpha = 0;
    this.fadeIn = 0;
    this.fadeOut = 0;
    this.selected = 0;
    this.hovered = -1;
  }
};

/* ══════════════════════════════════════════════════════════════
   第 57 章 · 攻击条系统（UT 同款）
   ══════════════════════════════════════════════════════════════
   一条水平白线从左到右扫过，中央有命中区。
   玩家点击屏幕时停住指针，根据位置计算伤害。
   伤害 50-300。
   ══════════════════════════════════════════════════════════════ */

const AttackBar = {
  /* 位置 */
  x: BOX_X,
  y: BOX_Y + BOX_H / 2 - 2,
  w: BOX_W,
  h: 4,

  /* 指针 */
  pointerX: 0,
  pointerSpeed: 1.4,          // 屏幕每秒走多少倍宽度
  pointerDir: 1,              // 1 向右，-1 向左

  /* 命中区 */
  hitCenter: BOX_X + BOX_W / 2,
  hitWidth: 12,               // 中心区总宽度
  goodWidth: 24,              // 良好区总宽度
  okayWidth: 40,              // 一般区总宽度

  /* 状态 */
  visible: false,
  active: false,
  result: null,               // 'miss' | 'okay' | 'good' | 'perfect'
  damage: 0,
  alpha: 0,
  fadeIn: 0,

  /* 计时 */
  elapsed: 0,

  /* 回调 */
  onComplete: null,

  /**
   * 显示
   */
  show(onComplete) {
    this.visible = true;
    this.active = true;
    this.pointerX = this.x;
    this.pointerDir = 1;
    this.result = null;
    this.damage = 0;
    this.alpha = 0;
    this.fadeIn = 1;
    this.elapsed = 0;
    this.onComplete = onComplete || null;
  },

  /**
   * 玩家点击
   */
  click() {
    if (!this.active) return;
    this.active = false;

    // 计算距离中心的距离
    const dist = Math.abs(this.pointerX - this.hitCenter);
    const halfHit = this.hitWidth / 2;
    const halfGood = this.goodWidth / 2;
    const halfOkay = this.okayWidth / 2;

    // 根据距离判定等级
    if (dist < halfHit) {
      this.result = "perfect";
      this.damage = 300;
      FX.triggerShake(10);
      FX.triggerFlash(0.12);
    } else if (dist < halfGood) {
      this.result = "good";
      this.damage = 200;
      FX.triggerShake(6);
      FX.triggerFlash(0.08);
    } else if (dist < halfOkay) {
      this.result = "okay";
      this.damage = 120;
      FX.triggerShake(3);
    } else {
      this.result = "miss";
      this.damage = 50;
    }

    // 1s 后回调
    Timers.setTimeout(0.8, () => {
      this.hide();
      if (this.onComplete) {
        this.onComplete(this.result, this.damage);
      }
    });
  },

  /**
   * 自动完成（超时）
   */
  autoComplete() {
    if (!this.active) return;
    this.active = false;
    this.result = "miss";
    this.damage = 0;
    Timers.setTimeout(0.6, () => {
      this.hide();
      if (this.onComplete) {
        this.onComplete("miss", 0);
      }
    });
  },

  /**
   * 隐藏
   */
  hide() {
    this.visible = false;
    this.alpha = 0;
  },

  /**
   * 更新
   */
update: function(dt) {
  if (!this.visible) return;

  if (this.fadeIn > 0) {
    this.fadeIn -= dt * 4;
    this.alpha = Math.min(1, this.alpha + dt * 4);
  }

  /* 逐帧锚定框体（含变形中） */
  const R = BoxMorpher.cur;
  this.x = R.x;
  this.y = R.y + 14;
  this.w = R.w;
  this.hitCenter = R.x + R.w / 2;

  if (this.active) {
    this.elapsed += dt;
    this.pointerX += this.pointerSpeed * this.w * this.pointerDir * dt;
    if (this.pointerX > this.x + this.w) {
      this.pointerX = this.x + this.w;
      this.pointerDir = -1;
    } else if (this.pointerX < this.x) {
      this.pointerX = this.x;
      this.pointerDir = 1;
    }
    if (this.elapsed > 4) {
      this.autoComplete();
    }
  }
},

  /**
   * 绘制
   */
draw: function(g) {
  if (!this.visible) return;

  g.save();
  g.globalAlpha = this.alpha;

  g.fillStyle = G3;
  g.fillRect(this.x, this.y - 2, this.w, this.h + 4);
  g.fillStyle = G0;
  g.fillRect(this.x + 2, this.y, this.w - 4, this.h);

  if (this.active || this.result) {
    g.fillStyle = G1;
    g.fillRect(this.hitCenter - this.okayWidth / 2, this.y, this.okayWidth, this.h);
    g.fillStyle = G2;
    g.fillRect(this.hitCenter - this.goodWidth / 2, this.y, this.goodWidth, this.h);
    g.fillStyle = G3;
    g.fillRect(this.hitCenter - this.hitWidth / 2, this.y, this.hitWidth, this.h);
  }

  /* 扫针： 白底黑芯双层（在白色完美区上也清晰可辨） */
  if (this.active) {
    const px = Math.round(this.pointerX);
    /* 白色外底 */
    g.fillStyle = G3;
    g.fillRect(px - 3, this.y - 7, 6, this.h + 14);
    /* 黑色芯 */
    g.fillStyle = G0;
    g.fillRect(px - 1, this.y - 7, 2, this.h + 14);
    /* 顶部箭头（白底黑芯） */
    g.fillStyle = G3;
    g.beginPath();
    g.moveTo(px - 6, this.y - 7);
    g.lineTo(px + 6, this.y - 7);
    g.lineTo(px, this.y - 14);
    g.closePath();
    g.fill();
    g.fillStyle = G0;
    g.beginPath();
    g.moveTo(px - 3, this.y - 7);
    g.lineTo(px + 3, this.y - 7);
    g.lineTo(px, this.y - 11);
    g.closePath();
    g.fill();
  }

  if (this.result && !this.active) {
    const resultText = {
      perfect: "PERFECT!",
      good: "GOOD!",
      okay: "OK",
      miss: "MISS..."
    }[this.result];
    g.font = "bold 16px 'Courier New', monospace";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillStyle = G0;
    g.fillText(resultText, this.x + this.w / 2 + 1, this.y + 26 + 1);
    g.fillStyle = G3;
    g.fillText(resultText, this.x + this.w / 2, this.y + 26);
  }

  g.restore();
},

  /**
   * 重置
   */
  reset() {
    this.visible = false;
    this.active = false;
    this.alpha = 0;
    this.fadeIn = 0;
    this.result = null;
    this.damage = 0;
  }
};

/* ══════════════════════════════════════════════════════════════
   第 58 章 · 伤害数字浮动
   ══════════════════════════════════════════════════════════════
   攻击命中后在目标位置弹出伤害数值并向上飘。
   ══════════════════════════════════════════════════════════════ */

const DamageNumber = {
  pool: [],
  maxCount: 32,

  /**
   * 生成
   */
  spawn(x, y, value, type) {
    // type: 'normal' | 'crit' | 'miss'
    const item = {
      x, y,
      value,
      type: type || "normal",
      age: 0,
      maxAge: 1.2,
      vy: -60,
      vx: (Math.random() - 0.5) * 40,
      alive: true
    };
    this.pool.push(item);
    if (this.pool.length > this.maxCount) {
      this.pool.shift();
    }
  },

  /**
   * 更新
   */
  update(dt) {
    for (let i = this.pool.length - 1; i >= 0; i--) {
      const d = this.pool[i];
      d.age += dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 80 * dt;   // 重力
      if (d.age >= d.maxAge) {
        this.pool.splice(i, 1);
      }
    }
  },

  /**
   * 绘制
   */
  draw(g) {
    for (const d of this.pool) {
      const t = d.age / d.maxAge;
      const alpha = t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8;
      const scale = t < 0.15 ? t / 0.15 * 1.2 : 1;

      g.save();
      g.globalAlpha = alpha;

      let fontSize = 20;
      let color = G3;

      if (d.type === "crit") {
        fontSize = 28;
        color = G3;
      } else if (d.type === "miss") {
        fontSize = 16;
        color = G1;
      }

      fontSize *= scale;
      g.font = `bold ${Math.round(fontSize)}px 'Courier New', monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";

      const text = d.type === "miss" ? "MISS" : String(d.value);

      // 描边
      g.fillStyle = G0;
      g.fillText(text, d.x + 2, d.y + 2);
      g.fillText(text, d.x - 2, d.y + 2);
      g.fillText(text, d.x + 2, d.y - 2);
      g.fillText(text, d.x - 2, d.y - 2);

      // 正文
      g.fillStyle = color;
      g.fillText(text, d.x, d.y);

      g.restore();
    }
  },

  /**
   * 清空
   */
  clear() {
    this.pool = [];
  }
};

/* ══════════════════════════════════════════════════════════════
   第 59 章 · 前辈受击效果
   ══════════════════════════════════════════════════════════════
   攻击命中前辈时：
   - 前辈抖动
   - 白闪
   - 击中处爆发粒子
   - 弹出伤害数字
   ══════════════════════════════════════════════════════════════ */

const ElderHitEffect = {
  /**
   * 触发
   */
  trigger(damage, type) {
    // 前辈抖动
    Elder.triggerHit(damage);

    // 屏幕震动
    if (type === "perfect") {
      FX.triggerShake(14);
      FX.triggerFlash(0.15);
      FX.triggerFreeze(0.05);
    } else if (type === "good") {
      FX.triggerShake(8);
      FX.triggerFlash(0.1);
    } else if (type === "okay") {
      FX.triggerShake(4);
    } else {
      FX.triggerShake(2);
    }

    // 命中位置：前辈胸口核心
    const hx = BOSS_X + (Math.random() - 0.5) * 40;
    const hy = BOSS_Y + (Math.random() - 0.5) * 30;

    // 伤害数字
    const numType = type === "perfect" ? "crit" : (type === "miss" ? "miss" : "normal");
    DamageNumber.spawn(hx, hy - 30, damage, numType);

    // 粒子爆发
    if (type !== "miss") {
      burstParticles(hx, hy, type === "perfect" ? 24 : 14, {
        speed: type === "perfect" ? 200 : 140,
        maxLife: 0.7,
        size: type === "perfect" ? 4 : 3,
        color: G3,
        gravity: 150,
        type: "star"
      });

      // 冲击波
      spawnShockwave({
        x: hx, y: hy,
        r0: 10, maxR: type === "perfect" ? 80 : 50,
        maxLife: 0.5,
        color: G3,
        width: 3
      });

      // 四芒星碎片
      for (let i = 0; i < (type === "perfect" ? 12 : 6); i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 100 + Math.random() * 200;
        spawnParticle({
          x: hx, y: hy,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          maxLife: 0.8,
          size: 4,
          color: G3,
          gravity: 120,
          type: "star"
