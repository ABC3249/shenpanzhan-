<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000">
<title>圣光的机械 · The Mechanical Halo</title>
<style>
/* ══════════════════════════════════════════════════════════════
   全局重置
   ══════════════════════════════════════════════════════════════ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000000;
  color: #ffffff;
  font-family: "Courier New", Consolas, Menlo, Monaco, monospace;
  font-smooth: never;
  -webkit-font-smoothing: none;
  touch-action: none;
  overscroll-behavior: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* ══════════════════════════════════════════════════════════════
   像素画布
   ══════════════════════════════════════════════════════════════ */
#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  background: #000000;
  touch-action: none;
  outline: none;
  border: none;
  will-change: transform;
}

/* ══════════════════════════════════════════════════════════════
   横屏提示
   ══════════════════════════════════════════════════════════════ */
#rotate-hint {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  background: #000000;
  color: #ffffff;
  text-align: center;
  padding: 24px;
  pointer-events: none;
}

#rotate-hint.show {
  display: flex;
}

#rotate-hint .inner {
  font-size: 16px;
  letter-spacing: 3px;
  line-height: 2.2;
  font-family: "Courier New", monospace;
}

#rotate-hint .icon {
  display: inline-block;
  font-size: 44px;
  margin-bottom: 16px;
  animation: rotate-swing 2.4s ease-in-out infinite;
}

#rotate-hint .sub {
  font-size: 11px;
  color: #888888;
  letter-spacing: 2px;
  margin-top: 12px;
}

@keyframes rotate-swing {
  0%, 30% {
    transform: rotate(0deg);
  }
  65%, 100% {
    transform: rotate(90deg);
  }
}

/* ══════════════════════════════════════════════════════════════
   加载画面
   ══════════════════════════════════════════════════════════════ */
#loading {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000000;
  color: #ffffff;
  padding: 40px 60px;
  text-align: center;
}

#loading.show {
  display: flex;
}

#loading .title {
  font-size: 22px;
  letter-spacing: 12px;
  margin-bottom: 8px;
  color: #ffffff;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
}

#loading .subtitle {
  font-size: 10px;
  letter-spacing: 5px;
  color: #888888;
  margin-bottom: 42px;
}

#loading .bar-wrap {
  width: min(340px, 72vw);
  height: 14px;
  border: 2px solid #ffffff;
  padding: 2px;
  position: relative;
}

#loading .bar-fill {
  height: 100%;
  width: 0%;
  background: #ffffff;
  transition: width 0.08s linear;
}

#loading .bar-text {
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #aaaaaa;
}

#loading .hint {
  margin-top: 32px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #555555;
}

#loading .spinner {
  width: 24px;
  height: 24px;
  border: 2px solid #333333;
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ══════════════════════════════════════════════════════════════
   启动画面
   ══════════════════════════════════════════════════════════════ */
#start-screen {
  position: fixed;
  inset: 0;
  z-index: 9997;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000000;
  color: #ffffff;
  cursor: pointer;
  padding: 32px;
  text-align: center;
}

#start-screen.hide {
  display: none;
}

#start-screen .halo {
  font-size: 26px;
  letter-spacing: 10px;
  margin-bottom: 20px;
  color: #ffffff;
  text-shadow:
    0 0 18px rgba(255, 255, 255, 0.7),
    0 0 36px rgba(255, 255, 255, 0.3);
  animation: halo-pulse 3.6s ease-in-out infinite;
}

@keyframes halo-pulse {
  0%, 100% {
    opacity: 0.55;
    text-shadow:
      0 0 12px rgba(255, 255, 255, 0.4),
      0 0 24px rgba(255, 255, 255, 0.15);
  }
  50% {
    opacity: 1;
    text-shadow:
      0 0 28px rgba(255, 255, 255, 0.9),
      0 0 56px rgba(255, 255, 255, 0.4);
  }
}

#start-screen .title {
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 700;
  letter-spacing: 0.3em;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.5), 3px 3px 0 rgba(0, 0, 0, 0.8);
}

#start-screen .subtitle {
  font-size: 11px;
  letter-spacing: 0.45em;
  color: #888888;
  text-transform: uppercase;
  margin-bottom: 40px;
}

#start-screen .ornament {
  font-size: 14px;
  letter-spacing: 8px;
  color: #555555;
  margin: 18px 0;
}

#start-screen .desc {
  font-size: 12px;
  line-height: 2.2;
  color: #aaaaaa;
  max-width: 460px;
  letter-spacing: 1px;
}

#start-screen .desc em {
  color: #ffffff;
  font-style: normal;
}

#start-screen .prompt {
  margin-top: 44px;
  font-size: 12px;
  letter-spacing: 6px;
  color: #ffffff;
  animation: prompt-blink 2s ease-in-out infinite;
}

@keyframes prompt-blink {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}

#start-screen .warn {
  position: absolute;
  bottom: 20px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #555555;
  padding: 0 20px;
}

/* ══════════════════════════════════════════════════════════════
   隐藏 tooltip（开发用）
   ══════════════════════════════════════════════════════════════ */
#debug {
  position: fixed;
  top: 4px;
  left: 4px;
  z-index: 9996;
  font-size: 10px;
  color: #00ff00;
  background: rgba(0, 0, 0, 0.6);
  padding: 4px 8px;
  display: none;
  white-space: pre;
  font-family: monospace;
  pointer-events: none;
}

#debug.show {
  display: block;
}

/* ══════════════════════════════════════════════════════════════
   阻止 iOS 双击缩放
   ══════════════════════════════════════════════════════════════ */
@media (pointer: coarse) {
  * {
    -webkit-touch-callout: none;
  }
}

/* ══════════════════════════════════════════════════════════════
   防止触摸时出现选择框
   ══════════════════════════════════════════════════════════════ */
::selection {
  background: transparent;
  color: inherit;
}

::-moz-selection {
  background: transparent;
  color: inherit;
}

/* ══════════════════════════════════════════════════════════════
   滚动条隐藏
   ══════════════════════════════════════════════════════════════ */
::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

body {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
</style>
</head>
<body>

<!-- 横屏提示 -->
<div id="rotate-hint">
  <div class="inner">
    <div class="icon">📱</div>

<!-- 加载画面 -->
<div id="loading">
  <div class="spinner"></div>
  <div class="title">圣光的机械</div>

  <div class="bar-wrap">
    <div class="bar-fill" id="loading-bar"></div>
  </div>

</div>

<!-- 启动画面 -->
<div id="start-screen" class="hide">
  <div class="halo">◈ ✧ ◈ ✧ ◈</div>

  <div class="subtitle">The Mechanical Halo · Judgment</div>
  <div class="ornament">✦ ❖ ✦</div>
  <div class="desc">
    染污的圣徒，停下你的执念。<br>

    <em>亦夺回你的灵魂。</em>
  </div>

</div>

<!-- 游戏画布 -->
<canvas id="game" width="640" height="480"></canvas>

<!-- 调试面板 -->
<div id="debug"></div>

<script>
"use strict";

/* ╔════════════════════════════════════════════════════════════╗
   ║  圣光的机械 · The Mechanical Halo                          ║
   ║  Part 1 / 5 : 基础工具 + 音乐系统                          ║
   ╚════════════════════════════════════════════════════════════╝ */

/* ══════════════════════════════════════════════════════════════
   第 0 章 · 全局常量
   ══════════════════════════════════════════════════════════════ */

/** 画布逻辑宽度 */
const CANVAS_W = 640;

/** 画布逻辑高度 */
const CANVAS_H = 480;

/** 画布中心 X 坐标 */
const CENTER_X = CANVAS_W / 2;

/** 画布中心 Y 坐标 */
const CENTER_Y = CANVAS_H / 2;

/** 战斗框 X 坐标（左边缘） */
const BOX_X = 220;

/** 战斗框 Y 坐标（上边缘） */
const BOX_Y = 244;

/** 战斗框宽度 */
const BOX_W = 200;

/** 战斗框高度 */
const BOX_H = 200;

/** 战斗框中心 X 坐标 */
const BOX_CX = BOX_X + BOX_W / 2;

/** 战斗框中心 Y 坐标 */
const BOX_CY = BOX_Y + BOX_H / 2;

/** 战斗框右边缘 */
const BOX_RIGHT = BOX_X + BOX_W;

/** 战斗框下边缘 */
const BOX_BOTTOM = BOX_Y + BOX_H;

/** 前辈精灵中心 X 坐标 */
const BOSS_X = 320;

/** 前辈精灵中心 Y 坐标（本体中心） */
const BOSS_Y = 150;

/** 前辈精灵高度（6 倍放大后） */
const BOSS_H = 144;

/** 前辈精灵宽度（6 倍放大后） */
const BOSS_W = 120;

/** 前辈精灵顶部 Y 坐标 */
const BOSS_TOP = BOSS_Y - BOSS_H / 2;

/** 前辈精灵底部 Y 坐标 */
const BOSS_BOTTOM = BOSS_Y + BOSS_H / 2;

/** 前辈放大倍数 */
const BOSS_SCALE = 6;

/** 光环中心 Y 坐标 */
const HALO_CY = 60;

/** 光环半径 */
const HALO_R = 60;

/** 灵魂初始 X 坐标 */
const SOUL_START_X = BOX_CX;

/** 灵魂初始 Y 坐标 */
const SOUL_START_Y = BOX_CY;

/** 灵魂尺寸 */
const SOUL_SIZE = 16;

/** 灵魂碰撞半径 */
const SOUL_RADIUS = 7;

/** HP 条 X 坐标 */
const HP_BAR_X = 242;

/** HP 条 Y 坐标 */
const HP_BAR_Y = 466;

/** HP 条宽度 */
const HP_BAR_W = 200;

/** HP 条高度 */
const HP_BAR_H = 10;

/** 玩家最大 HP */
const PLAYER_MAX_HP = 60;

/** 玩家初始 HP */
const PLAYER_START_HP = 60;

/** 四档灰色阶 */
const G0 = "#000000";   // 描边 / 深凹 / 阴影
const G1 = "#555555";   // 暗部主体
const G2 = "#aaaaaa";   // 亮部主体
const G3 = "#ffffff";   // 高光 / 发光 / 核心

/* ══════════════════════════════════════════════════════════════
   第 1 章 · 数学工具
   ══════════════════════════════════════════════════════════════ */

/**
 * 将值限制在 [min, max] 范围内
 * @param {number} v 输入值
 * @param {number} min 最小值
 * @param {number} max 最大值
 * @returns {number} 限制后的值
 */
function clamp(v, min, max) {
  if (v < min) return min;
  if (v > max) return max;
  return v;
}

/**
 * 线性插值
 * @param {number} a 起点
 * @param {number} b 终点
 * @param {number} t 插值参数 [0, 1]
 * @returns {number} 插值结果
 */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/**
 * 反插值：求 v 在 [a, b] 中的归一化位置
 * @param {number} a 起点
 * @param {number} b 终点
 * @param {number} v 输入值
 * @returns {number} 归一化位置 [0, 1]（可能超出范围）
 */
function invLerp(a, b, v) {
  if (a === b) return 0;
  return (v - a) / (b - a);
}

/**
 * 反插值 + 限制
 */
function invLerpClamp(a, b, v) {
  return clamp(invLerp(a, b, v), 0, 1);
}

/**
 * 数值映射：把 v 从 [a1, b1] 映射到 [a2, b2]
 */
function mapRange(v, a1, b1, a2, b2) {
  const t = invLerp(a1, b1, v);
  return lerp(a2, b2, t);
}

/**
 * 平滑步进（Hermite 插值）
 * 在边缘处一阶导数为 0
 */
function smoothstep(t) {
  t = clamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

/**
 * 更平滑的步进（Quintic 插值）
 * 边缘处一阶、二阶导数都为 0
 */
function smootherstep(t) {
  t = clamp(t, 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
}

/**
 * 归约到 [0, 1)
 */
function fract(x) {
  return x - Math.floor(x);
}

/**
 * 角度归一化到 [0, 2π)
 */
function normalizeAngle(a) {
  const TWO_PI = Math.PI * 2;
  a = a % TWO_PI;
  if (a < 0) a += TWO_PI;
  return a;
}

/**
 * 最短角度差（从 a 到 b）
 */
function angleDiff(a, b) {
  const TWO_PI = Math.PI * 2;
  let d = (b - a) % TWO_PI;
  if (d > Math.PI) d -= TWO_PI;
  if (d < -Math.PI) d += TWO_PI;
  return d;
}

/* ══════════════════════════════════════════════════════════════
   第 2 章 · 随机数工具
   ══════════════════════════════════════════════════════════════ */

/**
 * 随机浮点数 [a, b)
 */
function rand(a, b) {
  return a + Math.random() * (b - a);
}

/**
 * 随机整数 [a, b]
 */
function randInt(a, b) {
  return Math.floor(a + Math.random() * (b - a + 1));
}

/**
 * 随机符号（-1 或 1）
 */
function randSign() {
  return Math.random() < 0.5 ? -1 : 1;
}

/**
 * 随机选择数组元素
 */
function randChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/**
 * 打乱数组（Fisher-Yates）
 */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i];
    arr[i] = arr[j];
    arr[j] = t;
  }
  return arr;
}

/**
 * 高斯随机数（Box-Muller）
 */
function randGauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/**
 * 确定性随机数生成器（Mulberry32）
 * @param {number} seed 种子
 * @returns {function(): number} 生成器，每次调用返回 [0, 1)
 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ══════════════════════════════════════════════════════════════
   第 3 章 · 缓动函数
   ══════════════════════════════════════════════════════════════ */

const Ease = {
  linear: t => t,

  // 二次
  quadIn: t => t * t,
  quadOut: t => t * (2 - t),
  quadInOut: t => (t < 0.5) ? 2 * t * t : -1 + (4 - 2 * t) * t,

  // 三次
  cubicIn: t => t * t * t,
  cubicOut: t => (--t) * t * t + 1,
  cubicInOut: t => (t < 0.5) ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1,

  // 四次
  quartIn: t => t * t * t * t,
  quartOut: t => 1 - (--t) * t * t * t,
  quartInOut: t => (t < 0.5) ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t,

  // 五次
  quintIn: t => t * t * t * t * t,
  quintOut: t => 1 + (--t) * t * t * t * t,
  quintInOut: t => (t < 0.5) ? 16 * t * t * t * t * t : 1 + 16 * (--t) * t * t * t * t,

  // 正弦
  sineIn: t => 1 - Math.cos(t * Math.PI / 2),
  sineOut: t => Math.sin(t * Math.PI / 2),
  sineInOut: t => -(Math.cos(Math.PI * t) - 1) / 2,

  // 指数
  expoIn: t => (t === 0) ? 0 : Math.pow(2, 10 * t - 10),
  expoOut: t => (t === 1) ? 1 : 1 - Math.pow(2, -10 * t),
  expoInOut: t => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return Math.pow(2, 20 * t - 10) / 2;
    return (2 - Math.pow(2, -20 * t + 10)) / 2;
  },

  // 圆形
  circIn: t => 1 - Math.sqrt(1 - Math.pow(t, 2)),
  circOut: t => Math.sqrt(1 - Math.pow(t - 1, 2)),
  circInOut: t => {
    if (t < 0.5) return (1 - Math.sqrt(1 - Math.pow(2 * t, 2))) / 2;
    return (Math.sqrt(1 - Math.pow(-2 * t + 2, 2)) + 1) / 2;
  },

  // 回弹
  backIn: t => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  backOut: t => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  backInOut: t => {
    const c1 = 1.70158;
    const c2 = c1 * 1.525;
    return (t < 0.5)
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // 弹跳
  bounceOut: t => {
    const n1 = 7.5625;
    const d1 = 2.75;
    if (t < 1 / d1) {
      return n1 * t * t;
    } else if (t < 2 / d1) {
      return n1 * (t -= 1.5 / d1) * t + 0.75;
    } else if (t < 2.5 / d1) {
      return n1 * (t -= 2.25 / d1) * t + 0.9375;
    } else {
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  },
  bounceIn: t => 1 - Ease.bounceOut(1 - t),
  bounceInOut: t => {
    return (t < 0.5)
      ? (1 - Ease.bounceOut(1 - 2 * t)) / 2
      : (1 + Ease.bounceOut(2 * t - 1)) / 2;
  },

  // 弹性
  elasticOut: t => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    const c4 = (2 * Math.PI) / 3;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
  elasticIn: t => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    const c4 = (2 * Math.PI) / 3;
    return -Math.pow(2, 10 * t - 10) * Math.sin((t * 10 - 10.75) * c4);
  },
  elasticInOut: t => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    const c5 = (2 * Math.PI) / 4.5;
    return (t < 0.5)
      ? -(Math.pow(2, 20 * t - 10) * Math.sin((20 * t - 11.125) * c5)) / 2
      : (Math.pow(2, -20 * t + 10) * Math.sin((20 * t - 11.125) * c5)) / 2 + 1;
  }
};

/* ══════════════════════════════════════════════════════════════
   第 4 章 · 颜色工具
   ══════════════════════════════════════════════════════════════ */

/**
 * 在四档灰之间做插值
 * @param {number} v 值 [0, 1]
 * @returns {string} 十六进制颜色
 */
function grayAt(v) {
  v = clamp(v, 0, 1);
  const c = Math.round(v * 255);
  const h = c.toString(16).padStart(2, "0");
  return "#" + h + h + h;
}

/**
 * 在 G0/G1/G2/G3 之间按 t 插值
 * t=0 → G0, t=1 → G3
 */
function grayLerp(t) {
  t = clamp(t, 0, 1);
  // 分三段：G0→G1, G1→G2, G2→G3
  if (t < 1 / 3) {
    const k = t * 3;
    return lerpColor(G0, G1, k);
  } else if (t < 2 / 3) {
    const k = (t - 1 / 3) * 3;
    return lerpColor(G1, G2, k);
  } else {
    const k = (t - 2 / 3) * 3;
    return lerpColor(G2, G3, k);
  }
}

/**
 * 两个十六进制颜色插值
 */
function lerpColor(c1, c2, t) {
  t = clamp(t, 0, 1);
  const r1 = parseInt(c1.substr(1, 2), 16);
  const g1 = parseInt(c1.substr(3, 2), 16);
  const b1 = parseInt(c1.substr(5, 2), 16);
  const r2 = parseInt(c2.substr(1, 2), 16);
  const g2 = parseInt(c2.substr(3, 2), 16);
  const b2 = parseInt(c2.substr(5, 2), 16);
  const r = Math.round(lerp(r1, r2, t));
  const g = Math.round(lerp(g1, g2, t));
  const b = Math.round(lerp(b1, b2, t));
  return "#" + r.toString(16).padStart(2, "0")
             + g.toString(16).padStart(2, "0")
             + b.toString(16).padStart(2, "0");
}

/**
 * 十六进制颜色 + alpha → rgba() 字符串
 */
function withAlpha(hex, a) {
  a = clamp(a, 0, 1);
  const r = parseInt(hex.substr(1, 2), 16);
  const g = parseInt(hex.substr(3, 2), 16);
  const b = parseInt(hex.substr(5, 2), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ══════════════════════════════════════════════════════════════
   第 5 章 · 向量工具
   ══════════════════════════════════════════════════════════════ */

class Vec2 {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }
  set(x, y) { this.x = x; this.y = y; return this; }
  copy(v) { this.x = v.x; this.y = v.y; return this; }
  clone() { return new Vec2(this.x, this.y); }
  add(v) { this.x += v.x; this.y += v.y; return this; }
  sub(v) { this.x -= v.x; this.y -= v.y; return this; }
  mul(s) { this.x *= s; this.y *= s; return this; }
  div(s) { if (s !== 0) { this.x /= s; this.y /= s; } return this; }
  len() { return Math.hypot(this.x, this.y); }
  lenSq() { return this.x * this.x + this.y * this.y; }
  norm() {
    const l = this.len();
    if (l > 0.0001) this.div(l);
    return this;
  }
  dot(v) { return this.x * v.x + this.y * v.y; }
  cross(v) { return this.x * v.y - this.y * v.x; }
  angle() { return Math.atan2(this.y, this.x); }
  dist(v) { return Math.hypot(v.x - this.x, v.y - this.y); }
  distSq(v) {
    const dx = v.x - this.x;
    const dy = v.y - this.y;
    return dx * dx + dy * dy;
  }
  rotate(a) {
    const c = Math.cos(a);
    const s = Math.sin(a);
    const nx = this.x * c - this.y * s;
    const ny = this.x * s + this.y * c;
    this.x = nx;
    this.y = ny;
    return this;
  }
  static fromAngle(a, len = 1) {
    return new Vec2(Math.cos(a) * len, Math.sin(a) * len);
  }
}

/**
 * 两点距离
 */
function dist2(ax, ay, bx, by) {
  return Math.hypot(bx - ax, by - ay);
}

/**
 * 两点距离平方
 */
function dist2Sq(ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  return dx * dx + dy * dy;
}

/**
 * 从 performance.now() 获取毫秒时间戳
 */
function now() {
  return performance.now();
}

/**
 * 秒级时间戳
 */
function nowSeconds() {
  return performance.now() / 1000;
}

/**
 * 延时（Promise 版本）
 */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/**
 * 帧率计数器
 */
class FpsCounter {
  constructor(windowSize = 60) {
    this.samples = new Float32Array(windowSize);
    this.idx = 0;
    this.filled = 0;
    this.lastT = 0;
    this.fps = 0;
  }
  tick() {
    const t = now();
    if (this.lastT === 0) {
      this.lastT = t;
      return;
    }
    const dt = t - this.lastT;
    this.lastT = t;
    this.samples[this.idx] = dt;
    this.idx = (this.idx + 1) % this.samples.length;
    if (this.filled < this.samples.length) this.filled++;
    let sum = 0;
    for (let i = 0; i < this.filled; i++) sum += this.samples[i];
    const avg = sum / Math.max(1, this.filled);
    this.fps = 1000 / Math.max(0.001, avg);
  }
}

/* ══════════════════════════════════════════════════════════════
   第 9 章 · 音乐基础数据结构
   ══════════════════════════════════════════════════════════════ */

/* ── 正弦查找表 ── */
const LUT_SIZE = 4096;
const SIN_LUT = new Float32Array(LUT_SIZE + 1);
for (let i = 0; i <= LUT_SIZE; i++) {
  SIN_LUT[i] = Math.sin(2 * Math.PI * i / LUT_SIZE);
}

/**
 * 从查找表取正弦值（带线性插值）
 * @param {number} phase 相位 [0, 1)
 * @returns {number} 正弦值 [-1, 1]
 */
function lutSin(phase) {
  // 归一化到 [0, 1)
  phase = phase - Math.floor(phase);
  const fi = phase * LUT_SIZE;
  const i0 = fi | 0;
  const frac = fi - i0;
  const a = SIN_LUT[i0];
  const b = SIN_LUT[i0 + 1];
  return a + (b - a) * frac;
}

/* ── 音名 → 频率 ── */
const PC = {
  C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3,
  E: 4, F: 5, "F#": 6, Gb: 6, G: 7,
  "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11
};

/**
 * 音名 → 频率
 * @param {string} name 音名，例如 "D4" / "Bb1"
 * @returns {number} 频率 Hz
 */
function nf(name) {
  const m = /^([A-G][#b]?)(-?\d+)$/.exec(name);
  if (!m) {
    Log.error("bad note name:", name);
    return 440;
  }
  const pitchClass = PC[m[1]];
  if (pitchClass === undefined) {
    Log.error("unknown pitch class:", m[1]);
    return 440;
  }
  const octave = parseInt(m[2], 10);
  const midi = (octave + 1) * 12 + pitchClass;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* ── 软削波（三次多项式） ── */
function softClip(x) {
  if (x > 3) return 1;
  if (x < -3) return -1;
  const x2 = x * x;
  return x * (27 + x2) / (27 + 9 * x2);
}

   ══════════════════════════════════════════════════════════════ */

/** 节拍 BPM */
const BPM = 138;

/** 每拍秒数 */
const SPB = 60 / BPM;

/** 每小节拍数 */
const BEATS_PER_BAR = 4;

/** 每小节秒数 */
const SEC_PER_BAR = SPB * BEATS_PER_BAR;

/** 每十六分音符秒数 */
const SEC_PER_TICK = SPB / 4;

/** 总小节数 */
const TOTAL_BARS = 40;

/** 总拍数 */
const TOTAL_BEATS = TOTAL_BARS * BEATS_PER_BAR;

/** 总时长（秒） */
const TOTAL_DURATION = TOTAL_BEATS * SPB;

/** 每小节十六分音符数 */
const TICKS_PER_BAR = 16;

/** 总十六分音符数 */
const TOTAL_TICKS = TOTAL_BARS * TICKS_PER_BAR;

/** 循环起始小节（第 5 小节起） */
const LOOP_START_BAR = 5;

/** 循环起始拍 */
const LOOP_START_BEAT = LOOP_START_BAR * BEATS_PER_BAR;

/** 循环起始秒数 */
const LOOP_START_TIME = LOOP_START_BEAT * SPB;

/** 循环起始十六分音符 */
const LOOP_START_TICK = LOOP_START_BAR * TICKS_PER_BAR;

/* ── 和声进行（每小节一个） ── */
const CHORDS = [
  /* I 引子 1-4 */
  "Dm", "Dm", "Bb", "A",
  /* II A 段 5-12 */
  "Dm", "Dm", "Bb", "A", "Dm", "Bb", "C", "A",
  /* III B 段 13-20 */
  "F", "F", "Gm", "A", "Bb", "Gm", "A", "A",
  /* IV A' 段 21-28 */
  "Dm", "Dm", "Bb", "A", "Dm", "Bb", "C", "A",
  /* V C 段 29-36 */
  "Bb", "A", "Gm", "F", "Eb", "Dm", "A", "A",
  /* VI 尾段 37-40 */
  "Dm", "Bb", "A", "Dm"
];

/* ── 和弦音级 ── */
const CHORD_TONES = {
  Dm: ["D", "F", "A"],
  Bb: ["Bb", "D", "F"],

/* ── 低音根音 ── */
const BASS_NOTE = {

  Bb: "Bb1",
  A:  "A1",
  Gm: "G1",
  C:  "C2",
  F:  "F2",

/* ── 主旋律：[起始拍, 时值拍, 音名] ── */
const MELODY = [
  /* A 段 Bar 5-12 (拍 16-47) */
  [16, 1, "D4"], [17, 1, "F4"], [18, 1, "E4"], [19, 1, "D4"],
  [20, 2, "D4"], [22, 2, "A4"],
  [24, 1, "Bb4"], [25, 1, "A4"], [26, 1, "G4"], [27, 1, "F4"],

  [48, 1, "F4"], [49, 1, "A4"], [50, 1, "G4"], [51, 1, "F4"],

  [72, 1, "E4"], [73, 1, "F4"], [74, 1, "G4"], [75, 1, "E4"],

  [112, 1, "Bb4"], [113, 1, "A4"], [114, 1, "Ab4"], [115, 1, "G4"],

/* ══════════════════════════════════════════════════════════════
   第 11 章 · 事件表生成
   ══════════════════════════════════════════════════════════════ */

/**
 * 生成完整的事件表
 * 事件结构：{ t, d, n, i, v }
 * - t：起始拍号（可以是非整数，比如 0.5 表示半拍）
 * - d：持续拍数
 * - n：音名（null 表示噪声/打击乐）
 * - i：乐器名
 * - v：音量 0-127
 */
function buildEvents() {
  const events = [];
  const add = (t, d, n, i, v) => events.push({ t, d, n, i, v });

  /* ── 低音：全曲脉搏 ── */
  for (let b = 0; b < TOTAL_BARS; b++) {
    const root = BASS_NOTE[CHORDS[b]];
    const t = b * BEATS_PER_BAR;
    if (b >= 4 && b < 36) {
      // 战斗段：每半拍一个脉冲
      for (let k = 0; k < 8; k++) {
        add(t + k * 0.5, 0.45, root, "bass", k === 0 ? 115 : 88);
      }
    } else {
      // 引子和尾段：整小节长音
      add(t, BEATS_PER_BAR, root, "bass", 100);
    }
  }

  /* ── 管风琴：圣咏地基 ── */
  for (let b = 0; b < TOTAL_BARS; b++) {
    const tones = CHORD_TONES[CHORDS[b]];
    const root = BASS_NOTE[CHORDS[b]];
    const t = b * BEATS_PER_BAR;
    // 根音升高一个八度
    const rootUp = root.replace(/\d/, d => (+d + 1));
    add(t, BEATS_PER_BAR, rootUp, "organ", 82);
    // 五度音（用第三个和弦音降八度）
    add(t, BEATS_PER_BAR, tones[2] + "3", "organ", 58);
    // 从第 5 小节起加中音
    if (b >= 4) {
      add(t, BEATS_PER_BAR, tones[1] + "4", "organ", 62);
    }
  }

  /* ── 弦乐震音：战斗段 ── */
  for (let b = 4; b < 36; b++) {
    const tones = CHORD_TONES[CHORDS[b]];
    const t = b * BEATS_PER_BAR;
    for (let k = 0; k < 8; k++) {
      add(t + k * 0.5, 0.45, tones[k % 3] + "4", "strings", 68);
    }
  }

  /* ── 弦乐长音：和声 ── */
  for (let b = 0; b < TOTAL_BARS; b++) {
    const tones = CHORD_TONES[CHORDS[b]];
    const t = b * BEATS_PER_BAR;
    add(t, BEATS_PER_BAR, tones[0] + "4", "strings", 52);
    add(t, BEATS_PER_BAR, tones[1] + "4", "strings", 46);
  }

  /* ── 钢琴：机械 16 分 ── */
  for (let b = 4; b < 36; b++) {
    const tones = CHORD_TONES[CHORDS[b]];
    const t = b * BEATS_PER_BAR;
    for (let k = 0; k < 16; k++) {
      const oct = (k < 8) ? "5" : "4";
      const note = tones[(k + b) % 3] + oct;
      add(t + k * 0.25, 0.22, note, "piano", k % 4 === 0 ? 82 : 55);
    }
  }

  /* ── 主旋律：铜管 + 合唱 ── */
  for (const [t, d, n] of MELODY) {
    add(t, d, n, "brass", 105);
    const low = n.replace(/\d/, x => (+x - 1));
    add(t, d, low, "choir", 72);
  }

  /* ── 定音鼓：战斗节奏 ── */
  for (let b = 0; b < TOTAL_BARS; b++) {
    const root = BASS_NOTE[CHORDS[b]].replace(/\d/, d => (+d - 1));
    const t = b * BEATS_PER_BAR;
    if (b < 4) {
      // 引子：每拍一响，渐强
      for (let k = 0; k < 4; k++) {
        add(t + k, 0.8, root, "timpani", 40 + b * 6);
      }
    } else if (b >= 4 && b < 36) {
      // 战斗段：第 1 拍、第 3 拍
      add(t, 0.8, root, "timpani", 100);
      add(t + 2, 0.8, root, "timpani", 82);
      // 每 4 小节末尾加一个装饰
      if (b % 4 === 3) {
        add(t + 3.5, 0.4, root, "timpani", 92);
      }
    } else {
      // 尾段：每小节一响
      add(t, 0.8, root, "timpani", 70);
    }
  }

  /* ── 军鼓：机械脉冲 ── */
  for (let b = 4; b < 36; b++) {
    const t = b * BEATS_PER_BAR;
    for (let k = 0; k < 8; k++) {
      add(t + k * 0.5, 0.2, null, "snare", k % 4 === 0 ? 72 : 46);
    }
  }

  /* ── 金属敲击：神迹点缀 ── */
  for (let b = 4; b < 36; b += 2) {
    add(b * BEATS_PER_BAR, 1.0, "A5", "metal", 62);
    add(b * BEATS_PER_BAR + 2, 0.8, "E6", "metal", 45);
  }

  // 按时间排序
  events.sort((a, b) => a.t - b.t);
  return events;
}

/* ══════════════════════════════════════════════════════════════
   第 12 章 · 乐器渲染函数（采样级）
   ══════════════════════════════════════════════════════════════ */

/**
 * 管风琴：加法合成
 * 使用 6 个谐波分量：基频、八度、十二度、双八度、十九度、三个八度
 */
function renderOrgan(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  // 谐波：[倍数, 权重]
  const partials = [
    [1, 1.00],
    [2, 0.52],
    [3, 0.34],
    [4, 0.20],
    [6, 0.11],
    [8, 0.06]
  ];

  const attack = Math.min(Math.floor(0.08 * SR), dur >> 2);
  const release = Math.min(Math.floor(0.28 * SR), dur >> 2);
  const susEnd = Math.max(attack, dur - release);

  for (let p = 0; p < partials.length; p++) {
    const f = freq * partials[p][0];
    if (f > SR * 0.45) continue;
    const w = partials[p][1] * amp;
    const omega = f / SR;
    let ph = 0;

    for (let i = 0; i < dur; i++) {
      let env;
      if (i < attack) env = i / attack;
      else if (i < susEnd) env = 1;
      else env = (dur - i) / release;
      if (env < 0) env = 0;

      const pi = (ph * LUT_SIZE) | 0;
      const a = SIN_LUT[pi];
      const b = SIN_LUT[pi + 1];
      out[start + i] += (a + (b - a) * (ph * LUT_SIZE - pi)) * w * env;

      ph += omega;
      if (ph >= 1) ph -= 1;
    }
  }
}

/**
 * 弦乐：锯齿波近似 + 一阶低通
 */
function renderStrings(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  const maxH = Math.min(12, Math.floor(SR * 0.4 / freq));
  const attack = Math.min(Math.floor(0.10 * SR), dur >> 2);
  const release = Math.min(Math.floor(0.18 * SR), dur >> 2);
  const susEnd = Math.max(attack, dur - release);

  const ph = new Float32Array(maxH);
  const om = new Float32Array(maxH);
  for (let h = 0; h < maxH; h++) {
    om[h] = freq * (h + 1) / SR;
    ph[h] = Math.random();
  }

  let lp = 0;
  const cutoff = Math.min(3200, freq * 9 + 700);
  const alpha = 1 / (1 + SR / (2 * Math.PI * cutoff));

  for (let i = 0; i < dur; i++) {
    let env;
    if (i < attack) env = i / attack;
    else if (i < susEnd) env = 1;
    else env = (dur - i) / release;
    if (env < 0) env = 0;

    let s = 0;
    for (let h = 0; h < maxH; h++) {
      const p = ph[h];
      const pi = (p * LUT_SIZE) | 0;
      const a = SIN_LUT[pi];
      const b = SIN_LUT[pi + 1];
      s += (a + (b - a) * (p * LUT_SIZE - pi)) / (h + 1);
      ph[h] += om[h];
      if (ph[h] >= 1) ph[h] -= 1;
    }

    lp += alpha * (s - lp);
    out[start + i] += lp * env * amp * 0.55;
  }
}

/**
 * 钢琴：泛音 + 指数衰减
 */
function renderPiano(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  // [倍数, 权重, 衰减速度]
  const partials = [
    [1, 1.00, 0.9],
    [2, 0.42, 1.3],
    [3, 0.22, 1.8],
    [4, 0.12, 2.4],
    [5, 0.06, 3.2],
    [6, 0.03, 4.0]
  ];
  const attack = Math.min(Math.floor(0.004 * SR), dur >> 3);

  for (let p = 0; p < partials.length; p++) {
    const f = freq * partials[p][0];
    if (f > SR * 0.45) continue;
    const w0 = partials[p][1] * amp;
    const tau = 1.6 / partials[p][2];
    const coef = Math.exp(-1 / (tau * SR));
    const omega = f / SR;
    let ph = 0;
    let env = w0;

    for (let i = 0; i < dur; i++) {
      const a = (i < attack) ? (i / attack) : 1;
      const pi = (ph * LUT_SIZE) | 0;
      const x = SIN_LUT[pi];
      out[start + i] += x * env * a;
      env *= coef;
      ph += omega;
      if (ph >= 1) ph -= 1;
    }
  }
}

/**
 * 铜管：锯齿 + 滤波器包络
 */
function renderBrass(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  const maxH = Math.min(14, Math.floor(SR * 0.4 / freq));
  const attack = Math.min(Math.floor(0.035 * SR), dur >> 2);
  const release = Math.min(Math.floor(0.14 * SR), dur >> 2);
  const susEnd = Math.max(attack, dur - release);

  const ph = new Float32Array(maxH);
  const om = new Float32Array(maxH);
  for (let h = 0; h < maxH; h++) {
    om[h] = freq * (h + 1) / SR;
    ph[h] = Math.random();
  }

  let lp = 0;
  const cutMax = Math.min(4200, freq * 11 + 400);
  const cutMin = Math.max(freq * 2, 600);

  for (let i = 0; i < dur; i++) {
    let env;
    if (i < attack) env = i / attack;
    else if (i < susEnd) env = 1;
    else env = (dur - i) / release;
    if (env < 0) env = 0;

    let cut;
    if (i < attack) {
      cut = cutMin + (cutMax - cutMin) * (i / attack);
    } else {
      cut = cutMax - (cutMax - cutMin) * 0.5 * ((i - attack) / Math.max(1, dur - attack));
    }

    const alpha = 1 / (1 + SR / (2 * Math.PI * cut));

    let s = 0;
    for (let h = 0; h < maxH; h++) {
      const p = ph[h];
      const pi = (p * LUT_SIZE) | 0;
      const a = SIN_LUT[pi];
      const b = SIN_LUT[pi + 1];
      s += (a + (b - a) * (p * LUT_SIZE - pi)) / (h + 1);
      ph[h] += om[h];
      if (ph[h] >= 1) ph[h] -= 1;
    }

    lp += alpha * (s - lp);
    out[start + i] += lp * env * amp * 0.65;
  }
}

/**
 * 男声合唱：正弦 + 轻微失谐
 */
function renderChoir(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  const attack = Math.min(Math.floor(0.22 * SR), dur >> 2);
  const release = Math.min(Math.floor(0.35 * SR), dur >> 2);
  const susEnd = Math.max(attack, dur - release);

  const maxH = 4;
  const weights = [1.0, 0.38, 0.16, 0.06];

  // 两个失谐振荡器（模拟合唱）
  const detunes = [0.997, 1.003];
  const phs = [];
  const oms = [];
  for (let d = 0; d < detunes.length; d++) {
    phs.push(new Float32Array(maxH));
    oms.push(new Float32Array(maxH));
    for (let h = 0; h < maxH; h++) {
      oms[d][h] = freq * detunes[d] * (h + 1) / SR;
      phs[d][h] = Math.random();
    }
  }

  for (let i = 0; i < dur; i++) {
    let env;
    if (i < attack) env = i / attack;
    else if (i < susEnd) env = 1;
    else env = (dur - i) / release;
    if (env < 0) env = 0;

    let s = 0;
    for (let d = 0; d < 2; d++) {
      for (let h = 0; h < maxH; h++) {
        const p = phs[d][h];
        const pi = (p * LUT_SIZE) | 0;
        const a = SIN_LUT[pi];
        const b = SIN_LUT[pi + 1];
        s += (a + (b - a) * (p * LUT_SIZE - pi)) * weights[h] * 0.5;
        phs[d][h] += oms[d][h];
        if (phs[d][h] >= 1) phs[d][h] -= 1;
      }
    }

    out[start + i] += s * env * amp * 0.4;
  }
}

/**
 * 低音：正弦 + 三次谐波
 */
function renderBass(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  const attack = Math.min(Math.floor(0.015 * SR), dur >> 3);
  const release = Math.min(Math.floor(0.10 * SR), dur >> 3);
  const susEnd = Math.max(attack, dur - release);

  const omega1 = freq / SR;
  const omega3 = freq * 3 / SR;
  let ph1 = 0;
  let ph3 = 0;

  for (let i = 0; i < dur; i++) {
    let env;
    if (i < attack) env = i / attack;
    else if (i < susEnd) env = 1;
    else env = (dur - i) / release;
    if (env < 0) env = 0;

    const p1 = (ph1 * LUT_SIZE) | 0;
    const p3 = (ph3 * LUT_SIZE) | 0;
    const x = SIN_LUT[p1] + SIN_LUT[p3] * 0.22;

    out[start + i] += x * env * amp;

    ph1 += omega1;
    if (ph1 >= 1) ph1 -= 1;
    ph3 += omega3;
    if (ph3 >= 1) ph3 -= 1;
  }
}

/**
 * 定音鼓：音高下滑 + 噪声脉冲
 */
function renderTimpani(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  // 主音：正弦下滑
  const tau = 0.75;
  const coef = Math.exp(-1 / (tau * SR));
  let env = amp;
  let ph = 0;

  const f0 = freq * 1.5;
  const glide = Math.min(dur, Math.floor(0.06 * SR));

  for (let i = 0; i < dur; i++) {
    const f = (i < glide)
      ? f0 + (freq - f0) * (i / glide)
      : freq;
    const omega = f / SR;
    const pi = (ph * LUT_SIZE) | 0;
    out[start + i] += SIN_LUT[pi] * env;
    env *= coef;
    ph += omega;
    if (ph >= 1) ph -= 1;
  }

  // 鼓皮噪声
  const nDur = Math.min(dur, Math.floor(0.10 * SR));
  const nCoef = Math.exp(-1 / (0.04 * SR));
  let nEnv = amp * 0.45;
  let lp = 0;
  const nAlpha = 1 / (1 + SR / (2 * Math.PI * 280));
  for (let i = 0; i < nDur; i++) {
    const n = Math.random() * 2 - 1;
    lp += nAlpha * (n - lp);
    out[start + i] += lp * nEnv;
    nEnv *= nCoef;
  }
}

/**
 * 军鼓：带通噪声
 */
function renderSnare(out, SR, start, len, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  const tau = 0.11;
  const coef = Math.exp(-1 / (tau * SR));
  let env = amp;

  let lp = 0;
  const aLow = 1 / (1 + SR / (2 * Math.PI * 800));

  for (let i = 0; i < dur; i++) {
    const n = Math.random() * 2 - 1;
    lp += aLow * (n - lp);
    const hp = n - lp;
    // 体腔音
    const body = Math.sin(2 * Math.PI * 190 * i / SR) * 0.3;
    out[start + i] += (hp * 0.9 + body) * env;
    env *= coef;
  }
}

/**
 * 金属敲击：非谐和泛音
 */
function renderMetal(out, SR, start, len, freq, amp) {
  const end = Math.min(start + len, out.length);
  const dur = end - start;
  if (dur <= 0) return;

  // 非谐和泛音比
  const ratios = [1, 1.41, 1.93, 2.55, 3.14, 3.87];
  const tau = 0.55;
  const coef = Math.exp(-1 / (tau * SR));

  for (let r = 0; r < ratios.length; r++) {
    const f = freq * ratios[r];
    if (f > SR * 0.45) continue;
    const omega = f / SR;
    let env = amp / (r + 1);
    let ph = Math.random();
    for (let i = 0; i < dur; i++) {
      const pi = (ph * LUT_SIZE) | 0;
      out[start + i] += SIN_LUT[pi] * env;
      env *= coef;
      ph += omega;
      if (ph >= 1) ph -= 1;
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   第 13 章 · 事件分发
   ══════════════════════════════════════════════════════════════ */

/**
 * 渲染单个事件到缓冲区
 */
function renderEvent(buf, SR, ev) {
  const start = Math.round(ev.t * SPB * SR);
  if (start >= buf.length) return;
  const len = Math.round(ev.d * SPB * SR);
  const amp = ev.v / 127;

  // 打击乐（无音名）
  if (ev.n === null) {
    if (ev.i === "snare") renderSnare(buf, SR, start, len, amp);
    return;
  }

  const freq = nf(ev.n);
  switch (ev.i) {
    case "organ":
      renderOrgan(buf, SR, start, len, freq, amp);
      break;
    case "strings":
      renderStrings(buf, SR, start, len, freq, amp);
      break;
    case "piano":
      renderPiano(buf, SR, start, len, freq, amp);
      break;
    case "brass":
      renderBrass(buf, SR, start, len, freq, amp);
      break;
    case "choir":
      renderChoir(buf, SR, start, len, freq, amp);
      break;
    case "bass":
      renderBass(buf, SR, start, len, freq, amp);
      break;
    case "timpani":
      renderTimpani(buf, SR, start, len, freq, amp);
      break;
    case "metal":
      renderMetal(buf, SR, start, len, freq, amp);
      break;
    default:
      break;
  }
}

/* ══════════════════════════════════════════════════════════════
   第 14 章 · 分片渲染器
   ══════════════════════════════════════════════════════════════ */

/**
 * 分片渲染整个乐曲，返回 Float32Array 缓冲区
 * @param {AudioContext} ctx 音频上下文
 * @param {function(number): void} onProgress 进度回调，参数 [0, 1]
 * @returns {Promise<{buf: Float32Array, SR: number}>}
 */
async function renderMusic(ctx, onProgress) {
  const SR = ctx.sampleRate;
  const totalSamples = Math.ceil(TOTAL_DURATION * SR);
  const buf = new Float32Array(totalSamples);
  const events = buildEvents();
  const total = events.length;

  Log.log(`渲染音乐：${TOTAL_DURATION.toFixed(2)} 秒 @ ${SR}Hz，共 ${total} 个事件`);

  let i = 0;
  while (i < total) {
    const t0 = performance.now();
    while (i < total && performance.now() - t0 < 16) {
      try {
        renderEvent(buf, SR, events[i]);
      } catch (e) {
        Log.warn("render event error:", e);
      }
      i++;
    }
    if (onProgress) onProgress(i / total);
    await sleep(0);
  }

  // 归一化 + 软饱和
  let peak = 0;
  for (let k = 0; k < buf.length; k++) {
    const a = buf[k] < 0 ? -buf[k] : buf[k];
    if (a > peak) peak = a;
  }
  const gain = peak > 0 ? 0.85 / peak : 1;
  for (let k = 0; k < buf.length; k++) {
    buf[k] = softClip(buf[k] * gain);
  }

  Log.log(`渲染完成：峰值 ${peak.toFixed(3)}，归一化增益 ${gain.toFixed(3)}`);
  return { buf, SR };
}

/* ══════════════════════════════════════════════════════════════
   第 15 章 · 自检
   ══════════════════════════════════════════════════════════════ */

/**
 * 音乐自检
 */
function selfTest(buf, SR) {
  const r = {
    nan: 0,
    peak: 0,
    rms: [],
    duration: buf.length / SR,
    silent: false
  };

  for (let i = 0; i < buf.length; i++) {
    const v = buf[i];
    if (!isFinite(v)) r.nan++;
    const a = v < 0 ? -v : v;
    if (a > r.peak) r.peak = a;
  }

  const SEG = 10;
  const L = Math.floor(buf.length / SEG);
  for (let s = 0; s < SEG; s++) {
    let sum = 0;
    const s0 = s * L;
    const s1 = Math.min((s + 1) * L, buf.length);
    for (let i = s0; i < s1; i++) sum += buf[i] * buf[i];
    r.rms.push(Math.sqrt(sum / Math.max(1, s1 - s0)));
  }

  const maxRMS = Math.max.apply(null, r.rms);
  if (maxRMS < 0.005) r.silent = true;
  return r;
}

/* ══════════════════════════════════════════════════════════════
   第 16 章 · 音乐播放器
   ══════════════════════════════════════════════════════════════ */

const MusicPlayer = {
  ctx: null,
  masterGain: null,
  sourceNode: null,
  audioBuffer: null,
  renderedBuffer: null,
  renderedSR: 44100,
  playing: false,
  startTime: 0,
  pausedAt: 0,
  loopEnabled: true,

  /**
   * 初始化音频上下文
   */
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.75;
    this.masterGain.connect(this.ctx.destination);
    Log.log("AudioContext 初始化，采样率", this.ctx.sampleRate);
  },

  /**
   * 恢复上下文
   */
  async resume() {
    if (this.ctx && this.ctx.state === "suspended") {
      await this.ctx.resume();
    }
  },

  /**
   * 渲染并准备播放
   */
  async prepare(onProgress) {
    this.init();
    const { buf, SR } = await renderMusic(this.ctx, onProgress);
    this.renderedBuffer = buf;
    this.renderedSR = SR;
    return buf;
  },

  /**
   * 播放（循环）
   */
  async play() {
    if (!this.renderedBuffer) {
      Log.warn("尚未渲染音乐，无法播放");
      return;
    }
    if (this.playing) this.stop();

    await this.resume();

    const ab = this.ctx.createBuffer(1, this.renderedBuffer.length, this.renderedSR);
    ab.getChannelData(0).set(this.renderedBuffer);
    this.audioBuffer = ab;

    this.sourceNode = this.ctx.createBufferSource();
    this.sourceNode.buffer = ab;
    this.sourceNode.loop = this.loopEnabled;
    this.sourceNode.loopStart = LOOP_START_TIME;
    this.sourceNode.loopEnd = TOTAL_DURATION;
    this.sourceNode.connect(this.masterGain);
    this.sourceNode.start(0);

    this.playing = true;
    this.startTime = this.ctx.currentTime;
    Log.log("音乐开始播放，循环点", LOOP_START_TIME.toFixed(3), "秒");
  },

  /**
   * 停止
   */
  stop() {
    if (this.sourceNode) {
      try { this.sourceNode.stop(); } catch (e) {}
      try { this.sourceNode.disconnect(); } catch (e) {}
      this.sourceNode = null;
    }
    this.playing = false;
  },

  /**
   * 获取当前音乐时间（秒）
   * 循环时自动折算
   */
  getTime() {
    if (!this.ctx || !this.playing) return 0;
    let t = this.ctx.currentTime - this.startTime;
    if (t > TOTAL_DURATION) {
      // 折算到循环段
      const cycle = TOTAL_DURATION - LOOP_START_TIME;
      t = LOOP_START_TIME + ((t - LOOP_START_TIME) % cycle);
    }
    return t;
  },

  /**
   * 获取当前十六分音符 tick
   */
  getTick() {
    return Math.floor(this.getTime() / SEC_PER_TICK);
  },

  /**
   * 获取当前小节数（0-indexed）
   */
  getBar() {
    return Math.floor(this.getTime() / SEC_PER_BAR);
  },

  /**
   * 获取当前拍数
   */
  getBeat() {
    return this.getTime() / SPB;
  },

  /**
   * 设置音量
   */
  setVolume(v) {
    if (this.masterGain) {
      this.masterGain.gain.setTargetAtTime(clamp(v, 0, 1), this.ctx.currentTime, 0.02);
    }
  },

  /**
   * 是否已渲染
   */
  isReady() {
    return !!this.renderedBuffer;
  }
};

/* ══════════════════════════════════════════════════════════════
   第 17 章 · 音乐段落检测
   ══════════════════════════════════════════════════════════════ */

const MusicSection = {
  INTRO: "intro",       // 1-4   引子
  A: "a",               // 5-12  战端
  B: "b",               // 13-20 神罚
  AP: "ap",             // 21-28 审判
  C: "c",               // 29-36 机械
  OUTRO: "outro"        // 37-40 尾
};

/**
 * 给定小节数，返回段落名
 */
function getSection(bar) {
  if (bar < 4) return MusicSection.INTRO;
  if (bar < 12) return MusicSection.A;
  if (bar < 20) return MusicSection.B;
  if (bar < 28) return MusicSection.AP;
  if (bar < 36) return MusicSection.C;
  return MusicSection.OUTRO;
}

/**
 * 段落中文名
 */
function getSectionName(sec) {
  switch (sec) {
    case MusicSection.INTRO: return "引子";
    case MusicSection.A: return "战端";
    case MusicSection.B: return "神罚";
    case MusicSection.AP: return "审判";
    case MusicSection.C: return "机械";
    case MusicSection.OUTRO: return "尾";
    default: return "?";
  }
}

/**
 * 段落起始小节
 */
function getSectionStartBar(sec) {
  switch (sec) {
    case MusicSection.INTRO: return 0;
    case MusicSection.A: return 4;
    case MusicSection.B: return 12;
    case MusicSection.AP: return 20;
    case MusicSection.C: return 28;
    case MusicSection.OUTRO: return 36;
    default: return 0;
  }
}

/**
 * 段落结束小节（不包含）
 */
function getSectionEndBar(sec) {
  switch (sec) {
    case MusicSection.INTRO: return 4;
    case MusicSection.A: return 12;
    case MusicSection.B: return 20;
    case MusicSection.AP: return 28;
    case MusicSection.C: return 36;
    case MusicSection.OUTRO: return 40;
    default: return 40;
  }
}

/* ══════════════════════════════════════════════════════════════
   第 18 章 · 主画布初始化
   ══════════════════════════════════════════════════════════════ */

const Canvas = {
  el: null,
  ctx: null,
  dpr: 1,
  cssScale: 1,

  /**
   * 初始化画布
   */
  init() {
    this.el = document.getElementById("game");
    if (!this.el) {
      Log.error("找不到画布元素 #game");
      return;
    }
    this.ctx = this.el.getContext("2d", { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    this.resize();
    window.addEventListener("resize", () => this.resize());
    window.addEventListener("orientationchange", () => {
      setTimeout(() => this.resize(), 120);
    });
    Log.log("画布初始化完成");
  },

  /**
   * 自适应尺寸
   */
resize: function() {
  if (!this.el) return;

  const availW = window.innerWidth;
  const availH = window.innerHeight;

  /* 主动判定：视口明显竖长 → 自动横屏模式（不依赖系统上报） */
  ROTATED = availH > availW * 1.05;

  this.cssW = availW;
  this.cssH = availH;
  this.cssScale = 1;

  this.el.style.width = availW + "px";
  this.el.style.height = availH + "px";

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.dpr = dpr;
  this.el.width = Math.round(availW * dpr);
  this.el.height = Math.round(availH * dpr);

  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.ctx.imageSmoothingEnabled = false;
},

  /**
   * 获取绘图上下文
   */
getCtx: function() { return __bufCtx; }   /* 全部游戏绘制进缓冲 */,

  /**
   * 客户端坐标 → 画布坐标
   */
toLocal: function(clientX, clientY) {
  const r = this.el.getBoundingClientRect();
  const px = clientX - r.left;
  const py = clientY - r.top;
  const W = r.width;
  const H = r.height;

  if (!ROTATED) {
    return {
      x: px / W * CANVAS_W,
      y: py / H * CANVAS_H
    };
  }

  ROT_SCALE = Math.min(W / CANVAS_H, H / CANVAS_W);
  const s = ROT_SCALE;

  return {
    x: CANVAS_W / 2 + (py - H / 2) / s,
    y: CANVAS_H / 2 - (px - W / 2) / s
  };
},
};

class EventEmitter {
  constructor() {
    this._listeners = new Map();
    this._onceWrappers = new WeakMap();
  }
  on(event, cb) {
    if (!this._listeners.has(event)) this._listeners.set(event, []);
    this._listeners.get(event).push(cb);
    return () => this.off(event, cb);
  }
  once(event, cb) {
    const wrapper = (...args) => { this.off(event, wrapper); cb(...args); };
    this._onceWrappers.set(cb, wrapper);
    return this.on(event, wrapper);
  }
  off(event, cb) {
    const list = this._listeners.get(event);
    if (!list) return;
    const idx = list.indexOf(cb);
    if (idx >= 0) list.splice(idx, 1);
    if (list.length === 0) this._listeners.delete(event);
  }
  emit(event, ...args) {
    const list = this._listeners.get(event);
    if (!list || list.length === 0) return;
    const snapshot = list.slice();
    for (const cb of snapshot) {
      try { cb(...args); } catch (e) { Log.error("EventEmitter listener error:", e); }
    }
  }
  clear(event) {
    if (event) this._listeners.delete(event);
    else this._listeners.clear();
  }
  listenerCount(event) {
    const list = this._listeners.get(event);
    return list ? list.length : 0;
  }
}
const Bus = new EventEmitter();

class StateMachine {
  constructor(config) {
    this.config = config;
    this.states = config.states || {};
    this.state = null;
    this.prevState = null;
    this.stateTime = 0;
    this.totalTime = 0;
    this.history = [];
    this.maxHistory = 32;
    this._context = config.context || {};
    if (config.initial) this.transition(config.initial, true);
  }
  transition(name, force, data) {
    if (!force && this.state === name) return false;
    if (!this.states[name]) { Log.warn("StateMachine: unknown state", name); return false; }
    if (this.state && this.states[this.state] && this.states[this.state].exit) {
      try { this.states[this.state].exit.call(this._context, this.state, name); }
      catch (e) { Log.error("StateMachine exit error:", e); }
    }
    this.history.push(this.state);
    if (this.history.length > this.maxHistory) this.history.shift();
    this.prevState = this.state;
    this.state = name;
    this.stateTime = 0;
    if (this.states[name].enter) {
      try { this.states[name].enter.call(this._context, this.prevState, data); }
      catch (e) { Log.error("StateMachine enter error:", e); }
    }
    Bus.emit("state:changed", name, this.prevState);
    return true;
  }
  update(dt) {
    if (!this.state) return;
    this.stateTime += dt;
    this.totalTime += dt;
    const s = this.states[this.state];
    if (s && s.update) {
      try { s.update.call(this._context, dt, this.stateTime); }
      catch (e) { Log.error("StateMachine update error:", e); }
    }
  }
  is(...names) { return names.includes(this.state); }
  justEntered(name) { return this.state === name && this.stateTime < 0.001; }
  timeOver(threshold) { return this.stateTime > threshold; }
  revert() { if (this.prevState) this.transition(this.prevState, true); }
  getContext() { return this._context; }
}

class GameTimer {
  constructor() { this.timers = []; this.nextId = 1; }
  setTimeout(delay, cb) {
    const id = this.nextId++;
    this.timers.push({ id, delay, elapsed: 0, cb, repeat: false, alive: true });
    return id;
  }
  setInterval(interval, cb) {
    const id = this.nextId++;
    this.timers.push({ id, delay: interval, elapsed: 0, cb, repeat: true, alive: true });
    return id;
  }
  clear(id) {
    for (const t of this.timers) {
      if (t.id === id) { t.alive = false; break; }
    }
  }
  clearAll() {
    for (const t of this.timers) t.alive = false;
    this.timers = [];
  }
  update(dt) {
    for (let i = this.timers.length - 1; i >= 0; i--) {
      const t = this.timers[i];
      if (!t.alive) { this.timers.splice(i, 1); continue; }
      t.elapsed += dt;
      if (t.elapsed >= t.delay) {
        try { t.cb(); } catch (e) { Log.error("GameTimer error:", e); }
        if (t.repeat) t.elapsed = t.elapsed - t.delay;
        else { t.alive = false; this.timers.splice(i, 1); }
      }
    }
  }
}

class Tween {
  constructor(target, props, duration) {
    this.target = target;
    this.props = props;
    this.duration = duration;
    this.elapsed = 0;
    this.ease = Ease.linear;
    this.onUpdate = null;
    this.onComplete = null;
    this.delay = 0;
    this._startValues = {};
    this._captured = false;
    this.alive = true;
    this.loops = 1;
    this._loopCount = 0;
    this.yoyo = false;
    this._direction = 1;
  }
  easing(fn) { this.ease = fn; return this; }
  delayFor(sec) { this.delay = sec; return this; }
  repeat(n) { this.loops = n; return this; }
  pingpong() { this.yoyo = true; return this; }
  update(cb) { this.onUpdate = cb; return this; }
  complete(cb) { this.onComplete = cb; return this; }
  _capture() {
    if (this._captured) return;
    for (const k in this.props) this._startValues[k] = this.target[k];
    this._captured = true;
  }
  step(dt) {
    if (!this.alive) return;
    if (this.delay > 0) {
      this.delay -= dt;
      if (this.delay > 0) return;
      dt = -this.delay;
      this.delay = 0;
    }
    this._capture();
    this.elapsed += dt;
    let t = clamp(this.elapsed / this.duration, 0, 1);
    const tEff = this.yoyo ? (this._direction > 0 ? t : 1 - t) : t;
    const e = this.ease(tEff);
    for (const k in this.props) {
      const from = this._startValues[k];
      const to = this.props[k];
      this.target[k] = lerp(from, to, e);
    }
    if (this.onUpdate) this.onUpdate(this.target, t);
    if (this.elapsed >= this.duration) {
      if (this.yoyo) {
        this.yoyo = false;
        this._direction *= -1;
        const tmp = {};
        for (const k in this.props) {
          tmp[k] = this._startValues[k];
          this._startValues[k] = this.props[k];
          this.props[k] = tmp[k];
        }
        this.elapsed = 0;
        this.yoyo = true;
        this._loopCount++;
        if (this._loopCount >= this.loops * 2) {
          this.alive = false;
          if (this.onComplete) this.onComplete();
        }
      } else if (this._loopCount + 1 < this.loops) {
        this._loopCount++;
        this.elapsed = 0;
        this._captured = false;
      } else {
        this.alive = false;
        if (this.onComplete) this.onComplete();
      }
    }
  }
}

const Noise = {
  _perm: null,
  _init() {
    if (this._perm) return;
    const p = new Uint8Array(512);
    const arr = new Uint8Array(256);
    for (let i = 0; i < 256; i++) arr[i] = i;
    const rnd = mulberry32(0x5EED1234);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    for (let i = 0; i < 512; i++) p[i] = arr[i & 255];
    this._perm = p;
  },
  _fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); },
  _lerp(a, b, t) { return a + t * (b - a); },
  _grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  },
  perlin2(x, y) {
    this._init();
    const p = this._perm;
    const xi = Math.floor(x) & 255;
    const yi = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = this._fade(xf);
    const v = this._fade(yf);
    const aa = p[p[xi] + yi];
    const ab = p[p[xi] + yi + 1];
    const ba = p[p[xi + 1] + yi];
    const bb = p[p[xi + 1] + yi + 1];
    const x1 = this._lerp(this._grad(aa, xf, yf), this._grad(ba, xf - 1, yf), u);
    const x2 = this._lerp(this._grad(ab, xf, yf - 1), this._grad(bb, xf - 1, yf - 1), u);
    return this._lerp(x1, x2, v);
  },
  fbm2(x, y, octaves = 4, persistence = 0.5) {
    let sum = 0, amp = 1, freq = 1, norm = 0;
    for (let i = 0; i < octaves; i++) {
      sum += this.perlin2(x * freq, y * freq) * amp;
      norm += amp;
      amp *= persistence;
      freq *= 2;
    }
    return sum / norm;
  },
  wave(t, scale = 1, offset = 0) { return this.perlin2(t * scale, offset); }
};

class Matrix2D {
  constructor(a = 1, b = 0, c = 0, d = 1, e = 0, f = 0) {
    this.a = a; this.b = b; this.c = c; this.d = d; this.e = e; this.f = f;
  }
  static identity() { return new Matrix2D(); }
  static translation(x, y) { return new Matrix2D(1, 0, 0, 1, x, y); }
  static scaling(sx, sy) { return new Matrix2D(sx, 0, 0, sy, 0, 0); }
  static rotation(theta) {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    return new Matrix2D(c, s, -s, c, 0, 0);
  }
  multiply(m) {
    const a = this.a * m.a + this.c * m.b;
    const b = this.b * m.a + this.d * m.b;
    const c = this.a * m.c + this.c * m.d;
    const d = this.b * m.c + this.d * m.d;
    const e = this.a * m.e + this.c * m.f + this.e;
    const f = this.b * m.e + this.d * m.f + this.f;
    return new Matrix2D(a, b, c, d, e, f);
  }
  applyToPoint(x, y) {
    return {
      x: this.a * x + this.c * y + this.e,
      y: this.b * x + this.d * y + this.f
    };
  }
  applyToContext(ctx) { ctx.transform(this.a, this.b, this.c, this.d, this.e, this.f); }
}

const Bezier = {
  quadratic(p0, p1, p2, t) {
    const mt = 1 - t;
    const a = mt * mt, b = 2 * mt * t, c = t * t;
    return {
      x: a * p0.x + b * p1.x + c * p2.x,
      y: a * p0.y + b * p1.y + c * p2.y
    };
  },
  cubic(p0, p1, p2, p3, t) {
    const mt = 1 - t;
    const a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
    return {
      x: a * p0.x + b * p1.x + c * p2.x + d * p3.x,
      y: a * p0.y + b * p1.y + c * p2.y + d * p3.y
    };
  },
  quadraticTangent(p0, p1, p2, t) {
    const mt = 1 - t;
    return {
      x: 2 * mt * (p1.x - p0.x) + 2 * t * (p2.x - p1.x),
      y: 2 * mt * (p1.y - p0.y) + 2 * t * (p2.y - p1.y)
    };
  },
  cubicTangent(p0, p1, p2, p3, t) {
    const mt = 1 - t;
    return {
      x: 3 * mt * mt * (p1.x - p0.x) + 6 * mt * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
      y: 3 * mt * mt * (p1.y - p0.y) + 6 * mt * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y)
    };
  },
  sampleCubic(p0, p1, p2, p3, segments) {
    const pts = [];
    for (let i = 0; i <= segments; i++) pts.push(this.cubic(p0, p1, p2, p3, i / segments));
    return pts;
  }
};

const CatmullRom = {
  segment(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return {
      x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
      y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
    };
  },
  sample(points, segmentsPerCurve = 8) {
    if (points.length < 2) return points.slice();
    const result = [];
    const pts = [points[0], ...points, points[points.length - 1]];
    for (let i = 0; i < pts.length - 3; i++) {
      for (let j = 0; j < segmentsPerCurve; j++) {
        const t = j / segmentsPerCurve;
        result.push(this.segment(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], t));
      }
    }
    result.push(points[points.length - 1]);
    return result;
  }
};

class ObjectPool {
  constructor(factory, reset, initialSize = 32, maxSize = 512) {
    this.factory = factory;
    this.reset = reset;
    this.maxSize = maxSize;
    this.pool = [];
    this.active = [];
    for (let i = 0; i < initialSize; i++) this.pool.push(factory());
  }
  acquire() {
    let obj;
    if (this.pool.length > 0) obj = this.pool.pop();
    else if (this.active.length < this.maxSize) obj = this.factory();
    else { Log.warn("ObjectPool: reached max size"); return null; }
    this.active.push(obj);
    return obj;
  }
  release(obj) {
    const idx = this.active.indexOf(obj);
    if (idx >= 0) this.active.splice(idx, 1);
    if (this.reset) this.reset(obj);
    if (this.pool.length < this.maxSize) this.pool.push(obj);
  }
  releaseAll() {
    while (this.active.length > 0) {
      const obj = this.active.pop();
      if (this.reset) this.reset(obj);
      if (this.pool.length < this.maxSize) this.pool.push(obj);
    }
  }
  forEach(cb) {
    const snapshot = this.active.slice();
    for (const obj of snapshot) cb(obj);
  }
  get activeCount() { return this.active.length; }
  get freeCount() { return this.pool.length; }
}

class Conductor {

}


const ColorUtils = {
  hsl2rgb(h, s, l) {

        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return { h: h * Math.PI * 2, s, l };
  },
  rgb2hex(r, g, b) {
    return "#" + clamp(r,0,255).toString(16).padStart(2,"0") + clamp(g,0,255).toString(16).padStart(2,"0") + clamp(b,0,255).toString(16).padStart(2,"0");
  },
  hex2rgb(hex) {
    return {
      r: parseInt(hex.substr(1, 2), 16),
      g: parseInt(hex.substr(3, 2), 16),
      b: parseInt(hex.substr(5, 2), 16)
    };
  },
  luminance(hex) {
    const { r, g, b } = this.hex2rgb(hex);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  },
  grayscale(hex) {
    const l = this.luminance(hex);
    const v = Math.round(l * 255);
    return "#" + v.toString(16).padStart(2, "0").repeat(3);
  },
  brightness(hex, amount) {
    const { r, g, b } = this.hex2rgb(hex);
    return this.rgb2hex(clamp(r+amount,0,255), clamp(g+amount,0,255), clamp(b+amount,0,255));
  },
  mix(c1, c2, t) { return lerpColor(c1, c2, t); }
};

const Interp = {
  linear: (a, b, t) => lerp(a, b, t),
  expSmooth(a, b, speed, dt) {
    const k = 1 - Math.exp(-speed * dt);
    return a + (b - a) * k;
  },
  spring(a, b, v, stiffness, damping, dt) {
    const force = (b - a) * stiffness;
    const damp = -v * damping;
    const acc = force + damp;
    const newV = v + acc * dt;
    const newA = a + newV * dt;
    return { value: newA, velocity: newV };
  },
  damp(a, b, lambda, dt) { return lerp(a, b, 1 - Math.exp(-lambda * dt)); },
  angle(a, b, t) { const d = angleDiff(a, b); return a + d * t; },
  color(c1, c2, t) { return lerpColor(c1, c2, t); },
  vec2(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }
};

const Formatter = {
  pad(n, len) { return String(n).padStart(len, "0"); },
  time(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return this.pad(m, 2) + ":" + this.pad(s, 2);
  },
  fixed(n, digits = 2) { return n.toFixed(digits); },
  percent(n, digits = 0) { return (n * 100).toFixed(digits) + "%"; },
  short(n) {
    const abs = Math.abs(n);
    if (abs < 1000) return String(Math.round(n));
    if (abs < 1000000) return (n / 1000).toFixed(1) + "K";
    if (abs < 1000000000) return (n / 1000000).toFixed(1) + "M";
    return (n / 1000000000).toFixed(1) + "B";
  },
  signed(n) { return (n > 0 ? "+" : "") + n; },
  roman(n) {
    const map = [
      [1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],
      [100,"C"],[90,"XC"],[50,"L"],[40,"XL"],
      [10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]
    ];
    let r = "";
    for (const [v, s] of map) { while (n >= v) { r += s; n -= v; } }
    return r;
  }
};

class LinkedList {
  constructor() { this.head = null; this.tail = null; this.size = 0; }
  push(value) {
    const node = { value, prev: this.tail, next: null };
    if (this.tail) this.tail.next = node; else this.head = node;
    this.tail = node;
    this.size++;
    return node;
  }
  unshift(value) {
    const node = { value, prev: null, next: this.head };
    if (this.head) this.head.prev = node; else this.tail = node;
    this.head = node;
    this.size++;
    return node;
  }
  remove(node) {
    if (!node) return;
    if (node.prev) node.prev.next = node.next; else this.head = node.next;
    if (node.next) node.next.prev = node.prev; else this.tail = node.prev;
    node.prev = null;
    node.next = null;
    this.size--;
  }
  pop() {
    if (!this.tail) return undefined;
    const v = this.tail.value;
    this.remove(this.tail);
    return v;
  }
  shift() {
    if (!this.head) return undefined;
    const v = this.head.value;
    this.remove(this.head);
    return v;
  }
  clear() { this.head = null; this.tail = null; this.size = 0; }
  forEach(cb) {
    let node = this.head;
    let idx = 0;
    while (node) {
      const next = node.next;
      cb(node.value, idx, node);
      node = next;
      idx++;
    }
  }
  toArray() {
    const arr = [];
    this.forEach(v => arr.push(v));
    return arr;
  }
  isEmpty() { return this.size === 0; }
}

class SceneManager {
  constructor() {
    this.scenes = new Map();
    this.current = null;
    this.next = null;
    this.transitionT = 0;
    this.transitionDur = 0.4;
    this.transitioning = false;
  }
  register(name, scene) { this.scenes.set(name, scene); }
  goto(name, options) {
    if (!this.scenes.has(name)) { Log.warn("SceneManager: unknown scene", name); return; }
    this.next = { name, options };
    this.transitioning = true;
    this.transitionT = 0;
  }
  update(dt) {
    if (this.transitioning) {
      this.transitionT += dt;
      if (this.transitionT >= this.transitionDur) {
        if (this.current && this.current.exit) { try { this.current.exit(); } catch (e) { Log.error(e); } }
        this.current = this.scenes.get(this.next.name);
        this.currentOptions = this.next.options;
        if (this.current && this.current.enter) { try { this.current.enter(this.currentOptions); } catch (e) { Log.error(e); } }
        this.transitioning = false;
        this.next = null;
      }
    }
    if (this.current && this.current.update) { try { this.current.update(dt); } catch (e) { Log.error(e); } }
  }
  draw(g) {
    if (this.current && this.current.draw) this.current.draw(g);
    if (this.transitioning) {
      const p = this.transitionT / this.transitionDur;
      const alpha = p < 0.5 ? p * 2 : (1 - p) * 2;
      g.globalAlpha = alpha;
      g.fillStyle = G0;
      g.fillRect(0, 0, CANVAS_W, CANVAS_H);
      g.globalAlpha = 1;
    }
  }
}

function throttle(fn, delay) {
  let lastCall = 0;
  return function (...args) {
    const t = now();
    if (t - lastCall >= delay) {
      lastCall = t;
      return fn.apply(this, args);
    }
  };
}

function debounce(fn, delay) {
  let timer = null;
  return function (...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => { fn.apply(this, args); timer = null; }, delay);
  };
}
