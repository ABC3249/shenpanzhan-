/* ══════════════════════════════════════════════════════════════
   【FINAL-7 · 技能 5 · 重力锤 v2 · 蓝魂切换演出完整重做】
   三段式开启：冲击(震屏+白闪+顿帧) → 过渡(地面线渐显+虚线预言+下落拖尾)
              → 稳定(落地 trauma + 地面抖动 + 扬尘)
   重力锤专属：额外 trauma / 地面线抖动 / 灵魂上弹 / 蓝色冲击粒子
   ══════════════════════════════════════════════════════════════ */
const GRAVITY_TUNE = {
  switchOnDur: 0.6,
  switchOffDur: 0.5,
  groundFadeIn: 0.4,
  trailPredictDur: 0.3,
  groundY: BOX_BOTTOM - 10,
  groundColor: "#7ec8ff",
  switchTrauma: 0.6,
  switchFlash: 0.15,
  switchHitstop: 0.05,
  landTrauma: 0.3,
  landHitstop: 0.03,
  hammerShake: 0.15,
  groundShakeAmp: 4,
  soulBounceVy: -160,
};

const GravityState = {
  active: false,
  mode: null,
  t: 0,
  groundAlpha: 0,
  groundShake: 0,
  soulWasOnGround: false,
  soulStartX: 0,
  soulStartY: 0,
  onComplete: null,
  soulTrail: [],

  startGravity() {
    if (this.active) return;
    this.active = true;
    this.mode = "on";
    this.t = 0;
    this.soulStartX = Soul.x;
    this.soulStartY = Soul.y;
    this.soulWasOnGround = false;
    this.soulTrail = [];

    Soul.setMode("blue");

    ScreenFX.triggerHitstop(GRAVITY_TUNE.switchHitstop);
    ScreenFX.addTrauma(GRAVITY_TUNE.switchTrauma);
    ScreenFX.triggerFlash(GRAVITY_TUNE.switchFlash, GRAVITY_TUNE.groundColor);

    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const r = 60 + Math.random() * 20;
      const px = Soul.x + Math.cos(a) * r;
      const py = Soul.y + Math.sin(a) * r;
      spawnParticle({
        x: px, y: py,
        vx: (Soul.x - px) * 4,
        vy: (Soul.y - py) * 4,
        maxLife: 0.45,
        size: 3,
        color: GRAVITY_TUNE.groundColor,
        type: "star"
      });
    }
  },

  endGravity() {
    if (this.active) return;
    this.active = true;
    this.mode = "off";
    this.t = 0;
    this.groundShake = 1.5;
    ScreenFX.addTrauma(0.2);
  },

  update(dt) {
    /* 下落拖尾记录 */
    if (Soul.mode === "blue" && !Soul.onGround) {
      this.soulTrail.push({
        x: Soul.x, y: Soul.y,
        life: 0.35, maxLife: 0.35
      });
      if (this.soulTrail.length > 12) this.soulTrail.shift();
    }

    for (let i = this.soulTrail.length - 1; i >= 0; i--) {
      this.soulTrail[i].life -= dt;
      if (this.soulTrail[i].life <= 0) this.soulTrail.splice(i, 1);
    }

    if (this.groundShake > 0) {
      this.groundShake = Math.max(0, this.groundShake - dt * 6);
    }

    /* 落地边沿检测 */
    if (Soul.mode === "blue" && Soul.onGround && !this.soulWasOnGround) {
      this._onSoulLand();
    }
    this.soulWasOnGround = Soul.mode === "blue" && Soul.onGround;

    if (!this.active) {
      if (Soul.mode === "blue") {
        this.groundAlpha = Math.min(1, this.groundAlpha + dt * 4);
      }
      return;
    }

    this.t += dt;

    if (this.mode === "on") {
      const T = GRAVITY_TUNE;
      this.groundAlpha = clamp(this.t / T.groundFadeIn, 0, 1);
      if (this.t >= T.switchOnDur) {
        this.active = false;
        this.mode = null;
      }
    } else if (this.mode === "off") {
      const T = GRAVITY_TUNE;
      const p = this.t / T.switchOffDur;
      this.groundAlpha = Math.max(0, 1 - p);
      if (p >= 1) {
        this.active = false;
        this.mode = null;
        this.groundAlpha = 0;
        Soul.setMode("red");
      }
    }
  },

  _onSoulLand() {
    ScreenFX.addTrauma(GRAVITY_TUNE.landTrauma);
    ScreenFX.triggerHitstop(GRAVITY_TUNE.landHitstop);
    this.groundShake = GRAVITY_TUNE.groundShakeAmp;

    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        spawnParticle({
          x: Soul.x + side * 6,
          y: Soul.y + 6,
          vx: side * (60 + Math.random() * 100),
          vy: -30 - Math.random() * 80,
          maxLife: 0.4,
          size: 2,
          color: GRAVITY_TUNE.groundColor,
          gravity: 220,
          type: "block"
        });
      }
    }
  },

  drawSoulTrail(g) {
    if (this.soulTrail.length === 0) return;
    for (const t of this.soulTrail) {
      const a = (t.life / t.maxLife) * 0.6;
      g.globalAlpha = a;
      g.fillStyle = GRAVITY_TUNE.groundColor;
      g.fillRect(t.x - 3, t.y - 3, 6, 6);
    }
    g.globalAlpha = 1;
  },

drawGround(g) { return; }   /* 清理：FINAL-69 起整体移除，空壳防误调用 */,

  drawPredictTrail(g) {
    if (!this.active || this.mode !== "on") return;
    if (this.t > GRAVITY_TUNE.trailPredictDur) return;

    const p = 1 - this.t / GRAVITY_TUNE.trailPredictDur;
    g.save();
    g.globalAlpha = p * 0.7;
    g.strokeStyle = GRAVITY_TUNE.groundColor;
    g.lineWidth = 2;
    g.setLineDash([5, 4]);
    g.beginPath();
    g.moveTo(this.soulStartX, this.soulStartY);
    g.lineTo(this.soulStartX, GRAVITY_TUNE.groundY);
    g.stroke();
    g.setLineDash([]);

    g.fillStyle = GRAVITY_TUNE.groundColor;
    g.fillRect(this.soulStartX - 8, GRAVITY_TUNE.groundY - 3, 16, 3);
    g.restore();
    g.globalAlpha = 1;
  },
};

/* onTick 覆盖：104 开演出，4 锤错峰到 [110,134,158,182]，200 关闭 */

/* ══════════════════════════════════════════════════════════════
   【FINAL-8 · 技能编排 v2 · 递进式难度 + 组合 + 轮次名】
   ⚠ RoundSkillDriver 是 const 绑定，只能改属性不能整体重赋值。
   旧 _origBeginV28/_origDrvUpdateV28 委托链被本层方法覆盖后为死代码。
   ══════════════════════════════════════════════════════════════ */
const ROUND_PLAN = {
  1:  { primary: "sword",   secondary: null,      delay: 0,   intensity: 1.0 },
  2:  { primary: "sword",   secondary: null,      delay: 0,   intensity: 1.2 },
  3:  { primary: "orb",     secondary: "sword",   delay: 30,  intensity: 1.0 },
  4:  { primary: "ring",    secondary: "orb",     delay: 20,  intensity: 1.1 },
  5:  { primary: "hammer",  secondary: "ring",    delay: 15,  intensity: 1.2 },
  6:  { primary: "orb",     secondary: "ring",    delay: 0,   intensity: 1.3 },
  7:  { primary: "hammer",  secondary: "gravity", delay: 40,  intensity: 1.4 },
  8:  { primary: "sword",   secondary: "orb",     delay: 10,  intensity: 1.5 },
};
const CHAOS_PLAN = { primary: "orb", secondary: "ring", delay: 0, intensity: 1.6 };

const ROUND_NAMES = {
  1: "序 · 剑",
  2: "续 · 剑",
  3: "星 · 光球",
  4: "环 · 光圈",
  5: "锤 · 战锤",
  6: "星环 · 光球+光圈",
  7: "终 · 战锤+重力",
  8: "混沌",
  9:  "混沌 · 回响",
  10: "混沌 · 沉沦",
  11: "混沌 · 终局",
};

const SKILL_MAP = {
  sword:   () => SwordSkill,
  orb:     () => OrbSkill,
  ring:    () => RingSkill,
  hammer:  () => HammerSkill,
  gravity: () => GravityHammerSkill,
};

/* ── ① 各技能 onTick 改"相对 tick" ── */
SwordSkill.onTick = function (relTick) {
  if (!this.active) return;
  while (this.schedIdx < SWORD_COMBO_V25.length &&
         SWORD_COMBO_V25[this.schedIdx] <= relTick) {
    this.launchStrike(relTick);
    this.schedIdx++;
    this.strikeIndex = this.schedIdx;
  }
};

OrbSkill.onTick = function (relTick) {
  if (!this.active) return;
  if (relTick < 0 || relTick > 400) return;

  const intensity = (RoundSkillDriver.plan && RoundSkillDriver.plan.intensity) || 1.0;
  const maxOrbs = Math.min(12, Math.round(8 * intensity));

  if (relTick % 12 === 0 && this.orbIndex < maxOrbs) {
    this.launchOrb(this.orbIndex);
    this.orbIndex++;
  }
};

/* OrbSkill.update 同步 intensity（否则第 8 轮 12 颗发到 8 颗就被判结束） */
OrbSkill.update = function (dt) {
  if (!this.active) return;
  let any = false;
  for (const b of this.orbs) if (b.alive) { any = true; break; }
  const intensity = (RoundSkillDriver.plan && RoundSkillDriver.plan.intensity) || 1.0;
  const maxOrbs = Math.min(12, Math.round(8 * intensity));
  if (!any && this.orbIndex >= maxOrbs) {
    this.active = false;
    Log.log("技能二·光球 结束");
  }
};

RingSkill.onTick = function (relTick) {
  if (!this.active) return;
  if (relTick < 0 || relTick > 200) return;

  if (relTick % 5 === 0 && this.ringIndex < 5) {
    this.launchRing(this.ringIndex);
    this.ringIndex++;
  }
};

HammerSkill.onTick = function (relTick) {
  if (!this.active) return;
  if (relTick < 0 || relTick > 200) return;

  const fires = [0, 13, 21, 28];
  for (let i = 0; i < fires.length; i++) {
    if (relTick === fires[i] && this.hammerIndex === i) {
      this.launchHammer(i);
      this.hammerIndex++;
    }
  }
};

/* 重力锤：相对 tick（覆盖 FINAL-7 的绝对 tick 版） */
GravityHammerSkill.onTick = function (relTick) {
  if (!this.active) return;
  if (relTick < 0 || relTick > 400) return;

  if (relTick === 4 && !this.gravityOn) {
    this.gravityOn = true;
    GravityState.startGravity();
  }

  const fires = [10, 22, 29, 35];
  for (let i = 0; i < fires.length; i++) {
    if (relTick === fires[i] && this.hammerIndex === i) {
      this.launchHammer(i);
      this.hammerIndex++;
    }
  }

  if (relTick >= 190 && this.gravityOn) {
    this.gravityOn = false;
    GravityState.endGravity();
  }
};

/* ── ② RoundSkillDriver：属性级重写（const 对象） ── */
RoundSkillDriver.round = 0;
RoundSkillDriver.plan = null;
RoundSkillDriver.skills = [];
RoundSkillDriver.lastTick = -1;
RoundSkillDriver.completeAt = null;
RoundSkillDriver.ROUND_END_PAUSE = 0.8;

RoundSkillDriver.beginRound = function (round) {
  this.endRound();
  this.round = round;
  this.plan = ROUND_PLAN[round] || CHAOS_PLAN;

  const pInst = SKILL_MAP[this.plan.primary]();
  this.skills.push({ key: this.plan.primary, inst: pInst, relTick: -1, fired: false });

  if (this.plan.secondary) {
    const sInst = SKILL_MAP[this.plan.secondary]();
    this.skills.push({
      key: this.plan.secondary,
      inst: sInst,
      relTick: -(this.plan.delay || 0),
      fired: false,
    });
  }

  for (const s of this.skills) {
    if (s.inst && s.inst.start) s.inst.start();
  }

  this.lastTick = MusicPlayer.getTickRaw();
  this.completeAt = null;

  RoundTitle.show(ROUND_NAMES[round] || "…");

  Log.log("轮次 " + round + " 启动：主=" + this.plan.primary +
          (this.plan.secondary ? " 副=" + this.plan.secondary : ""));
};

RoundSkillDriver.update = function () {
  if (this.skills.length === 0) return;

  const cur = MusicPlayer.getTickRaw();
  while (this.lastTick < cur) {
    this.lastTick++;
    for (const s of this.skills) {
      s.relTick++;
      if (s.relTick >= 0) {
        s.inst.onTick(s.relTick);
      }
    }
  }

  if (this.completeAt == null) {
    let allInactive = true;
    for (const s of this.skills) {
      if (s.inst && s.inst.active) { allInactive = false; break; }
    }
    if (allInactive) {
      this.completeAt = MusicPlayer.getTickRaw();
    }
  }
};

RoundSkillDriver.isRoundComplete = function () {
  if (this.completeAt == null) return false;

/* ── SFX 扩展 ── */
SFX._noise = function (dur, vol, cutoff) {
  const ctx = MusicPlayer.ctx;
  if (!ctx || ctx.state !== "running") return;
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = cutoff || 900;
  const g = ctx.createGain();
  g.gain.value = vol;
  src.connect(f).connect(g).connect(ctx.destination);
  src.start();
};

SFX.sword = function () {
  /* 挥剑：高频下滑"唰" */
  this._beep(1900, 280, 0.09, "sawtooth", 0.10);

/* ══════════════════════════════════════════════════════════════
   【FINAL-11 · 挥砍 v4 · 像素印戳线】
   弃用 stroke/roundCap：任意角度斜线用"沿路径盖方块笔刷"渲染，
   边缘锐利、端点方正，符合像素风。所有 fillRect 坐标取整防 AA 模糊。
   判定/帧时间轴/伤害逻辑一行未动，只换渲染。
   ══════════════════════════════════════════════════════════════ */

/* 像素印戳直线：方形笔刷沿路径每 1px 盖一格，像素网格对齐 */
function stampLine(g, x1, y1, x2, y2, w, color, alpha) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 0.5 || alpha <= 0.01) return;
  const steps = Math.ceil(len);
  const hw = Math.max(1, Math.round(w));
  const off = hw / 2;
  g.globalAlpha = Math.min(1, alpha);
  g.fillStyle = color;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    g.fillRect(Math.round(x1 + dx * t - off), Math.round(y1 + dy * t - off), hw, hw);
  }
  g.globalAlpha = 1;
}

drawSwordWarning = function (g, b, t) {
  const freeze = b.freezeT != null ? b.freezeT : 0.18;
  const tracking = b.age < SWORD_TRACK_TIME;
  const freezing = !tracking && b.age < SWORD_TRACK_TIME + freeze;

  const seg = swordLineClip(b.warnX, b.warnY);
  if (seg) {
    const p0 = swordLinePoint(seg, seg.t0);
    const p1 = swordLinePoint(seg, seg.t1);

    if (tracking) {
      /* 追踪线：2px 像素印戳 + 5 颗流动粒子（坐标取整） */
      stampLine(g, p0.x, p0.y, p1.x, p1.y, 2, G3, 0.75);

      const span = seg.t1 - seg.t0;
      g.fillStyle = G3;
      for (let i = 0; i < 5; i++) {
        const flow = seg.t0 + ((t * 180 + i * span / 5) % span);
        const pf = swordLinePoint(seg, flow);
        g.globalAlpha = 0.85 - i * 0.12;
        g.fillRect(Math.round(pf.x) - 2, Math.round(pf.y) - 2, 4, 4);
      }
      g.globalAlpha = 1;
    } else if (freezing) {
      /* 冻结线：加粗像素印戳 + 慢脉动 */
      const pulse = 0.7 + 0.3 * Math.sin(t * 15);
      stampLine(g, p0.x, p0.y, p1.x, p1.y, 2.5 + pulse * 1.5, G3, 0.9 * pulse);

      /* 吸收光（取整） */
      const absorb = fract(t * 1.5);
      const startT = seg.t0 + (seg.t1 - seg.t0) * absorb * 0.5;
      const endT = seg.t1 - (seg.t1 - seg.t0) * absorb * 0.5;
      const pa = swordLinePoint(seg, startT);
      const pb = swordLinePoint(seg, endT);
      g.globalAlpha = 0.8;
      g.fillStyle = G3;
      g.fillRect(Math.round(pa.x) - 2, Math.round(pa.y) - 2, 5, 5);
      g.fillRect(Math.round(pb.x) - 2, Math.round(pb.y) - 2, 5, 5);
      g.globalAlpha = 1;
    }
  }
  g.globalAlpha = 1;

  /* 警告标记（全取整） */
  const wx = Math.round(clamp(b.warnX, BOX_X + 10, BOX_RIGHT - 10));
  const wy = Math.round(clamp(b.warnY - 26, BOX_Y + 10, BOX_BOTTOM - 20));
  const blinkFreq = freeze <= 0.1 ? 20 : 10;
  const showMark = tracking ||
    (freezing && Math.floor((b.age - SWORD_TRACK_TIME) * blinkFreq) % 2 === 0);

  if (showMark) {
    const pulse = tracking ? (0.65 + 0.35 * Math.sin(t * 8)) : 0.95;
    g.globalAlpha = pulse;
    g.fillStyle = G3;
    for (let dy = 0; dy < 6; dy++) {
      const w = 1 + dy;
      g.fillRect(wx - w, wy + dy, w * 2, 1);
    }
    g.fillRect(wx, wy + 7, 1, 3);
    g.fillRect(wx, wy + 11, 1, 1);
    g.globalAlpha = 1;
  }

  /* 锁定圈（取整） */
  if (tracking) {
    const rr = 14;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t * 3;
      const px = Math.round(b.warnX + Math.cos(a) * rr);
      const py = Math.round(b.warnY + Math.sin(a) * rr);
      g.globalAlpha = 0.7;
      g.fillStyle = G3;
      g.fillRect(px - 1, py - 1, 3, 3);
    }
    g.globalAlpha = 1;
  }
};

drawSwordStrike = function (g, b, t) {
  const frame = b.strikeFrame;
  const localT = b.strikeLocalT || 0;
  const seg = swordLineThrough(b.warnX, b.warnY);
  if (!seg) return;

  g.save();
  g.beginPath();
  g.rect(BOX_X, BOX_Y, BOX_W, BOX_H);
  g.clip();

  const playerDist = Math.hypot(b.warnX - SWORD_CORE.x, b.warnY - SWORD_CORE.y);
  const playerT = clamp(playerDist, seg.t0 + 2, seg.t1);

  let tipT;
  if (frame <= 2) {
    tipT = seg.t0 + (playerT - seg.t0) * (frame + localT) / 3;
  } else {
    tipT = playerT;
  }

  const p0 = swordLinePoint(seg, seg.t0);
  const p1 = swordLinePoint(seg, tipT);
  const hitPt = swordLinePoint(seg, playerT);

  /* 帧 0-2：像素印戳光柱（方形端点，G2 外晕 + G3 主带） */
  if (frame <= 2) {
    const wMap = [4, 8, 14];
    const w = wMap[frame] || 4;
    stampLine(g, p0.x, p0.y, p1.x, p1.y, w * 2, G2, 0.45);
    stampLine(g, p0.x, p0.y, p1.x, p1.y, w, G3, 0.9);

    /* 刀尖光斑（圆发光保留，像素游戏里作"光"的层次） */
    g.globalAlpha = 0.9;
    g.fillStyle = G3;
    g.beginPath();
    g.arc(Math.round(p1.x), Math.round(p1.y), 4 + frame * 3, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = 1;
  }

  /* 帧 3：爆点定格 */
  if (frame === 3) {
    const fade = 1 - localT * 0.4;
    const R = 24 + localT * 10;
    const hpx = Math.round(hitPt.x), hpy = Math.round(hitPt.y);

    g.globalAlpha = fade;
    g.fillStyle = G3;
    g.beginPath();
    g.arc(hpx, hpy, R, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = G3;
    g.beginPath();
    g.arc(hpx, hpy, R * 0.55, 0, Math.PI * 2);
    g.fill();

    /* 十字爆（取整，方正） */
    g.globalAlpha = fade * 0.9;
    g.fillRect(hpx - 40, hpy - 2, 80, 4);
    g.fillRect(hpx - 2, hpy - 40, 4, 80);

    /* 径向火花（取整） */
    g.globalAlpha = fade * 0.85;
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const r = 18 + localT * 24;
      g.fillRect(Math.round(hpx + Math.cos(ang) * r) - 2,
                 Math.round(hpy + Math.sin(ang) * r) - 2, 4, 4);
    }

    /* 光柱重绘（像素印戳，宽 8） */
    stampLine(g, p0.x, p0.y, hitPt.x, hitPt.y, 8, G3, fade * 0.7);
  }

  /* 帧 4：余晖 */
  if (frame === 4) {
    const fadeOut = 1 - localT;
    const R = 34 + localT * 20;
    g.globalAlpha = Math.max(0, fadeOut * 0.6);
    g.fillStyle = G3;
    g.beginPath();
    g.arc(Math.round(hitPt.x), Math.round(hitPt.y), R, 0, Math.PI * 2);
    g.fill();

    stampLine(g, p0.x, p0.y, hitPt.x, hitPt.y, 5, G3, Math.max(0, fadeOut * 0.5));
  }

  g.restore();
  g.globalAlpha = 1;
};

/* 干净描边直线：butt 方端点 + G2 底层光晕 + G3 主带（半透叠层） */
function cleanLine(g, x1, y1, x2, y2, w, mainAlpha) {
  g.lineCap = "butt";   /* 方形端点：像素风的干净切角，无圆头 */

  /* 底层：宽 2.2× 的 G2 柔光 */
  g.globalAlpha = mainAlpha * 0.30;
  g.strokeStyle = G2;
  g.lineWidth = w * 2.2;
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.stroke();

  /* 主带：G3 半透 */
  g.globalAlpha = mainAlpha;
  g.strokeStyle = G3;
  g.lineWidth = w;
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.stroke();

  g.globalAlpha = 1;
}

    g.globalAlpha = pulse;

    queueSwordPoly([
      { x: p1.x + dx * tipLen, y: p1.y + dy * tipLen },   // 刃尖
      { x: bx + px * tipHalf, y: by + py * tipHalf },     // 基底左
      { x: bx - px * tipHalf, y: by - py * tipHalf }      // 基底右
    ], G3, aMap[frame]);
  }

  if (frame === 3) {
    const fade = 1 - localT * 0.4;
    const R = 24 + localT * 10;
    const hpx = Math.round(hitPt.x), hpy = Math.round(hitPt.y);

    g.globalAlpha = fade;
    g.fillStyle = G3;
    g.beginPath();
    g.arc(hpx, hpy, R, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = G3;
    g.beginPath();
    g.arc(hpx, hpy, R * 0.55, 0, Math.PI * 2);
    g.fill();

    g.globalAlpha = fade * 0.9;
    g.fillRect(hpx - 40, hpy - 2, 80, 4);
    g.fillRect(hpx - 2, hpy - 40, 4, 80);

    g.globalAlpha = fade * 0.85;
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const r = 18 + localT * 24;
      g.fillRect(Math.round(hpx + Math.cos(ang) * r) - 2,
                 Math.round(hpy + Math.sin(ang) * r) - 2, 4, 4);
    }

    queueSwordLine(p0.x, p0.y, hitPt.x, hitPt.y, 9, G3, fade * 0.7);
    queueSwordLine(p0.x, p0.y, hitPt.x, hitPt.y, 20, G2, fade * 0.2);
  }

  if (frame === 4) {
    const fadeOut = 1 - localT;
    const R = 34 + localT * 20;
    g.globalAlpha = Math.max(0, fadeOut * 0.6);
    g.fillStyle = G3;
    g.beginPath();
    g.arc(Math.round(hitPt.x), Math.round(hitPt.y), R, 0, Math.PI * 2);
    g.fill();

    queueSwordLine(p0.x, p0.y, hitPt.x, hitPt.y, 6, G3, Math.max(0, fadeOut * 0.5));
  }

  g.restore();
  g.globalAlpha = 1;
};

/* ══════════════════════════════════════════════════════════════
   【FINAL-16 · 挥砍 v9 · 窗框十字爆】
   帧 3 爆点的十字由 80px 短棒 → 贯穿战斗框的窗框十字：
   横臂 BOX_X→BOX_RIGHT / 纵臂 BOX_Y→BOX_BOTTOM，宽 4px，
   alpha 0.8 起步，0.1s 内线性淡至 0。走设备分辨率叠加层。
   判定/时序/圆闪/火花零改动。
   ══════════════════════════════════════════════════════════════ */
drawSwordStrike = function (g, b, t) {
  const frame = b.strikeFrame;
  const localT = b.strikeLocalT || 0;
  const seg = swordLineThrough(b.warnX, b.warnY);
  if (!seg) return;

  g.save();
  g.beginPath();
  g.rect(BOX_X, BOX_Y, BOX_W, BOX_H);
  g.clip();

  const playerDist = Math.hypot(b.warnX - SWORD_CORE.x, b.warnY - SWORD_CORE.y);
  const playerT = clamp(playerDist, seg.t0 + 2, seg.t1);

  let tipT;
  if (frame <= 2) {
    tipT = seg.t0 + (playerT - seg.t0) * (frame + localT) / 3;
  } else {
    tipT = playerT;
  }

  const p0 = swordLinePoint(seg, seg.t0);
  const p1 = swordLinePoint(seg, tipT);
  const hitPt = swordLinePoint(seg, playerT);

  if (frame <= 2) {
    const wMap = [5, 9, 15];
    const aMap = [0.75, 0.85, 0.95];
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, wMap[frame] * 2.2, G2, aMap[frame] * 0.3);
    queueSwordLine(p0.x, p0.y, p1.x, p1.y, wMap[frame], G3, aMap[frame]);

    /* 剑尖三角（FINAL-15） */
    const tipLen = 8 + frame * 4;
    const tipHalf = 2.5 + frame;
    let dx = p1.x - p0.x, dy = p1.y - p0.y;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const px = -dy, py = dx;
    const bx = p1.x - dx * 3, by = p1.y - dy * 3;
    queueSwordPoly([
      { x: p1.x + dx * tipLen, y: p1.y + dy * tipLen },
      { x: bx + px * tipHalf, y: by + py * tipHalf },
      { x: bx - px * tipHalf, y: by - py * tipHalf }
    ], G3, aMap[frame]);
  }

  if (frame === 3) {
    const fade = 1 - localT * 0.4;
    const R = 24 + localT * 10;
    const hpx = Math.round(hitPt.x), hpy = Math.round(hitPt.y);

    g.globalAlpha = fade;
    g.fillStyle = G3;
    g.beginPath();
    g.arc(hpx, hpy, R, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = G3;
    g.beginPath();
    g.arc(hpx, hpy, R * 0.55, 0, Math.PI * 2);
    g.fill();

    /* ★ 窗框十字：贯穿战斗框，0.8 → 0 用时 0.1s
       加粗版：8px 白芯 + 16px G2 柔光底（v10） */
    const crossA = 0.8 * (1 - Math.min(localT / 0.1, 1));
    queueSwordLine(BOX_X, hitPt.y, BOX_RIGHT, hitPt.y, 16, G2, crossA * 0.35);
    queueSwordLine(BOX_X, hitPt.y, BOX_RIGHT, hitPt.y, 8, G3, crossA);
    queueSwordLine(hitPt.x, BOX_Y, hitPt.x, BOX_BOTTOM, 16, G2, crossA * 0.35);
    queueSwordLine(hitPt.x, BOX_Y, hitPt.x, BOX_BOTTOM, 8, G3, crossA);

    g.globalAlpha = fade * 0.85;
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const r = 18 + localT * 24;
      g.fillRect(Math.round(hpx + Math.cos(ang) * r) - 2,
                 Math.round(hpy + Math.sin(ang) * r) - 2, 4, 4);
    }

    queueSwordLine(p0.x, p0.y, hitPt.x, hitPt.y, 9, G3, fade * 0.7);
    queueSwordLine(p0.x, p0.y, hitPt.x, hitPt.y, 20, G2, fade * 0.2);
  }

  if (frame === 4) {
    const fadeOut = 1 - localT;
    const R = 34 + localT * 20;
    g.globalAlpha = Math.max(0, fadeOut * 0.6);
    g.fillStyle = G3;
    g.beginPath();
    g.arc(Math.round(hitPt.x), Math.round(hitPt.y), R, 0, Math.PI * 2);
    g.fill();

    queueSwordLine(p0.x, p0.y, hitPt.x, hitPt.y, 6, G3, Math.max(0, fadeOut * 0.5));
  }

  g.restore();
  g.globalAlpha = 1;
};

/* ══════════════════════════════════════════════════════════════
   二、星星预渲染（72 帧 × 92×92）
   ══════════════════════════════════════════════════════════════ */
const CorridorStarSprite = {
  frames: [],
  SZ: 92, C: 46,
  built: false,

  build() {
    if (this.built) return;
    this.built = true;
    const SZ = this.SZ, C = this.C;

    const makePts = (ang, off) => {
      const p = [];
      for (let k = 0; k < 8; k++) {
        const a = ang - Math.PI / 2 + k * Math.PI / 4;
        const r = (k % 2 === 0) ? CF.STAR.RO : CF.STAR.RI;
        const ox = off ? Math.cos(ang - Math.PI / 2) * off : 0;
        const oy = off ? Math.sin(ang - Math.PI / 2) * off : 0;
        p.push([C + ox + r * Math.cos(a), C + oy + r * Math.sin(a)]);
      }
      return p;
    };

    const pnpoly = (pts, x, y) => {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1];
        const xj = pts[j][0], yj = pts[j][1];
        if (((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    };

    for (let f = 0; f < 72; f++) {
      const ang = f / 72 * 2 * Math.PI;
      const cv = document.createElement("canvas");
      cv.width = SZ;
      cv.height = SZ;
      const g = cv.getContext("2d");
      g.imageSmoothingEnabled = false;

      const img = g.createImageData(SZ, SZ);
      const out = makePts(ang, 0);
      const inn = makePts(ang, CF.STAR.OFF);
      const outerRing = makePts(ang, 0).map(([x, y]) => {
        /* 外环点（用于 G2 描边） */
        return [x, y];
      });

      for (let y = 0; y < SZ; y++) {
        for (let x = 0; x < SZ; x++) {
          const px = x + 0.5, py = y + 0.5;
          let v = pnpoly(out, px, py) ? 255 : 0;
          if (v && pnpoly(inn, px, py)) v = 0;
          const i = (y * SZ + x) * 4;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);

      /* 中心核（白） */
      g.fillStyle = "#ffffff";
      g.fillRect(C - 2, C - 2, 4, 4);

      /* 中心亮点（G3） */
      g.fillRect(C - 1, C - 1, 2, 2);

      this.frames.push(cv);
    }

    Log.log("[Corridor] 星星预渲染完成：" + this.frames.length + " 帧");
  },

  get(angle) {
    const f = ((Math.floor(angle / (2 * Math.PI) * 72)) % 72 + 72) % 72;
    return this.frames[f];
  },
};

/* ══════════════════════════════════════════════════════════════
   三、动态波浪（走廊中心 + 上下星位）
   ══════════════════════════════════════════════════════════════ */
const CorridorWave = {
  currentO: CF.LEVELS["舒展"].O,
  targetO: CF.LEVELS["舒展"].O,
  currentLevel: "舒展",
  prevLevel: "舒展",
  levelChangeT: -1,
  levelChangeAlpha: 0,

  reset() {
    this.currentO = CF.LEVELS["舒展"].O;
    this.targetO = CF.LEVELS["舒展"].O;
    this.currentLevel = "舒展";
    this.prevLevel = "舒展";
    this.levelChangeT = -1;
    this.levelChangeAlpha = 0;
  },

  getSegment(t) {
    for (const seg of CF.TIMELINE) {
      if (t >= seg.t0 && t < seg.t1) return seg;
    }
    return CF.TIMELINE[CF.TIMELINE.length - 1];
  },

  update(dt, t) {
    const seg = this.getSegment(t);
    if (seg.level !== this.currentLevel) {
      this.prevLevel = this.currentLevel;
      this.currentLevel = seg.level;
      this.levelChangeT = 0;
      /* 段切换触发全屏白闪 */
      ScreenFX.addTrauma(0.15);
    }
    this.targetO = CF.LEVELS[seg.level].O;

    /* 指数平滑 */
    const k = 1 - Math.exp(-CF.O_SMOOTH_RATE / 30 * dt);
    this.currentO += (this.targetO - this.currentO) * k;

    /* 切换提示动画 */
    if (this.levelChangeT >= 0) {
      this.levelChangeT += dt;
      if (this.levelChangeT > 1.2) {
        this.levelChangeT = -1;
      }
    }
  },

  getO() { return this.currentO; },
  getGap() { return this.currentO * 2 - CF.STAR.RO * 2; },

  /* 波浪中心 */
  centerY(x) {
    return CF.FRAME.y + CF.FRAME.h / 2 +
      CF.STAR.WAVE_AMP *
      Math.sin((x - CF.FRAME.x) * 2 * Math.PI / CF.STAR.WAVE_LEN);
  },

  topY(x, O) { return this.centerY(x) - O; },
  bottomY(x, O) { return this.centerY(x) + O; },
};

    const t = i / steps;
    spawnParticle({
      x: lerp(fromX, this.x, t) + (Math.random() - 0.5) * 10,
      y: lerp(fromY, this.y, t) + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 40,
      vy: (Math.random() - 0.5) * 40,
      maxLife: 0.5, size: 2,
      color: "#7ec8ff", gravity: 0, type: "dot",
    });
  }
};

/* ══════════════════════════════════════════════════════════════
   五、平台系统（5 种类型）
   ══════════════════════════════════════════════════════════════ */
const CorridorPlatformSystem = {
  list: [],
  spawnTimer: 0,
  elapsed: 0,
  nextId: 0,

  reset() {
    this.list = [];
    this.spawnTimer = 0;
    this.elapsed = 0;
    this.nextId = 0;
  },

  _getSegment() {
    return CorridorWave.getSegment(this.elapsed);
  },

  spawn() {
    const seg = this._getSegment();
    const lv = CF.LEVELS[seg.level];
    const type = seg.types[Math.floor(Math.random() * seg.types.length)];
    const layer = seg.layers[Math.floor(Math.random() * seg.layers.length)];
    const y = CF.Y_LEVELS[layer];

    const w = lv.width;
    const p = {
      id: this.nextId++,
      x: CF.FRAME.x + CF.FRAME.w + 20,
      y, w, h: CF.PLAT.H,
      type, layer,
      alive: true,
      /* 入场动画 */
      enterT: 0,
      /* 碎裂 */
      crumbleT: 0,
      crumbling: false,
      /* 移动 */
      baseY: y,
      moveT: Math.random() * CF.PLAT.MOVING_PERIOD,
      /* 弹跳 */
      bounceCd: 0,
      /* 单向 */
      oneWayPass: false,
      /* 视觉 */
      pulse: 0,
    };
    this.list.push(p);
  },

  update(dt) {
    this.elapsed += dt;
    const seg = this._getSegment();
    const period = CF.LEVELS[seg.level].period;

    this.spawnTimer += dt;
    if (this.spawnTimer >= period) {
      this.spawnTimer -= period;
      this.spawn();
    }

    for (const p of this.list) {
      p.x -= CF.PLAT.SPEED * dt;
      p.enterT = Math.min(p.enterT + dt, 1);
      if (p.bounceCd > 0) p.bounceCd -= dt;

      /* 移动 */
      if (p.type === "moving") {
        p.moveT += dt;
        p.y = p.baseY +
          Math.sin(p.moveT * 2 * Math.PI / CF.PLAT.MOVING_PERIOD) *
          CF.PLAT.MOVING_AMP;
      }

      /* 碎裂 */
      if (p.type === "crumble" && p.crumbling) {
        p.crumbleT += dt;
        if (p.crumbleT >= CF.PLAT.CRUMBLE_DELAY) {
          /* 碎裂粒子 */
          for (let i = 0; i < 10; i++) {
            spawnParticle({
              x: p.x + Math.random() * p.w,
              y: p.y + 3,
              vx: (Math.random() - 0.5) * 120,
              vy: 80 + Math.random() * 80,
              maxLife: 0.6, size: 2,
              color: G3, gravity: 260, type: "block",
              rotSpeed: (Math.random() - 0.5) * 10,
            });
          }
          spawnShockwave({
            x: p.x + p.w / 2, y: p.y + 3,
            r0: 4, maxR: 30, maxLife: 0.3,
            color: G2, width: 2,
          });
          p.alive = false;
        }
      }

      if (p.x + p.w < CF.FRAME.x - 40) p.alive = false;
    }
    this.list = this.list.filter(p => p.alive);
  },

  /* 落地检测 */
  findLanding(soulX, prevFeet, nextFeet) {
    let best = null;
    for (const p of this.list) {
      if (soulX + SOUL_RADIUS < p.x) continue;
      if (soulX - SOUL_RADIUS > p.x + p.w) continue;
      if (prevFeet <= p.y && nextFeet >= p.y) {
        if (!best || p.y < best.y) best = p;
      }
    }
    return best;
  },

  findRightmost() {
    let best = null;
    for (const p of this.list) {
      if (p.x + p.w < CF.FRAME.x) continue;
      if (p.x > CF.FRAME.x + CF.FRAME.w) continue;
      if (!best || p.x > best.x) best = p;
    }
    return best;
  },

  /* ── 绘制 ── */
  draw(g) {
    const t = GAME.totalTime;

    for (const p of this.list) {
      const px = Math.round(p.x);
      const py = Math.round(p.y);
      const pw = Math.round(p.w);
      const enter = Ease.cubicOut(p.enterT);

      /* 入场淡入 */
      g.globalAlpha = enter;

      /* 悬浮阴影（下方 3px 的暗线） */
      g.fillStyle = G1;
      g.fillRect(px + 4, py + p.h + 2, pw - 8, 2);

      if (p.type === "crumble" && p.crumblinb) {
        /* 未用 */
      }

      if (p.type === "crumble" && p.crumbling) {
        /* 碎裂预警 */
        const p2 = p.crumbleT / CF.PLAT.CRUMBLE_DELAY;
        const shake = Math.sin(p.crumbleT * 60) * 1.2 * p2;
        const sx = px + Math.round(shake);
        const sy = py + Math.round(Math.sin(p.crumbleT * 80) * 0.5 * p2);
        const flash = Math.floor(p.crumbleT * 24) % 2 === 0;
        g.fillStyle = flash ? "#ff3333" : G3;
        g.fillRect(sx, sy, pw, p.h);
        g.fillStyle = G0;
        g.fillRect(sx, sy + p.h - 1, pw, 1);
        /* 裂纹闪烁 */
        g.fillStyle = flash ? "#ffffff" : "#000000";
        for (let i = 0; i < 4; i++) {
          const cx = sx + 10 + i * (pw - 20) / 3;
          g.fillRect(cx, sy + 1, 1, 4);
        }
      } else if (p.type === "bounce") {
        /* 弹跳平台 */
        const pulse = 0.5 + 0.5 * Math.sin(t * 8);
        /* 底 */
        g.fillStyle = G3;
        g.fillRect(px, py, pw, p.h);
        g.fillStyle = G3;
        g.fillRect(px, py - 1, pw, 1);
        /* 中心圆点脉冲 */
        const cx = px + Math.floor(pw / 2);
        g.fillStyle = G0;
        g.fillRect(cx - 3, py + 2, 6, 2);
        g.globalAlpha = enter * pulse;
        g.fillStyle = "#7ec8ff";
        g.fillRect(cx - 2, py + 2, 4, 2);
        g.globalAlpha = enter;
        /* 上方气流 */
        const flow = Math.floor(t * 20) % 3;
        g.fillStyle = "#7ec8ff";
        for (let i = 0; i < 3; i++) {
          const fx = cx - 8 + i * 8;
          const fy = py - 4 - flow * 2 - i;
          g.globalAlpha = enter * (0.6 - i * 0.15);
          g.fillRect(fx, fy, 2, 2);
        }
        g.globalAlpha = enter;
      } else if (p.type === "moving") {
        /* 移动平台 */
        g.fillStyle = G3;
        g.fillRect(px, py, pw, p.h);
        g.fillRect(px, py - 1, pw, 1);
        /* 两端箭头 */
        g.fillStyle = G2;
        g.fillRect(px + 2, py + 2, 2, 2);
        g.fillRect(px + pw - 4, py + 2, 2, 2);
        /* 悬浮虚线 */
        g.strokeStyle = G2;
        g.lineWidth = 1;
        g.setLineDash([3, 4]);
        g.beginPath();
        g.moveTo(px + 4, p.baseY + p.h / 2);
        g.lineTo(px + pw - 4, p.baseY + p.h / 2);
        g.stroke();
        g.setLineDash([]);
      } else if (p.type === "once") {
        /* 单向平台：半透 + 向上箭头 */
        g.globalAlpha = enter * 0.7;
        g.fillStyle = G3;
        g.fillRect(px, py, pw, p.h);
        g.globalAlpha = enter;
        g.fillStyle = G3;
        g.fillRect(px, py - 1, pw, 1);
        /* 中心向上箭头 */
        const cx = px + Math.floor(pw / 2);
        const pulse = 0.6 + 0.4 * Math.sin(t * 6);
        g.globalAlpha = enter * pulse;
        g.fillStyle = "#7ec8ff";
        g.fillRect(cx - 2, py + 1, 4, 4);
        g.globalAlpha = enter;
      } else {
        /* 实心 */
        g.fillStyle = G3;
        g.fillRect(px, py, pw, p.h);
        g.fillRect(px, py - 1, pw, 1);
      }

      /* 端点装饰 */
      g.fillStyle = G2;
      g.fillRect(px, py, 2, p.h);
      g.fillRect(px + pw - 2, py, 2, p.h);

      /* 底边黑缝 */
      g.fillStyle = G0;
      g.fillRect(px, py + p.h - 1, pw, 1);

      g.globalAlpha = 1;
    }
  },
};

/* ══════════════════════════════════════════════════════════════
   六、走廊输入管理（摇杆 + 跳跃）
   ══════════════════════════════════════════════════════════════ */
const CorridorInput = {
  joystickId: null,
  jumpId: null,
  jumpHeld: false,
  justPressed: false,
  justReleased: false,
  _prevHeld: false,
  _installed: false,

  init() {
    if (this._installed) return;
    this._installed = true;

    const el = Canvas.el;

    el.addEventListener("touchstart", (e) => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      for (const t of e.changedTouches) {
        const p = Canvas.toLocal(t.clientX, t.clientY);
        if (p.x < CANVAS_W / 2) {
          if (this.joystickId === null && !Joystick.active) {
            this.joystickId = t.identifier;
            Joystick.start(p.x, p.y, t.identifier);
          }
        } else {
          if (this.jumpId === null) {
            this.jumpId = t.identifier;
            this.jumpHeld = true;
          }
        }
      }
      e.preventDefault();
    }, { passive: false });

    el.addEventListener("touchmove", (e) => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      for (const t of e.changedTouches) {
        if (t.identifier === this.joystickId) {
          const p = Canvas.toLocal(t.clientX, t.clientY);
          Joystick.move(p.x, p.y);
        }
      }
      e.preventDefault();
    }, { passive: false });

    const endTouch = (e) => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      for (const t of e.changedTouches) {
        if (t.identifier === this.joystickId) {
          Joystick.end();
          this.joystickId = null;
        } else if (t.identifier === this.jumpId) {
          this.jumpHeld = false;
          this.jumpId = null;
        }
      }
    };
    el.addEventListener("touchend", endTouch, { passive: false });
    el.addEventListener("touchcancel", endTouch, { passive: false });

    /* 鼠标 */
    el.addEventListener("mousedown", (e) => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      const p = Canvas.toLocal(e.clientX, e.clientY);
      if (p.x < CANVAS_W / 2) {
        if (!Joystick.active) {
          this.joystickId = "mouse";
          Joystick.start(p.x, p.y, "mouse");
        }
      } else {
        if (this.jumpId === null) {
          this.jumpId = "mouse";
          this.jumpHeld = true;
        }
      }
    });
    el.addEventListener("mousemove", (e) => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      if (this.joystickId === "mouse") {
        const p = Canvas.toLocal(e.clientX, e.clientY);
        Joystick.move(p.x, p.y);
      }
    });
    el.addEventListener("mouseup", () => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      if (this.joystickId === "mouse") {
        Joystick.end();
        this.joystickId = null;
      }
      if (this.jumpId === "mouse") {
        this.jumpHeld = false;
        this.jumpId = null;
      }
    });

    /* 键盘 */
    Keyboard.onPress((k) => {
      if (BattleSM.phase !== BattlePhase.CORRIDOR) return;
      if (k === " " || k === "arrowup" || k === "w" || k === "enter") {
        this.jumpHeld = true;
      }
    });
    Keyboard.onRelease((k) => {
      if (k === " " || k === "arrowup" || k === "w" || k === "enter") {
        this.jumpHeld = false;
      }
    });

    Log.log("[CorridorInput] 已装载");
  },

  update() {
    this.justPressed = this.jumpHeld && !this._prevHeld;
    this.justReleased = !this.jumpHeld && this._prevHeld;
    this._prevHeld = this.jumpHeld;
  },

  reset() {
    Joystick.end();
    this.joystickId = null;
    this.jumpId = null;
    this.jumpHeld = false;
    this.justPressed = false;
    this.justReleased = false;
    this._prevHeld = false;
  },
};

/* ══════════════════════════════════════════════════════════════
   七、视觉特效层
   ══════════════════════════════════════════════════════════════ */
const CorridorFX = {
  /* 背景星尘 */
  stars: [],
  trail: [],
  enterAlpha: 0,
  exitAlpha: 0,

  reset() {
    this.stars = [];
    for (let i = 0; i < 32; i++) {
      this.stars.push({
        x: Math.random() * CANVAS_W,
        y: Math.random() * CANVAS_H,
        size: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2,
        speed: 10 + Math.random() * 20,
      });
    }
    this.trail = [];
    this.enterAlpha = 0;
    this.exitAlpha = 0;
  },

  update(dt) {
    /* 背景星尘飘动 */
    for (const s of this.stars) {
      s.x -= s.speed * dt * 0.4;
      if (s.x < -10) {
        s.x = CANVAS_W + 10;
        s.y = Math.random() * CANVAS_H;
      }
      s.phase += dt * 2;
    }

    /* 灵魂拖尾 */
    if (Soul.mode === "blue" && BattleSM.phase === BattlePhase.CORRIDOR) {
      this.trail.push({
        x: Soul.x, y: Soul.y,
        life: 0.35, maxLife: 0.35,
        onGround: Soul.onGround,
      });
      if (this.trail.length > 20) this.trail.shift();
    }

    for (let i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].life -= dt;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }

    /* 进出场淡化 */
    if (CorridorPhase.active) {
      this.enterAlpha = Math.min(1, this.enterAlpha + dt * 1.5);
    }
  },

  /* 背景（在走廊绘制最开始调用） */
  drawBackground(g) {
    const F = CF.FRAME;

    /* 黑底 */
    g.fillStyle = G0;
    g.fillRect(F.x, F.y, F.w, F.h);

    /* 远景星尘（框内） */
    g.save();
    g.beginPath();
    g.rect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
    g.clip();

    for (const s of this.stars) {
      if (s.x < F.x || s.x > F.x + F.w) continue;
      if (s.y < F.y || s.y > F.y + F.h) continue;
      const a = 0.15 + 0.15 * Math.sin(s.phase);
      g.globalAlpha = a * this.enterAlpha;
      g.fillStyle = G2;
      g.fillRect(Math.round(s.x), Math.round(s.y), s.size, s.size);
    }
    g.globalAlpha = 1;
    g.restore();
  },

  /* 灵魂拖尾（在灵魂之前调用） */
  drawSoulTrail(g) {
    for (const t of this.trail) {
      const a = (t.life / t.maxLife);
      g.globalAlpha = a * 0.5;
      g.fillStyle = "#7ec8ff";
      const size = t.onGround ? 3 : 5;
      g.fillRect(Math.round(t.x - size / 2), Math.round(t.y - size / 2), size, size);
    }
    g.globalAlpha = 1;
  },

  /* 前景层（段位切换提示 + 极压警示） */
  drawForeground(g, elapsed) {
    const F = CF.FRAME;
    const lv = CorridorWave.currentLevel;

    /* 极压警示：屏幕边缘红闪 */
    if (lv === "极压") {
      const pulse = 0.3 + 0.3 * Math.sin(GAME.totalTime * 8);
      g.globalAlpha = pulse;
      g.strokeStyle = "#ff3333";
      g.lineWidth = 3;
      g.strokeRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
      g.globalAlpha = 1;
    }
  },
};

/* ══════════════════════════════════════════════════════════════
   八、阶段管理
   ══════════════════════════════════════════════════════════════ */
const CorridorPhase = {
  active: false,
  elapsed: 0,
  onComplete: null,
  curSegName: "",

  start(onComplete) {
    this.active = true;
    this.elapsed = 0;
    this.onComplete = onComplete || null;

    CorridorStarSprite.build();
    CorridorPlatformSystem.reset();
    CorridorWave.reset();
    CorridorInput.reset();
    CorridorFX.reset();

    Soul.setMode("blue");
    Soul.x = CF.FRAME.x + 40;
    Soul.y = CF.Y_LEVELS[0] - SOUL_RADIUS - 40;
    Soul.vx = 0;
    Soul.vy = 0;
    Soul.onGround = false;
    Soul.invuln = 1.5;

    Log.log("[Corridor] 第九阶段启动，时长 " + CF.DURATION + "s");
  },

  update(dt) {
    if (!this.active) return;

    CorridorInput.update();
    CorridorWave.update(dt, this.elapsed);
    this.elapsed += dt;

    /* 段名切换提示 */
    const seg = CorridorWave.getSegment(this.elapsed);
    if (seg.name !== this.curSegName) {
      this.curSegName = seg.name;
    }

    CorridorPlatformSystem.update(dt);
    Soul.updateCorridor(dt);
    CorridorFX.update(dt);

    if (this.elapsed >= CF.DURATION) {
      this.end();
    }
  },

  end() {
    this.active = false;
    CorridorInput.reset();
    Soul.setMode("red");
    Log.log("[Corridor] 结束");
    if (this.onComplete) {
      const cb = this.onComplete;
      this.onComplete = null;
      cb();
    }
  },

  /* 主绘制 */
  draw(g) {
    if (!this.active) return;
    const F = CF.FRAME;
    const t = GAME.totalTime;
    const elapsed = this.elapsed;
    const O = CorridorWave.getO();

    /* 背景星尘 */
    CorridorFX.drawBackground(g);

    /* 裁剪到窗框 */
    g.save();
    g.beginPath();
    g.rect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
    g.clip();

    /* 波浪网格（暗） */
    g.globalAlpha = 0.08;
    g.strokeStyle = G2;
    g.lineWidth = 1;
    g.setLineDash([4, 8]);
    g.beginPath();
    for (let x = F.x; x < F.x + F.w; x += 6) {
      const cy = CorridorWave.centerY(x);
      if (x === F.x) g.moveTo(x, cy);
      else g.lineTo(x, cy);
    }
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha = 1;

    /* 上排星 */
    const ang = t / CF.STAR.ROT_PERIOD * 2 * Math.PI;
    const sprite = CorridorStarSprite.get(ang);
    const scroll = (t * CF.STAR.SCROLL) % CF.STAR.SPACING;
    const firstX = F.x - CF.STAR.SPACING + scroll;

    for (let sx = firstX; sx < F.x + F.w + CF.STAR.SIZE; sx += CF.STAR.SPACING) {
      const topY = CorridorWave.topY(sx, O);
      const botY = CorridorWave.bottomY(sx, O);

      /* 上排星星（含外发光） */
      const topHalo = g.createRadialGradient(sx, topY, 0, sx, topY, CF.STAR.HALO_RADIUS);
      topHalo.addColorStop(0, "rgba(255,255,255,0.15)");
      topHalo.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = topHalo;
      g.fillRect(sx - CF.STAR.HALO_RADIUS, topY - CF.STAR.HALO_RADIUS,
                 CF.STAR.HALO_RADIUS * 2, CF.STAR.HALO_RADIUS * 2);

      g.drawImage(sprite,
                  Math.round(sx - CF.STAR.SIZE / 2),
                  Math.round(topY - CF.STAR.SIZE / 2));

      /* 下排星星 */
      const botHalo = g.createRadialGradient(sx, botY, 0, sx, botY, CF.STAR.HALO_RADIUS);
      botHalo.addColorStop(0, "rgba(255,255,255,0.15)");
      botHalo.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = botHalo;
      g.fillRect(sx - CF.STAR.HALO_RADIUS, botY - CF.STAR.HALO_RADIUS,
                 CF.STAR.HALO_RADIUS * 2, CF.STAR.HALO_RADIUS * 2);

      g.drawImage(sprite,
                  Math.round(sx - CF.STAR.SIZE / 2),
                  Math.round(botY - CF.STAR.SIZE / 2));
    }

    /* 平台 */
    CorridorPlatformSystem.draw(g);

    /* 灵魂拖尾 */
    CorridorFX.drawSoulTrail(g);

    /* 灵魂 */
    drawSoul(g, Soul.x, Soul.y, t, {
      invuln: Soul.invuln,
      mode: "blue",
      onGround: Soul.onGround,
      scale: 1,
    });

    /* 前景特效 */
    CorridorFX.drawForeground(g, elapsed);

    g.restore();

    /* 边框 */
    g.strokeStyle = G3;
    g.lineWidth = 4;
    g.strokeRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);

    /* 进度条（分段式） */
    this.drawProgress(g);

    /* 段名提示 */
    this.drawSegmentName(g);

    /* 间隙指示器 */
    this.drawGapIndicator(g);

    /* 前 3 秒操作提示 */
    this.drawIntroHints(g);
  },

  drawProgress(g) {
    const F = CF.FRAME;
    const barY = F.y + F.h + 10;
    const barW = F.w;
    const barH = 4;

    /* 底 */
    g.fillStyle = G1;
    g.fillRect(F.x, barY, barW, barH);

    /* 分段：每段一个高亮块 */
    for (const seg of CF.TIMELINE) {
      const x0 = F.x + barW * (seg.t0 / CF.DURATION);
      const x1 = F.x + barW * (seg.t1 / CF.DURATION);
      const w = x1 - x0;
      const current = this.elapsed >= seg.t0 && this.elapsed < seg.t1;
      const passed = this.elapsed >= seg.t1;

      if (current) {
        const p = (this.elapsed - seg.t0) / (seg.t1 - seg.t0);
        g.fillStyle = G3;
        g.fillRect(x0, barY, w * p, barH);
      } else if (passed) {
        g.fillStyle = G3;
        g.fillRect(x0, barY, w, barH);
      }

      /* 分隔 */
      g.fillStyle = G0;
      g.fillRect(x1 - 1, barY - 2, 2, barH + 4);
    }

    /* 顶部三角指示器 */
    const progress = clamp(this.elapsed / CF.DURATION, 0, 1);
    const px = F.x + barW * progress;
    g.fillStyle = G3;
    g.beginPath();
    g.moveTo(px - 4, barY - 4);
    g.lineTo(px + 4, barY - 4);
    g.lineTo(px, barY - 1);
    g.closePath();
    g.fill();
  },

  drawSegmentName(g) {
    if (!this.curSegName) return;
    const F = CF.FRAME;
    const seg = CorridorWave.getSegment(this.elapsed);
    if (!seg) return;

    const tIn = this.elapsed - seg.t0;
    let alpha = 1;
    if (tIn < 0.3) alpha = tIn / 0.3;
    else if (this.elapsed > seg.t1 - 0.3) alpha = (seg.t1 - this.elapsed) / 0.3;
    alpha = clamp(alpha, 0, 1);

    if (alpha <= 0.01) return;

    g.save();
    g.globalAlpha = alpha * 0.9;
    g.font = "bold 14px 'Courier New', monospace";
    g.textAlign = "left";
    g.textBaseline = "middle";

    const tx = F.x + 8;
    const ty = F.y - 14;

    /* 文字（描边） */
    g.fillStyle = G0;
    g.fillText(this.curSegName, tx + 1, ty + 1);
    g.fillStyle = G3;
    g.fillText(this.curSegName, tx, ty);

    /* 装饰线 */
    g.fillStyle = G2;
    g.fillRect(tx, ty + 10, g.measureText(this.curSegName).width + 6, 1);

    g.restore();
  },

  drawGapIndicator(g) {
    const F = CF.FRAME;
    const gap = CorridorWave.getGap();
    const lv = CorridorWave.currentLevel;
    const danger = gap < 100;
    const critical = gap < 80;

    g.save();
    g.font = "bold 11px 'Courier New', monospace";
    g.textAlign = "right";
    g.textBaseline = "middle";

    const tx = F.x + F.w - 8;
    const ty = F.y - 14;

    /* 文字 */
    const color = critical ? "#ff3333" : (danger ? "#ffaa33" : G3);
    g.fillStyle = G0;
    g.fillText(gap.toFixed(0) + "px", tx + 1, ty + 1);
    g.fillStyle = color;
    g.fillText(gap.toFixed(0) + "px", tx, ty);

    /* 档位名称 */
    g.textAlign = "right";
    g.fillStyle = G2;
    g.font = "10px 'Courier New', monospace";
    g.fillText(lv, tx, ty + 14);

    /* 脉冲点（危险时） */
    if (critical) {
      const pulse = 0.5 + 0.5 * Math.sin(GAME.totalTime * 12);
      g.globalAlpha = pulse;
      g.fillStyle = "#ff3333";
      g.fillRect(tx + 4, ty - 3, 3, 3);
      g.globalAlpha = 1;
    }

    g.restore();
  },

  drawIntroHints(g) {
    if (this.elapsed > 3.5) return;
    const alpha = clamp(1 - (this.elapsed - 2.5) / 1.0, 0, 1) *
                  clamp(this.elapsed / 0.5, 0, 1);
    if (alpha <= 0.01) return;

    const F = CF.FRAME;
    g.save();
    g.globalAlpha = alpha * 0.8;

    g.font = "bold 13px 'Courier New', monospace";
    g.textAlign = "center";
    g.textBaseline = "middle";

    const midY = F.y + F.h / 2;
    const lx = F.x + F.w * 0.25;
    const rx = F.x + F.w * 0.75;

    /* 左：移动 */
    g.fillStyle = G0;
    g.fillText("◀ 移动 ▶", lx + 1, midY - 30 + 1);
    g.fillStyle = G3;
    g.fillText("◀ 移动 ▶", lx, midY - 30);

    /* 摇杆示意 */
    g.strokeStyle = G3;
    g.lineWidth = 2;
    g.beginPath();
    g.arc(lx, midY + 10, 16, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = G3;
    g.beginPath();
    g.arc(lx, midY + 10, 6, 0, Math.PI * 2);
    g.fill();

    /* 右：跳跃 */
    g.fillStyle = G0;
    g.fillText("跳跃", rx + 1, midY - 30 + 1);
    g.fillStyle = G3;
    g.fillText("跳跃", rx, midY - 30);

    /* 跳跃示意 */
    g.strokeStyle = G3;
    g.lineWidth = 2;
    g.beginPath();
    g.arc(rx, midY + 10, 16, 0, Math.PI * 2);
    g.stroke();
    /* 上箭头 */
    g.fillStyle = G3;
    g.beginPath();
    g.moveTo(rx, midY + 2);
    g.lineTo(rx - 6, midY + 12);
    g.lineTo(rx + 6, midY + 12);
    g.closePath();
    g.fill();

    g.restore();
  },
};

  const seg = this._getSegment();

  const minL = Math.min.apply(null, seg.layers);
  const maxL = Math.max.apply(null, seg.layers);
  let layer = this._prevLayer + [-1, 0, 1][Math.floor(Math.random() * 3)];
  layer = clamp(layer, minL, maxL);
  if (seg.layers.indexOf(layer) < 0) {
    layer = seg.layers.indexOf(this._prevLayer) >= 0 ? this._prevLayer : minL;
  }
  this._prevLayer = layer;
  const y = CF.Y_LEVELS[layer];

  const w = lv.width;

/* ══════════════════════════════════════════════════════════════
   【FINAL-20 · 圣光走廊 · 粗糙根治】（用户诊断补丁验收版）
   ① 星星精灵透明底（原实现星形外像素 alpha=255 → 92×92 黑方块灾难）
   ② 判定半径 34→38（贴视觉）
   ③ 触发条件 === 8 → >= 8
   ④ 容错：坠落伤害 20→8 / 复位无敌 1.2→1.5
   ⑤ 星星滚动 55→70，与平台同速系
   ⑥ 移动手感：加速度 1400 / 最高速 165 / 摩擦，替代瞬移式 187
   ══════════════════════════════════════════════════════════════ */
CorridorStarSprite.build = function () {
  if (this.built) return;
  this.built = true;
  const SZ = this.SZ, C = this.C;

  const makePts = (ang, off) => {
    const p = [];
    for (let k = 0; k < 8; k++) {
      const a = ang - Math.PI / 2 + k * Math.PI / 4;
      const r = (k % 2 === 0) ? CF.STAR.RO : CF.STAR.RI;
      const ox = off ? Math.cos(ang - Math.PI / 2) * off : 0;
      const oy = off ? Math.sin(ang - Math.PI / 2) * off : 0;
      p.push([C + ox + r * Math.cos(a), C + oy + r * Math.sin(a)]);
    }
    return p;
  };

  const pnpoly = (pts, x, y) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1];
      const xj = pts[j][0], yj = pts[j][1];
      if (((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  };

  for (let f = 0; f < 72; f++) {
    const ang = f / 72 * 2 * Math.PI;
    const cv = document.createElement("canvas");
    cv.width = SZ; cv.height = SZ;
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;

    const img = g.createImageData(SZ, SZ);
    const outer = makePts(ang, 0);
    const inner = makePts(ang, CF.STAR.OFF);

    for (let y = 0; y < SZ; y++) {
      for (let x = 0; x < SZ; x++) {
        if (!pnpoly(outer, x + 0.5, y + 0.5)) continue;  /* 星外 → 保持透明 */
        if (pnpoly(inner, x + 0.5, y + 0.5)) continue;   /* 内芯 → 透明 */
        const i = (y * SZ + x) * 4;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
        img.data[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);

    g.fillStyle = "#ffffff";
    g.fillRect(C - 2, C - 2, 4, 4);

    this.frames.push(cv);
  }

  Log.log("[Corridor] 星星预渲染：72 帧（透明底修复）");
};

/* ② 判定半径与视觉一致 */

/* ─── ① 星星精灵升级：G2 描边 ─────────────────────────────── */
CorridorStarSprite.build = function () {
  if (this.built) return;
  this.built = true;
  const SZ = this.SZ, C = this.C;

  const makePts = (ang, off, scale) => {
    scale = scale || 1;
    const p = [];
    for (let k = 0; k < 8; k++) {
      const a = ang - Math.PI / 2 + k * Math.PI / 4;
      const r = ((k % 2 === 0) ? CF.STAR.RO : CF.STAR.RI) * scale;
      const ox = off ? Math.cos(ang - Math.PI / 2) * off : 0;
      const oy = off ? Math.sin(ang - Math.PI / 2) * off : 0;
      p.push([C + ox + r * Math.cos(a), C + oy + r * Math.sin(a)]);
    }
    return p;
  };

  const pnpoly = (pts, x, y) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1];
      const xj = pts[j][0], yj = pts[j][1];
      if (((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  };

  for (let f = 0; f < 72; f++) {
    const ang = f / 72 * 2 * Math.PI;
    const cv = document.createElement("canvas");
    cv.width = SZ; cv.height = SZ;
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;

    const img = g.createImageData(SZ, SZ);
    const outerBig = makePts(ang, 0, 1.025);   /* 外描边 */
    const outer    = makePts(ang, 0, 1);
    const inner    = makePts(ang, CF.STAR.OFF);

    for (let y = 0; y < SZ; y++) {
      for (let x = 0; x < SZ; x++) {
        const px = x + 0.5, py = y + 0.5;
        const i = (y * SZ + x) * 4;
        let R = 0, Gv = 0, B = 0, A = 0;
        if (pnpoly(outer, px, py) && !pnpoly(inner, px, py)) {
          R = Gv = B = 255; A = 255;              /* G3 主体 */
        } else if (pnpoly(outerBig, px, py) && !pnpoly(outer, px, py)) {
          R = Gv = B = 170; A = 255;              /* G2 描边 */
        }
        img.data[i] = R; img.data[i+1] = Gv;
        img.data[i+2] = B; img.data[i+3] = A;
      }
    }
    g.putImageData(img, 0, 0);

    /* 中心核：G3 3×3 + G0 1×1 内芯（机械感） */
    g.fillStyle = "#ffffff";
    g.fillRect(C - 2, C - 2, 4, 4);
    g.fillStyle = "#000000";
    g.fillRect(C, C, 1, 1);

    this.frames.push(cv);
  }
  Log.log("[Corridor] 星星精灵：72 帧 / G2 描边 / 中心机械核");
};

/* ─── ② 星星 Halo 预渲染 ──────────────────────────────────── */
const CorridorHaloSprite = {
  canvas: null, r: 0,
  build() {
    if (this.canvas) return;
    const r = CF.STAR.HALO_RADIUS;
    const sz = r * 2;
    const cv = document.createElement("canvas");
    cv.width = sz; cv.height = sz;
    const g = cv.getContext("2d");
    const grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0,    "rgba(255,255,255,0.22)");
    grd.addColorStop(0.35, "rgba(255,255,255,0.10)");
    grd.addColorStop(0.7,  "rgba(255,255,255,0.03)");
    grd.addColorStop(1,    "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, sz, sz);
    this.canvas = cv;
    this.r = r;
  }
};

/* ─── ⑥ 灵魂拖尾渐变 ──────────────────────────────────────── */
CorridorFX.drawSoulTrail = function (g) {
  const n = this.trail.length;
  for (let i = 0; i < n; i++) {
    const t = this.trail[i];
    const lifeA = t.life / t.maxLife;
    const idxN = i / n;
    /* 越新的拖尾越大越亮，越老越小越暗 */
    const size = Math.round(1 + idxN * 4.5);
    const alpha = lifeA * (0.15 + idxN * 0.55);
    g.globalAlpha = alpha;
    g.fillStyle = "#7ec8ff";
    g.fillRect(
      Math.round(t.x - size / 2),
      Math.round(t.y - size / 2),
      size, size
    );
  }
  /* 核心亮点点缀（最新一帧） */
  if (n > 0) {
    const last = this.trail[n - 1];
    g.globalAlpha = 0.7 * (last.life / last.maxLife);
    g.fillStyle = "#ffffff";
    g.fillRect(Math.round(last.x) - 1, Math.round(last.y) - 1, 2, 2);
  }
  g.globalAlpha = 1;
};

/* ─── ⑦ 平台视觉分级（5 种类型 5 种签名）──────────────────── */
CorridorPlatformSystem.draw = function (g) {
  const t = GAME.totalTime;

  for (const p of this.list) {
    const px = Math.round(p.x);
    const py = Math.round(p.y);
    const pw = Math.round(p.w);
    const ph = p.h;
    const enter = Ease.cubicOut(p.enterT);
    g.globalAlpha = enter;

    /* 悬浮阴影（下 3px 暗线 + 下 5px 极淡扩散） */
    g.fillStyle = G1;
    g.fillRect(px + 4, py + ph + 2, pw - 8, 2);
    g.globalAlpha = enter * 0.4;
    g.fillRect(px + 8, py + ph + 4, pw - 16, 1);
    g.globalAlpha = enter;

    /* ── 主体按类型分化 ── */
    if (p.type === "crumble" && p.crumbling) {
      /* 碎裂预警：橘红脉冲 + 裂纹 */
      const p2 = p.crumbleT / CF.PLAT.CRUMBLE_DELAY;
      const shake = Math.sin(p.crumbleT * 60) * 1.4 * p2;
      const sx = px + Math.round(shake);
      const sy = py + Math.round(Math.sin(p.crumbleT * 80) * 0.6 * p2);
      const flash = Math.floor(p.crumbleT * 24) % 2 === 0;

      g.fillStyle = flash ? "#ff3333" : G3;
      g.fillRect(sx, sy, pw, ph);
      /* 裂纹闪白 */
      if (flash) {
        g.fillStyle = "#ffffff";
        for (let i = 0; i < 5; i++) {
          const cx = sx + 10 + i * (pw - 20) / 4;
          g.fillRect(cx, sy + 1, 1, 4);
        }
      }
      /* 底部边缘暗 */
      g.fillStyle = G0;
      g.fillRect(sx, sy + ph - 1, pw, 1);

    } else if (p.type === "crumble") {
      /* 未碎裂：G3 主体 + G2 斜条纹警示 */
      g.fillStyle = G3;
      g.fillRect(px, py, pw, ph);
      g.fillStyle = G2;
      for (let x = 0; x < pw; x += 6) {
        g.fillRect(px + x, py + 1, 3, ph - 2);
      }
      g.fillStyle = G0;
      g.fillRect(px, py + ph - 1, pw, 1);

    } else if (p.type === "bounce") {
      /* 弹跳：G3 主体 + 中心蓝脉冲 + 上方气流 */
      g.fillStyle = G3;
      g.fillRect(px, py, pw, ph);
      const cx = px + Math.floor(pw / 2);
      g.fillStyle = G0;
      g.fillRect(cx - 3, py + 2, 6, 2);
      const pulse = 0.5 + 0.5 * Math.sin(t * 8);
      g.globalAlpha = enter * pulse;
      g.fillStyle = "#7ec8ff";
      g.fillRect(cx - 2, py + 2, 4, 2);
      g.globalAlpha = enter;

      /* 上方气流（3 柱） */
      const flow = Math.floor(t * 24) % 3;
      for (let i = 0; i < 3; i++) {
        const fx = cx - 8 + i * 8;
        const fy = py - 5 - flow * 2 - i;
        g.globalAlpha = enter * (0.7 - i * 0.18);
        g.fillStyle = "#7ec8ff";
        g.fillRect(fx, fy, 2, 3);
      }
      g.globalAlpha = enter;
      g.fillStyle = G0;
      g.fillRect(px, py + ph - 1, pw, 1);

    } else if (p.type === "moving") {
      /* 移动：G3 主体 + 两端箭头 + 悬浮虚线 */
      g.fillStyle = G3;
      g.fillRect(px, py, pw, ph);
      g.fillStyle = G2;
      /* 左箭头 */
      g.fillRect(px + 3, py + 2, 1, 2);
      g.fillRect(px + 4, py + 1, 1, 4);
      g.fillRect(px + 5, py + 2, 1, 2);
      /* 右箭头 */
      g.fillRect(px + pw - 4, py + 2, 1, 2);
      g.fillRect(px + pw - 5, py + 1, 1, 4);
      g.fillRect(px + pw - 6, py + 2, 1, 2);
      g.fillStyle = G0;
      g.fillRect(px, py + ph - 1, pw, 1);

      /* 悬浮虚线（对称中心） */
      g.strokeStyle = G2;
      g.lineWidth = 1;
      g.setLineDash([3, 4]);
      g.beginPath();
      g.moveTo(px + 4, p.baseY + ph / 2);
      g.lineTo(px + pw - 4, p.baseY + ph / 2);
      g.stroke();
      g.setLineDash([]);

    } else if (p.type === "once") {
      /* 单向：半透 + 中心向上箭头 + 顶部高亮 */
      g.globalAlpha = enter * 0.7;
      g.fillStyle = G3;
      g.fillRect(px, py, pw, ph);
      g.globalAlpha = enter;
      g.fillStyle = G3;
      g.fillRect(px, py - 1, pw, 2);   /* 顶亮 */

      const cx = px + Math.floor(pw / 2);
      const pulse = 0.6 + 0.4 * Math.sin(t * 6);
      g.globalAlpha = enter * pulse;
      g.fillStyle = "#7ec8ff";
      /* 向上三角 */
      g.fillRect(cx - 2, py + 2, 4, 1);
      g.fillRect(cx - 1, py + 1, 2, 1);
      g.fillRect(cx, py, 1, 1);
      g.globalAlpha = enter;
      g.fillStyle = G0;
      g.fillRect(px, py + ph - 1, pw, 1);

    } else {
      /* 实心：G3 主体 + 顶部高光线 */
      g.fillStyle = G3;
      g.fillRect(px, py, pw, ph);
      g.fillStyle = G0;
      g.fillRect(px, py + ph - 1, pw, 1);
    }

    /* ── 共同：顶部 G3 高光（1px，all 类型都有）── */
    g.fillStyle = G3;
    g.fillRect(px, py - 1, pw, 1);

    /* ── 共同：两端铆钉（G2 2px 短柱）── */
    g.fillStyle = G2;
    g.fillRect(px, py, 2, ph);
    g.fillRect(px + pw - 2, py, 2, ph);

    g.globalAlpha = 1;
  }
};

/* ─── ③ + ⑧ 走廊绘制重写：halo 预渲染 + 危险预警 + 边框装饰 + combo ── */
CorridorPhase.draw = function (g) {
  if (!this.active) return;
  const F = CF.FRAME;
  const t = GAME.totalTime;
  const elapsed = this.elapsed;
  const O = CorridorWave.getO();

  /* 背景星尘 */
  CorridorFX.drawBackground(g);

  /* 裁剪到窗框 */
  g.save();
  g.beginPath();
  g.rect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
  g.clip();

  /* 波浪网格（暗） */
  g.globalAlpha = 0.08;
  g.strokeStyle = G2;
  g.lineWidth = 1;
  g.setLineDash([4, 8]);
  g.beginPath();
  for (let x = F.x; x < F.x + F.w; x += 6) {
    const cy = CorridorWave.centerY(x);
    if (x === F.x) g.moveTo(x, cy);
    else g.lineTo(x, cy);
  }
  g.stroke();
  g.setLineDash([]);
  g.globalAlpha = 1;

  /* 星星绘制 */
  CorridorHaloSprite.build();
  const ang = t / CF.STAR.ROT_PERIOD * 2 * Math.PI;
  const sprite = CorridorStarSprite.get(ang);
  const scroll = (t * CF.STAR.SCROLL) % CF.STAR.SPACING;
  const firstX = F.x - CF.STAR.SPACING + scroll;
  const hr = CorridorHaloSprite.r;
  const dangerRange = CF.STAR.HIT_RADIUS + 42;

  for (let sx = firstX; sx < F.x + F.w + CF.STAR.SIZE; sx += CF.STAR.SPACING) {
    const topY = CorridorWave.topY(sx, O);
    const botY = CorridorWave.bottomY(sx, O);

    /* 危险度计算（每颗星独立） */
    const dTop = Math.hypot(Soul.x - sx, Soul.y - topY);
    const dBot = Math.hypot(Soul.x - sx, Soul.y - botY);
    const dangerTop = dTop < dangerRange ? 1 - dTop / dangerRange : 0;
    const dangerBot = dBot < dangerRange ? 1 - dBot / dangerRange : 0;

    /* Halo（预渲染位图，drawImage 极快） */
    g.drawImage(CorridorHaloSprite.canvas,
      Math.round(sx - hr), Math.round(topY - hr));
    g.drawImage(CorridorHaloSprite.canvas,
      Math.round(sx - hr), Math.round(botY - hr));

    /* 危险时红晕叠加 */
    if (dangerTop > 0.05) {
      g.globalAlpha = dangerTop * 0.5;
      g.fillStyle = "#ff2a3a";
      g.beginPath();
      g.arc(sx, topY, CF.STAR.RO * 0.9, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 1;
    }
    if (dangerBot > 0.05) {
      g.globalAlpha = dangerBot * 0.5;
      g.fillStyle = "#ff2a3a";
      g.beginPath();
      g.arc(sx, botY, CF.STAR.RO * 0.9, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 1;
    }

    /* 星星精灵（离屏 92×92 透明图，最近邻贴） */
    g.drawImage(sprite,
      Math.round(sx - CF.STAR.SIZE / 2),
      Math.round(topY - CF.STAR.SIZE / 2));
    g.drawImage(sprite,
      Math.round(sx - CF.STAR.SIZE / 2),
      Math.round(botY - CF.STAR.SIZE / 2));
  }

  /* 平台 */
  CorridorPlatformSystem.draw(g);

  /* 灵魂拖尾 */
  CorridorFX.drawSoulTrail(g);

  /* 灵魂 */
  drawSoul(g, Soul.x, Soul.y, t, {
    invuln: Soul.invuln,
    mode: "blue",
    onGround: Soul.onGround,
    scale: 1
  });

  /* 前景特效（极压警示边框） */
  CorridorFX.drawForeground(g, elapsed);

  g.restore();

  /* ── 边框 + 装饰（最外层，不裁剪）── */
  g.strokeStyle = G3;
  g.lineWidth = 4;
  g.strokeRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);
  this._drawFrameDecor(g);

  /* ── 连续无伤 combo 光晕 ── */
  this._drawPerfectAura(g);

  /* 进度条 */
  this.drawProgress(g);

  /* 段名提示 */
  this.drawSegmentName(g);

  /* 间隙指示器 */
  this.drawGapIndicator(g);

  /* 前 3 秒操作提示 */
  this.drawIntroHints(g);
};

/* ─── ⑧ 边框机械装饰 ──────────────────────────────────────── */
CorridorPhase._drawFrameDecor = function (g) {
  const F = CF.FRAME;

  /* 四角 8×8 L 形铆钉 */
  g.fillStyle = G3;
  const corners = [
    [F.x + 4,        F.y + 4,         1,  1],
    [F.x + F.w - 12, F.y + 4,        -1,  1],
    [F.x + 4,        F.y + F.h - 12,  1, -1],
    [F.x + F.w - 12, F.y + F.h - 12, -1, -1]
  ];
  for (const [cx, cy, sx, sy] of corners) {
    for (let i = 0; i < 8; i++) {
      g.fillRect(cx + sx * i, cy, 1, 1);
      g.fillRect(cx, cy + sy * i, 1, 1);
    }
    /* L 折角内点 */
    g.fillRect(cx + sx * 3, cy + sy * 3, 2, 2);
  }

  /* 上下边缘刻度 */
  g.fillStyle = G2;
  for (let x = F.x + 24; x < F.x + F.w - 24; x += 40) {
    g.fillRect(x, F.y + 2, 1, 4);
    g.fillRect(x, F.y + F.h - 6, 1, 4);
  }

  /* 左右边缘中部指示器 */
  const midY = F.y + F.h / 2;
  g.fillStyle = G3;
  g.fillRect(F.x + 2, midY - 3, 4, 6);
  g.fillRect(F.x + F.w - 6, midY - 3, 4, 6);
};

/* ─── ⑧ 连续无伤 combo 光晕 ───────────────────────────────── */
CorridorPhase.perfectT = 0;
CorridorPhase._drawPerfectAura = function (g) {
  const F = CF.FRAME;
  const T = this.perfectT;
  if (T < 3) return;
  const pulse = 0.55 + 0.45 * Math.sin(T * 3);
  const alpha = Math.min(0.5, (T - 3) / 8) * pulse;

  /* 内光晕（4 边） */
  g.globalAlpha = alpha;
  g.strokeStyle = "#7ec8ff";
  g.lineWidth = 2;
  g.strokeRect(F.x + 5, F.y + 5, F.w - 10, F.h - 10);

  /* 外光晕 */
  g.globalAlpha = alpha * 0.5;
  g.strokeStyle = "#7ec8ff";
  g.lineWidth = 1;
  g.strokeRect(F.x + 1, F.y + 1, F.w - 2, F.h - 2);

  /* 计数文字 */
  if (T >= 5) {
    g.globalAlpha = alpha * 1.5;
    g.font = "bold 10px 'Courier New', monospace";
    g.textAlign = "center";
    g.textBaseline = "top";
    g.fillStyle = "#7ec8ff";
    g.fillText("无伤 " + T.toFixed(1) + "s", F.x + F.w / 2, F.y + F.h + 18);
  }
  g.globalAlpha = 1;
};

/* 更新 combo 计时器（挂在 update 尾部） */
const _origCorridorUpdate21 = CorridorPhase.update;
CorridorPhase.update = function (dt) {
  _origCorridorUpdate21.call(this, dt);
  if (this.active) {
    if (Soul.invuln <= 0) this.perfectT += dt;
    else this.perfectT = 0;
  } else {
    this.perfectT = 0;
  }
};
